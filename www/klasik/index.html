  const url=kmPayUrl(),P=window.Capacitor&&window.Capacitor.Plugins&&window.Capacitor.Plugins.Share;

function gercekFx(lg){const W=GERCEK_FX[lg];if(!W)return null;const ids=new Set(LEAGUES[lg].t.map(r=>r[0]));const n=ids.size;
  if(W.length!==2*(n-1)||W.some(w=>w.length!==n/2||w.some(m=>!ids.has(m[0])||!ids.has(m[1]))))return null;
  return W.map(w=>w.map(m=>({h:m[0],a:m[1],hs:null,as:null})))}
function fixturesFor(ids){
  const n=ids.length,arr=ids.slice(),rounds=[];
  for(let r=0;r<n-1;r++){const w=[];for(let i=0;i<n/2;i++){const a=arr[i],b=arr[n-1-i];w.push(r%2===0?{h:a,a:b,hs:null,as:null}:{h:b,a:a,hs:null,as:null})}rounds.push(w);arr.splice(1,0,arr.pop())}
  const second=rounds.map(w=>w.map(m=>({h:m.a,a:m.h,hs:null,as:null})));
  return rounds.concat(second);
}
function newCareer(lg,id){
  const ids=LEAGUES[lg].t.map(r=>r[0]);
  const R=rng(Date.now()&0xffffffff);const sh=ids.slice();for(let i=sh.length-1;i>0;i--){const j=Math.floor(R()*(i+1));[sh[i],sh[j]]=[sh[j],sh[i]]}
  S.car={lg,id,year:(S.car&&S.car.lg===lg&&S.car.id===id)?S.car.year+1:2026,week:1,fx:gercekFx(lg)||fixturesFor(sh),goals:{},last:null,done:false,history:(S.car&&S.car.history)||[]};
  persist();
}
function table(c){
  c=c||S.car;const T={};LEAGUES[c.lg].t.forEach(r=>T[r[0]]={id:r[0],o:0,g:0,b:0,m:0,a:0,y:0,p:0,form:[]});
  c.fx.forEach(w=>w.forEach(m=>{if(m.hs===null)return;const H=T[m.h],A=T[m.a];H.o++;A.o++;H.a+=m.hs;H.y+=m.as;A.a+=m.as;A.y+=m.hs;
    if(m.hs>m.as){H.g++;A.m++;H.p+=3;H.form.push('G');A.form.push('M')}else if(m.hs<m.as){A.g++;H.m++;A.p+=3;A.form.push('G');H.form.push('M')}else{H.b++;A.b++;H.p++;A.p++;H.form.push('B');A.form.push('B')}}));
  return Object.values(T).sort((x,y)=>y.p-x.p||(y.a-y.y)-(x.a-x.y)||y.a-x.a||team(c.lg,x.id).name.localeCompare(team(c.lg,y.id).name,'tr'));
}
function simScore(h,a){const lh=clamp(1.4+(h.str-a.str)*.16+.15,.25,4),la=clamp(1.1+(a.str-h.str)*.16,.2,4);return[poisson(lh),poisson(la)]}
function addGoals(c,tm,n){if(!n)return;const sq=squad(tm);const w={K:0,D:1,O:3,F:6};for(let i=0;i<n;i++){const tot=sq.reduce((s,p)=>s+w[p.pos],0);let r=Math.random()*tot;let pick=sq[10];for(const p of sq){r-=w[p.pos];if(r<=0){pick=p;break}}c.goals[pick.id]=(c.goals[pick.id]||0)+1}}
function myMatch(c){c=c||S.car;if(!c||c.week>c.fx.length)return null;return c.fx[c.week-1].find(m=>m.h===c.id||m.a===c.id)}
function finishWeek(myH,myA,scorers){
  const c=S.car,w=c.fx[c.week-1];
  for(const m of w){const H=team(c.lg,m.h),A=team(c.lg,m.a);
    if(m.h===c.id||m.a===c.id){m.hs=myH;m.as=myA;
      if(scorers){for(const pid of scorers.h)c.goals[pid]=(c.goals[pid]||0)+1;for(const pid of scorers.a)c.goals[pid]=(c.goals[pid]||0)+1}
      else{addGoals(c,H,m.hs);addGoals(c,A,m.as)}}
    else{const[x,y]=simScore(H,A);m.hs=x;m.as=y;addGoals(c,H,x);addGoals(c,A,y)}}
  c.last=c.week;c.week++;
  if(c.week>c.fx.length){c.done=true;const t=table(c);const pos=t.findIndex(r=>r.id===c.id)+1;c.history.push({year:c.year,team:c.id,lg:c.lg,pos,champ:team(c.lg,t[0].id).name});
    if(pos===1)UI.kupaAni={tur:'lig',ad:LEAGUES[c.lg].kurgu,t:team(c.lg,c.id)};}
  persist();
}
function leaders(c,n=10){const all={};LEAGUES[c.lg].t.forEach(r=>{const t=team(c.lg,r[0]);[...squad(t),...bench(t)].forEach(p=>all[p.id]={p,t})});return Object.entries(c.goals).filter(([k])=>all[k]).map(([k,g])=>({...all[k],g})).sort((a,b)=>b.g-a.g||a.p.n.localeCompare(b.p.n,'tr')).slice(0,n)}

  return lg.flatMap(l=>LEAGUES[l].t.map(r=>({l,id:r[0],p:r[5]+6*(LEAGUES[l].it||.6)+(hashStr(l+r[0])%97)/1000}))).sort((a,b)=>b.p-a.p).filter(x=>(say[x.l]=(say[x.l]||0)+1)<=Math.max(4,Math.ceil((n||K.n)/Math.max(1,lg.length)))).slice(0,n||K.n).map(x=>[x.l,x.id])}
function kupaKatilim(id){if(id!=='kit')return kupaHavuz(id);const pay={avr:3,kon:2,kuz:1,ipe:1,sav:1};return Object.entries(pay).flatMap(([k,n])=>kupaHavuz(k,n))}

  const b=ben.split(':'),ilk=[];for(let i=0;i<t.length;i+=2)ilk.push({a:t[i],b:t[i+1],s:null});S.kupa={id,ben:b,tur:0,esle:[ilk],bitti:false,elendi:false};persist()}

function kupaKazanan(m){if(!m.s)return null;const[x,y,p]=m.s;return x>y||x===y&&p&&p[0]>p[1]?m.a:m.b}

function kupaIlerle(){const k=S.kupa,tur=k.esle[k.tur];
  for(const m of tur)if(!m.s&&(k.elendi||!(ayni(m.a,k.ben)||ayni(m.b,k.ben))))m.s=kupaSimSonuc(m.a,m.b);

  if(k.elendi)kupaIlerle()}

function uzatmaKontrol(sinir){if(M.demo)return M.clock>=sinir; /* gösterim / canlandırma: süre tam dolunca biter (gerçek maç senaryosu kendi dakikalarını yönetir) */
  if(M.uz==null&&M.clock>=sinir){M.uz=M.half===1?1+Math.floor(Math.random()*4):M.half===2?3+Math.floor(Math.random()*4):1+Math.floor(Math.random()*2);banner('UZATMA','+'+M.uz+' DAKİKA',null,true);setTimeout(()=>{try{hideBanner()}catch(e){}},1800)}
  const bitis=M.uz==null?Infinity:sinir+M.uz*M.dur/90;const olu=M.durdu;M.durdu=0;if(M.clock<bitis)return false;
  /* süre dolunca düdük ancak tehlike yokken: kale vuruşu, kendi yarısında taç ya da top orta bölgeye uzaklaştırılınca. Korner ve ceza sahası yakınındaki taç kullanılır;
     şut/orta havadayken ya da top ceza sahasındayken düdük çalmaz. En geç ~4 dk sonra top kaleye 24 m+ uzaksa, ~7 dk sonra top ceza sahası dışındaysa. */
  const b=M.ball,u=Math.min(b.y,PL-b.y),temiz=!b.shot&&!b.cross;
  if(u<20)return false; /* top ceza sahalarından birinde (ya da hemen önünde) ya da kale vuruşu/korner/penaltı bekliyor: hakem ASLA düdük çalmaz */
  return (olu===1&&u>30)||(!olu&&!tehlike())||(M.clock>=bitis+M.dur*.045&&temiz&&u>24)||(M.clock>=bitis+M.dur*.08&&temiz)}
function step(dt){
  if(M.demo){M.input.x=0;M.input.y=0}else readInput();
  if(M.state==='tekrar'){kmTekrarAdim(dt);camera(dt);return}
  if(M.state!=='play'){
    M.stateT-=dt;
    for(const p of M.P){p.vx*=.85;p.vy*=.85;p.x+=p.vx*dt;p.y+=p.vy*dt;p.anim+=Math.hypot(p.vx,p.vy)*dt}
    if(M.state==='goal'||M.state==='half')moveOffBall(dt,true);
    const yol=M.state==='pre'&&M.setPiece&&M.setPiece.yol;
    if(yol){const q=M.setPiece.p,ddx=yol.tx-q.x,ddy=yol.ty-q.y,dd=Math.hypot(ddx,ddy);if(yol.bekle>0||M.stateT<.3){const qx=q.x,qy=q.y,qa=q.anim;moveOffBall(dt,true);q.x=qx;q.y=qy;q.anim=qa}q.vx=q.vy=0; /* uzun yürüyüşte diğerleri de yerlerine geçer */
      if(dd>.05){const v=Math.min(11,2+dd*2.5),s=Math.min(dd,v*dt);q.x+=ddx/dd*s;q.y+=ddy/dd*s;q.anim+=s;q.dx=ddx/dd;q.dy=ddy/dd}
      else{q.x=yol.tx;q.y=yol.ty;q.dx=yol.fx;q.dy=yol.fy}
      if(M.stateT<=0&&dd>.3&&(yol.bekle+=dt)<6)M.stateT=.05;   /* oyuncu topa varmadan vuruş yok (en çok ~6 sn bekler) */
      if(M.stateT<=0){q.x=yol.tx;q.y=yol.ty;q.dx=yol.fx;q.dy=yol.fy;M.setPiece.yol=null}}
    if(M.stateT<=0){const f=M.after;M.after=null;if(f)f();else M.state='play';}
    if(M.state==='pre')mesafeKurali();
    M.input.pasE=M.input.sutE=false;
    camera(dt);return;
  }
  M.clock+=dt;
  const mn=minLabel();
  const molaIpucu=M.demo?'':M.asist[0]?' · II: KONUŞMA':' · II: DEĞİŞİKLİK, KONUŞMA';
  if(M.half===1&&uzatmaKontrol(M.dur/2)){M.uz=null;M.clock=M.dur/2;M.half=2;M.state='half';M.stateT=3;SND.whistle(2);banner('DEVRE','ARASI · '+M.T[0].score+'-'+M.T[1].score+molaIpucu,null,true);kmMola(1);M.after=()=>{M.flip=true;M.tAtt=null;M.possTeam=null;M.TP=null;if(camMode()===1)buildPitch();kickoff(1);M.state='pre';M.stateT=.8;SND.whistle(1);banner('2. YARI','KALELER DEĞİŞTİ',null,true)};return}
  const esit=()=>M.uzFark!=null&&M.T[0].score-M.T[1].score===M.uzFark;
  if(M.half===2&&uzatmaKontrol(M.dur)){M.uz=null;
    if(esit()){M.s90=[M.T[0].score,M.T[1].score];M.uzVar=true;M.hak={n:6,w:4};M.clock=M.dur;M.half=3;M.state='half';M.stateT=3.4;SND.whistle(2);banner('UZATMA','2×15 DAKİKA · +1 DEĞİŞİKLİK'+molaIpucu,null,true);kmMola(2);
      M.after=()=>{M.flip=!M.flip;M.tAtt=null;M.possTeam=null;M.TP=null;if(camMode()===1)buildPitch();kickoff(0);M.state='pre';M.stateT=.8;SND.whistle(1);banner('UZATMA','1. YARI',null,true)};return}
    kmBitir();return}
  if(M.half===3&&uzatmaKontrol(M.dur*7/6)){M.uz=null;M.clock=M.dur*7/6;M.half=4;M.state='half';M.stateT=2;SND.whistle(2);banner('UZATMA','DEVRE ARASI · '+M.T[0].score+'-'+M.T[1].score,null,true);
    M.after=()=>{M.flip=!M.flip;M.tAtt=null;M.possTeam=null;M.TP=null;if(camMode()===1)buildPitch();kickoff(1);M.state='pre';M.stateT=.8;SND.whistle(1);banner('UZATMA','2. YARI',null,true)};return}
  if(M.half===4&&uzatmaKontrol(M.dur*8/6)){M.uz=null;if(esit())kmPenaltiBasla();else kmBitir();return}
  if(mn!==M._lm){M._lm=mn;hud()}
  M.manualT=Math.max(0,(M.manualT||0)-dt);
  updateCtrl();
  btnLabels();
  for(const p of M.P){p.cd=Math.max(0,p.cd-dt);p.scd=Math.max(0,(p.scd||0)-dt);p.stun=Math.max(0,p.stun-dt);p.dec-=dt}
  kmKondisyon(dt);kmOtoDeg();
  /* duran top */
  if(M.setPiece){M.setPiece.t+=dt;const sp=M.setPiece.p;if(M.ball.owner!==sp){M.setPiece=null}}
  /* oyuncular */
  tacticalPrep(dt);
  for(const p of M.P)think(p,dt);
  for(const p of M.P)movePlayer(p,dt);
  separate();mesafeKurali();if(M.ist&&M.possTeam!=null)M.ist.top[M.possTeam]+=dt;
  ballStep(dt);mesafeKurali();

function btnLabels(){if(M.demo)return;const att=!!(M.ball.owner&&M.ball.owner.team===0);if(att===M._att)return;M._att=att;
  $('#bPas span').innerHTML=(att?'PAS':'SEÇ')+'<small class="kb">X</small>';$('#bSut span').innerHTML=(att?'ŞUT':'KAY')+'<small class="kb">Z</small>';
  $('#bPas').classList.toggle('def',!att);$('#bSut').classList.toggle('def',!att)}
function camera2D(dt){const b=M.ball,vw=IW/SC,vh=IH/SC;let tx=b.x,ty=b.y+(b.owner?fwdOf(b.owner.team)*6:0);
  tx=vw>PW+8?PW/2:clamp(tx,vw/2-4,PW-vw/2+4);ty=clamp(ty,vh*.2,PL-vh*.2);M.cam.x+=(tx-M.cam.x)*Math.min(1,dt*4);M.cam.y+=(ty-M.cam.y)*Math.min(1,dt*4)}

/* ---------- Kontrol değişimi ---------- */
function updateCtrl(){
  if(M.demo){M.ctrl=null;return}
  const b=M.ball,mine=M.P.filter(p=>p.team===0);
  if(b.owner&&b.owner.team===0){M.ctrl=b.owner;return}
  if(b.intended&&b.intended.team===0&&!b.owner){M.ctrl=b.intended;return}
  const field=mine.filter(p=>p.role!=='G');
  let best=null,bd=1e9;for(const p of field){const d=Math.hypot(p.x-b.x,p.y-b.y);if(d<bd){bd=d;best=p}}
  const cur=M.ctrl&&M.ctrl.team===0&&M.ctrl.role!=='G'?M.ctrl:null;
  if(M.input.pasE&&!(b.owner&&b.owner.team===0)){
    const ord=field.map(p=>({p,d:Math.hypot(p.x-b.x,p.y-b.y)})).sort((a,c)=>a.d-c.d);
    M.ctrl=(cur&&ord[0].p===cur&&ord[1])?ord[1].p:ord[0].p;M.input.pasE=false;M.manualT=1.5;SND.tone(1200,.05,'square',.05);return}
  if(!cur){M.ctrl=best;return}
  if(M.manualT>0||cur.slide>0)return;
  const cd=Math.hypot(cur.x-b.x,cur.y-b.y);
  const pushing=M.input.x||M.input.y;
  if(best!==cur&&((!pushing&&cd-bd>3.5)||(pushing&&cd-bd>8)||cd>18))M.ctrl=best;
}

/* ---------- Yapay zeka / insan kararları ---------- */
function teamHasBall(ti){return M.ball.owner&&M.ball.owner.team===ti}
function nearestOpp(p){let best=null,bd=1e9;for(const q of M.P)if(q.team!==p.team){const d=Math.hypot(q.x-p.x,q.y-p.y);if(d<bd){bd=d;best=q}}return[best,bd]}
function chasers(ti){ /* topa en yakın iki saha oyuncusu */
  const b=M.ball,list=M.P.filter(p=>p.team===ti&&p.role!=='G').map(p=>({p,d:Math.hypot(p.x-b.x,p.y-b.y)})).sort((a,c)=>a.d-c.d);return list}
/* ===================== TAKTİK: 4-2-3-1 =====================
   Mevkiler (forma no): 1 kaleci (oyunu kurar, önü boş topa çıkar) · 2 sağ bek (bindirir) · 3 sol bek (bindirir, orta açar)
   4 stoper (sert savunmacı) · 5 stoper (geriden oyun kurar, boşsa topla çıkar) · 6 dinamo (her topa baskı, savunma önü)
   8 box-to-box (ceza sahasına geç gelir) · 7 sağ açık (içe de dışa da gider) · 10 oyun kurucu (hatlar arası, uzaktan vurur)
   9 ikinci forvet (soldan içeri kayar) · 11 santrfor (topu saklar, kafası iyi, arkaya koşar).
   Blok: savunma hattı topa ve topa sahip olmaya göre yükselir; hatlar arası mesafe kısa tutulur. */
const ROLES=['GK','LB','LCB','RCB','RB','SS','DM','CM','RW','AM','ST'];
const SLOT={LB:{lx:-.86,dIn:12,dOut:1},LCB:{lx:-.3,dIn:0,dOut:0},RCB:{lx:.3,dIn:0,dOut:0},RB:{lx:.86,dIn:13,dOut:1},
  SS:{lx:-.62,dIn:27,dOut:14},DM:{lx:-.06,dIn:9,dOut:8},CM:{lx:.24,dIn:17,dOut:10},RW:{lx:.88,dIn:27,dOut:13},AM:{lx:.05,dIn:22,dOut:17},ST:{lx:0,dIn:31,dOut:24}};
/* özellikler: hız, top saklama (kapılma direnci), şut menzili, kafa, kayma becerisi, orta isteği */
const TRAIT={GK:{},LB:{cross:.7},RB:{spd:.03,cross:.45},RCB:{tackle:.25},LCB:{carry:1},DM:{spd:.04,tackle:.3,press:1},CM:{spd:.02},
  RW:{spd:.05,cross:.4},AM:{range:30},SS:{range:26},ST:{hold:.55,head:.25}};
const tr=(p,k,d=0)=>{const t=TRAIT[p.pos];return t&&t[k]!=null?t[k]:d};
const depthOf=(ti,y)=>Math.abs(y-ownGoalY(ti));
const yAtDepth=(ti,d)=>ownGoalY(ti)+fwdOf(ti)*d;
const rightOf=ti=>fwdOf(ti)===-1?1:-1; /* takımın sağ kanadı +x yönünde mi */
function teamPlan(ti){return(M.TP&&M.TP[ti])||{poss:false,line:24,cx:PW/2,ws:.7,last:PL-14,mid:PL-30,mode:'def'}}
/* CBM dizilişiyle gelen oyuncu: yerin (pos) temel davranışı korunur, yanal konum ve derinlik kendi diziliş noktasından (fx, fy) gelir — aynı yerde iki oyuncu üst üste binmez */
const SLOT_FY={LB:.2,LCB:.15,RCB:.15,RB:.2,SS:.42,DM:.3,CM:.36,RW:.42,AM:.43,ST:.47};
function dzSlot(p){const B=SLOT[p.pos];if(!B)return null;const df=((p.fy??SLOT_FY[p.pos])-SLOT_FY[p.pos])*100;
  return{lx:clamp((p.fx-.5)*2,-.95,.95),dIn:Math.max(0,B.dIn+df*.8),dOut:Math.max(0,B.dOut+df*.6)}}
function slotPos(p,inPoss){const ti=p.team,P=teamPlan(ti),S=p.dz?dzSlot(p):SLOT[p.pos];if(!S)return home(p);
  const d=P.line+(inPoss?S.dIn:S.dOut),x=P.cx+rightOf(ti)*S.lx*31*(inPoss?1:P.ws);
  return{x:clamp(x,2,PW-2),y:yAtDepth(ti,clamp(d,3,PL-6))}}
function tacticalPrep(dt){
  const b=M.ball,cur=b.owner?b.owner.team:null;
  /* takım şekli ancak top ~0.45 sn el değiştirmiş kalırsa döner (sürekli savrulmasın) */
  if(cur!==null){if(cur===M.possTeam)M.candT=0;else{M.candT=(M.candT||0)+dt;if(M.candT>.45||M.possTeam==null){M.possTeam=cur;M.candT=0}}}
  const att=M.possTeam==null?b.lastTeam:M.possTeam;
  if(att!==M.tAtt){M.tAtt=att;M.transT=1.4;M.prepT=0;
    /* top kazanıldı: rakibin çoğu topun önündeyse değil, gerisindeyse kontra */
    const ahead=M.P.filter(q=>q.team!==att&&q.role!=='G'&&depthOf(att,q.y)>depthOf(att,b.y)+2).length;
    M.counterT=(ahead<=5&&depthOf(att,b.y)<72)?4.5:0;M.counterTeam=att}
  M.transT=Math.max(0,(M.transT||0)-dt);M.counterT=Math.max(0,(M.counterT||0)-dt);
  M.prepT=(M.prepT||0)-dt;if(M.prepT>0&&M.marks)return;M.prepT=.25;
  M.TP=[0,1].map(ti=>{
    const poss=att===ti,bd=depthOf(ti,b.y);
    let last=0,ms=0,mn=0;for(const q of M.P){if(q.team===ti||q.role==='G')continue;const d=depthOf(ti,q.y);if(q.role==='D')last=Math.max(last,d);else if(q.role==='O'){ms+=d;mn++}}
    if(!last)last=PL-14;const mid=mn?ms/mn:last-12;
    let line,cx,ws;
    if(poss){line=clamp(bd-18,26,50);cx=PW/2+(b.x-PW/2)*.22;ws=1}
    else{const hi=M.demo||!M.T[1-ti].human?1:[.9,.96,1][M.diff];line=clamp((bd*.62-4)*hi,8,38);cx=PW/2+(b.x-PW/2)*.5;ws=.62}
    return{poss,line,cx,ws,last:Math.min(last,PL-3),mid,mode:poss?(M.counterT>0&&M.counterTeam===ti?'counter':'build'):'def'}});
  /* adam paylaşımı: savunmacı yalnız kendi bölgesine gelen rakibi tutar */
  M.marks=new Map();const def=1-att;
  let presser=null,pd=1e9;for(const q of M.P)if(q.team===def&&q.role!=='G'){const d=Math.hypot(q.x-b.x,q.y-b.y);if(d<pd){pd=d;presser=q}}
  const used=new Set([presser]);
  const attackers=M.P.filter(q=>q.team===att&&q.role!=='G'&&q!==b.owner).sort((a,c)=>depthOf(def,a.y)-depthOf(def,c.y));
  const vsHuman=!M.demo&&M.T[att].human,zone=(vsHuman?[22,28,34][M.diff]:30)+M.TP[def].line;
  for(const a of attackers){if(depthOf(def,a.y)>zone)continue;
    let best=null,bd=1e9;for(const d of M.P){if(d.team!==def||d.role==='G'||used.has(d))continue;const s=slotPos(d,false);
      let dd=Math.hypot(s.x-a.x,s.y-a.y)+(d.pos==='ST'||d.pos==='AM'||d.pos==='SS'?14:0)+(d.pos==='RW'?5:0);
      const prev=M.prevMarks&&M.prevMarks.get(d);if(prev===a)dd-=4;if(dd<bd){bd=dd;best=d}}
    if(best&&bd<15){used.add(best);M.marks.set(best,a)}}
  M.prevMarks=M.marks;
}
function deepestLine(ti){return yAtDepth(ti,teamPlan(ti).last)}
function offBallTarget(p){
  const b=M.ball,ti=p.team,P=teamPlan(ti),pos=p.pos,R=rightOf(ti);
  const dist=(x,y)=>Math.hypot(x-p.x,y-p.y),urg=M.transT>0?.12:0;
  const fin=(x,y,run)=>{x=clamp(x,1.5,PW-1.5);y=clamp(y,2,PL-2);
    if(P.poss){const c=b.owner&&b.owner.team===ti?b.owner:null;
      /* topçuya en az 9 m: pas açısı ver, üstüne yığılma */
      if(c&&c!==p){const ux=x-c.x,uy=y-c.y,d0=Math.hypot(ux,uy)||1;if(d0<9){x=c.x+ux/d0*9;y=c.y+uy/d0*9}}
      /* takım arkadaşına en az 7 m */
      for(const q of M.P){if(q.team!==ti||q===p||q===c||q.role==='G')continue;const ux=x-q.x,uy=y-q.y,d0=Math.hypot(ux,uy);if(d0<7&&d0>0){x+=ux/d0*(7-d0)*.6;y+=uy/d0*(7-d0)*.3}}
      let o=null,od=1e9;for(const q of M.P)if(q.team!==ti){const d=Math.hypot(q.x-x,q.y-y);if(d<od){od=d;o=q}}
      if(o&&od<3.5){const ux=(x-o.x)/(od||1),uy=(y-o.y)/(od||1);x+=ux*(3.5-od);y+=uy*(3.5-od)*.5}}
    const dd=dist(x,y);return{x:clamp(x,1.5,PW-1.5),y:clamp(y,2,PL-2),run:Math.min(1,(run!=null?run:(dd>7?.95:dd>2.5?.78:.55))+urg)}};
  const at=(d,x,run)=>fin(x,yAtDepth(ti,clamp(d,2,PL-3)),run);
  const sideX=lx=>P.cx+R*lx*31;
  if(!P.poss){ /* savunma: blok + bölgesel adam paylaşımı */
    const s=slotPos(p,false),bd=depthOf(ti,b.y);
    if(pos==='DM'&&bd<P.line+40){return at(clamp(bd-6,P.line+3,P.line+15),s.x+(b.x-s.x)*.5,.95)} /* savunma önünü kapatır */
    const m=M.marks&&M.marks.get(p);
    if(m){const og=ownGoalY(ti),md=depthOf(ti,m.y),dx=PW/2-m.x,dy=og-m.y,d=Math.hypot(dx,dy)||1,gap=md<22?1.8:md<34?2.6:3.4;
      let x=m.x+dx/d*gap+m.vx*.15,y=m.y+dy/d*gap+m.vy*.15;
      const floor=P.line-3;if(md>floor&&depthOf(ti,y)<floor)y=yAtDepth(ti,floor); /* koşucu hattı geçmedikçe hattın gerisine düşme */
      return fin(x,y,dist(x,y)>2.5?1:.8)}
    return fin(s.x,s.y)}
  /* hücum */
  const car=b.owner&&b.owner.team===ti?b.owner:null,ref=car||b,cd=depthOf(ti,ref.y),bx=ref.x,ballR=(bx-PW/2)*R>0;
  const s=slotPos(p,true);
  if(car&&car.role==='G'){ /* kaleci oyunu kuruyor: stoperler açılır, bekler yükselir, 6 numara gelir */
    if(pos==='LCB'||pos==='RCB')return at(8,PW/2+R*(pos==='RCB'?1:-1)*15,.9);
    if(pos==='LB'||pos==='RB')return at(22,sideX(pos==='RB'?.95:-.95),.9);
    if(pos==='DM')return at(22,PW/2+(p.x>PW/2?3:-3),.9)}
  if(P.mode==='counter'&&(pos==='ST'||pos==='SS'||pos==='RW'||pos==='AM'||pos==='CM')){
    const d=Math.min(P.last+3,cd+(pos==='CM'?12:pos==='AM'?16:24)),lx={ST:0,SS:-.55,AM:.12,CM:.3,RW:.8}[pos];return at(d,sideX(lx),1)}
  switch(pos){
    case'LB':case'RB':{const mine=(pos==='RB')===ballR,tx=(pos==='RB')===(R>0)?PW-2.5:2.5;
      if(mine&&cd>34&&car&&car!==p&&car.pos!=='LCB'&&car.pos!=='RCB')return at(Math.min(cd+10,P.last+1),tx,1); /* bindirme */
      if(!mine)return at(P.line+4,sideX(pos==='RB'?.66:-.66)); /* öbür bek dengede kalır */
      return fin(s.x,s.y)}
    case'LCB':case'RCB':return at(P.line,s.x);
    case'DM':return at(clamp(cd-11,P.line+5,P.line+22),s.x+(bx-s.x)*.3); /* topun gerisinde güvenli pas istasyonu */
    case'CM':if(cd>PL-40&&car&&car!==p)return at(Math.min(PL-11,P.last+1),PW/2+R*4,1); /* ceza sahasına geç koşu */
      return at(clamp(cd+2,P.line+10,PL-22),PW/2-(bx-PW/2)*.45+R*6); /* topun öbür yarısında, ters kanattan destek */
    case'AM':return at(clamp((P.last+P.mid)/2,cd+10,PL-16),PW/2+(bx-PW/2)*.25+R*3); /* hatlar arasındaki cep */
    case'ST':{const ph=(M.clock*.3+p.i*.41+ti*.2)%1;
      if(car&&cd>28&&ph<.55)return at(Math.min(P.last+2.5,PL-7),PW/2+(bx-PW/2)*.2,1); /* savunma arkasına koşu */
      return at(Math.max(P.last-5,cd+14),PW/2+(bx-PW/2)*.2)} /* topa gelip saklar */

function doPass(p,dx,dy,target){

function doAraPas(p,dx,dy){const q=bestPass(p,dx,dy,true);if(!q){doPass(p,dx,dy);return}

function doShoot(p,aimX,pow){pow=pow||1;if(M.ist){M.ist.sut[p.team]++;kmOy(p).s++}

    if(B.vert){g.save();g.translate(ox+B.x,oy+B.y+B.len);g.rotate(-Math.PI/2);g.drawImage(c,0,0,B.len,th);g.restore()}else g.drawImage(c,ox+B.x,oy+B.y,B.len,th)}
  g.imageSmoothingEnabled=false;

  const[x0,y0]=W(GX0,PL),[x1]=W(GX1,PL);g.fillStyle='#ffffff';g.fillRect(x0-1,y0-Math.round(GH*SC*.9),2,Math.round(GH*SC*.9));g.fillRect(x1,y0-Math.round(GH*SC*.9),2,Math.round(GH*SC*.9));g.fillRect(x0-1,y0-Math.round(GH*SC*.9),x1-x0+3,2);

function drawBall(g,W){const b=M.ball;const[sx,sy]=W(b.x,b.y);const zy=Math.round(b.z*SC*.9);const r=Math.floor(((b.owner?b.owner.anim:Math.hypot(b.x,b.y))*3))%2;
  g.fillStyle='#ffffff';g.fillRect(sx-1,sy-2-zy,3,3);g.fillStyle='#1d1d1d';g.fillRect(sx-1+r,sy-2-zy+r,1,1);g.fillStyle='#bbbbbb';g.fillRect(sx+1,sy-zy,1,1)}
function drawPlayer(g,p,W){
  const[sx,sy]=W(p.x,p.y);if(sx<-10||sx>IW+10||sy<-20||sy>IH+10)return;

   TV kamerasının çizim motoru tek ortak motor; Dinamik, Tele ve Stadyum onun farklı açılardaki çatallarıdır.

const CAMS={
  1:{ad:'Dinamik',h:21,R:33,wl:50,wp:25,cyl:.62,cyp:.62,HK:1.1},
  2:{ad:'Tele',yaw:.42,h:24,R:56,wl:46,wp:30,cyl:.58,cyp:.56,HK:1.15},

function bcP(x,y,z){const dx=x-BC.x,dy=y-BC.y,d=dx*BC.f[0]+dy*BC.f[1];if(d<NEAR*.999)return null;const s=BC.F/d;return[IW/2+(dx*BC.r[0]+dy*BC.r[1])*s,BC.oy+(BC.h-(z||0))*s,s,d]}

/* yakın düzlemde kırpma: çokgen ve doğru parçası (kameranın arkasına taşan zemin/çizgi kaybolmaz, kara boşluk kalmaz) */
function clipW(pts){const o=[],N=NEAR+.01;for(let i=0;i<pts.length;i++){const A=pts[i],B=pts[(i+1)%pts.length],da=bcD(A[0],A[1])-N,db=bcD(B[0],B[1])-N;
    if(da>=0)o.push(A);if((da>=0)!==(db>=0)){const t=da/(da-db);o.push([A[0]+(B[0]-A[0])*t,A[1]+(B[1]-A[1])*t,(A[2]||0)+((B[2]||0)-(A[2]||0))*t])}}return o}

function segW(path,A,B,zk){let a=A,b=B;const N=NEAR+.01,da=bcD(a[0],a[1])-N,db=bcD(b[0],b[1])-N;if(da<0&&db<0)return null;
  if(da<0||db<0){const t=da/(da-db),P=[a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t,(a[2]||0)+((b[2]||0)-(a[2]||0))*t];if(da<0)a=P;else b=P}
  const p=bcP(a[0],a[1],(a[2]||0)*(zk||1)),q=bcP(b[0],b[1],(b[2]||0)*(zk||1));if(!p||!q)return null;path.moveTo(p[0],p[1]);path.lineTo(q[0],q[1]);return(p[2]+q[2])/2}

function bcResize(W,H){

/* ===================== STADYUM MİMARİSİ =====================
   Sahaya yakın, dik, iki katlı tribünler; katlar arasında camlı loca kuşağı; kapalı (yuvarlatılmış) köşeler;
   çelik makaslı çatı ve saçak boyunca projektör sırası; kuzey kale arkasında tek parça dev tribün.
   Seyirci renkleri yalnızca maçtaki iki takımın formalarından gelir (kulüp teması yok). */
const STD={side:7,end:8,
  low:[0,1.2,13,9],vip:[13.3,9.2,12.6],up:[14,12.6,30,26],back:[30,26,29.5],roof:[31,29.5,3,31],fasc:[3,29.7,31.7],
  wall:{tier:[0,1.2,36,30],back:[36,30,33],roof:[37,33,5,34.6],fasc:[5,33.2,35.2]}};
/* iç kenar halkası: düz kenarlar + köşe yayları; her parça a→b, o uzaklıkta dışa kayar */
function stadRing(mask){
  const S=STD.side,E=STD.end,P=[],seg=(side,ax,ay,bx,by,nx,ny,n)=>{for(let i=0;i<n;i++){const t0=i/n,t1=(i+1)/n;
      P.push({side,arc:false,a:[ax+(bx-ax)*t0,ay+(by-ay)*t0],b:[ax+(bx-ax)*t1,ay+(by-ay)*t1],n:[nx,ny]})}},
    arc=(side,cx0,cy0,a0,a1,n)=>{for(let i=0;i<n;i++){const t0=a0+(a1-a0)*i/n,t1=a0+(a1-a0)*(i+1)/n;P.push({side,arc:true,c:[cx0,cy0],t0,t1})}};
  if(mask.W)seg('W',-S,PL+E,-S,-E,-1,0,4);
  if(mask.W&&mask.N)arc('NW',-S,-E,Math.PI,Math.PI*1.5,3);
  if(mask.N)seg('N',-S,-E,mask.cutE?PW*.62:PW+S,-E,0,-1,mask.cutE?2:3);
  if(mask.N&&mask.E)arc('NE',PW+S,-E,Math.PI*1.5,Math.PI*2,3);
  if(mask.E)seg('E',PW+S,-E,PW+S,PL+E,1,0,4);
  if(mask.E&&mask.S)arc('SE',PW+S,PL+E,0,Math.PI*.5,3);
  if(mask.S)seg('S',mask.cutE?PW*.62:PW+S,PL+E,-S,PL+E,0,1,mask.cutE?2:3);
  if(mask.S&&mask.W)arc('SW',-S,PL+E,Math.PI*.5,Math.PI,3);
  return P}
/* parçanın o uzaklığında iki ucu */
function ringPts(p,o){if(!p.arc)return[[p.a[0]+p.n[0]*o,p.a[1]+p.n[1]*o],[p.b[0]+p.n[0]*o,p.b[1]+p.n[1]*o]];
  return[[p.c[0]+Math.cos(p.t0)*o,p.c[1]+Math.sin(p.t0)*o],[p.c[0]+Math.cos(p.t1)*o,p.c[1]+Math.sin(p.t1)*o]]}
function bandQuad(p,o1,h1,o2,h2){const[a1,b1]=ringPts(p,o1),[a2,b2]=ringPts(p,o2);return[[a1[0],a1[1],h1],[b1[0],b1[1],h1],[b2[0],b2[1],h2],[a2[0],a2[1],h2]]}
/* stadyumu kur: dörtgenler katmanlara ayrılır (uzaktan yakına doğru boyanır), seyirci noktaları parçalara bağlanır */
function buildStadium(mask,step,heads,strips){
  step=step||1;const ring=stadRing(mask);
  const cols=[M.T[0].kit.c1,M.T[0].kit.c2,M.T[1].kit.c1,M.T[1].kit.c2,'#f1c9a5','#c68a5a','#e8e8e8','#2a2a2a','#d33a2e','#3b5b8c','#c9a227'];
  const L={roof:[],upper:[],vip:[],lower:[],fasc:[],lights:[],truss:[]};
  const fans=(p,o1,h1,o2,h2)=>{const out=[];const rows=Math.max(1,Math.round((o2-o1)/(.95*step)));
    for(let r=0;r<rows;r++){if(r%7===6)continue; /* merdiven/ara yol */
      const f=(r+.5)/rows,o=o1+(o2-o1)*f,h=h1+(h2-h1)*f;const[a,b]=ringPts(p,o);const len=Math.hypot(b[0]-a[0],b[1]-a[1]),n=Math.max(1,Math.floor(len/(.8*step)));
      for(let i=0;i<n;i++){if(Math.random()>.93)continue;const t=(i+.5+rand(-.2,.2))/n,x=a[0]+(b[0]-a[0])*t,y=a[1]+(b[1]-a[1])*t;
        const home=(y<PL/2)===(M&&!M.flip)?0:2; /* ev sahibi seyircisi bir yarıda, deplasman öbüründe yoğun */
        const ci=Math.random()<.6?(Math.random()<.72?home:2-home)+(Math.random()<.3?1:0):4+Math.floor(Math.random()*7);out.push([x,y,h+.05,ci,Math.random()*6.28])}}
    out.sort((u,v)=>u[3]-v[3]);return out};
  const noDots=p=>strips&&(!p.arc||p.side==='NW'&&mask.W||p.side==='SW'&&mask.W||p.side==='NE'&&mask.E||p.side==='SE'&&mask.E);
  for(const p of ring){const W=p.side==='N'?STD.wall:null;
    if(W){const[o1,h1,o2,h2]=W.tier;L.roof.push({q:bandQuad(p,W.roof[0],W.roof[1],W.roof[2],W.roof[3]),c:'#262b31'},{q:bandQuad(p,W.back[0],W.back[1],W.back[0],W.back[2]),c:'#3d4349'});
      L.upper.push({q:bandQuad(p,o1,h1,o2,h2),c:'#4b5056',fans:noDots(p)?null:fans(p,o1,h1,o2,h2)});
      L.fasc.push({q:bandQuad(p,W.fasc[0],W.fasc[1],W.fasc[0],W.fasc[2]),c:'#d9dde1',p,o:W.fasc[0],h:W.fasc[1]});continue}
    const[l1,lh1,l2,lh2]=STD.low,[u1,uh1,u2,uh2]=STD.up,R=STD.roof,B=STD.back,V=STD.vip,F=STD.fasc;
    L.roof.push({q:bandQuad(p,R[0],R[1],R[2],R[3]),c:'#262b31'},{q:bandQuad(p,B[0],B[1],B[0],B[2]),c:'#3d4349'});
    L.upper.push({q:bandQuad(p,u1,uh1,u2,uh2),c:'#4b5056',fans:noDots(p)?null:fans(p,u1,uh1,u2,uh2)});
    L.vip.push({q:bandQuad(p,V[0],V[1],V[0],V[2]),c:'#18222b',p,o:V[0],h:(V[1]+V[2])/2},{q:bandQuad(p,l2,lh2,u1,uh1),c:'#6d737a'});
    L.lower.push({q:bandQuad(p,l1,lh1,l2,lh2),c:'#575c62',fans:noDots(p)?null:fans(p,l1,lh1,l2,lh2)},{q:bandQuad(p,0,0,0,l1+lh1),c:'#7b8187'});
    L.fasc.push({q:bandQuad(p,F[0],F[1],F[0],F[2]),c:'#d9dde1',p,o:F[0],h:F[1]})}
  /* loca camlarında ışık, saçakta projektör, çatı altında makas */
  for(const v of L.vip){if(!v.p)continue;const[a,b]=ringPts(v.p,v.o-.3),len=Math.hypot(b[0]-a[0],b[1]-a[1]),n=Math.max(1,Math.floor(len/2.2));
    v.win=[];for(let i=0;i<n;i++){const t=(i+.5)/n;if(Math.random()<.78)v.win.push([a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t,v.h])}}
  for(const f of L.fasc){const[a,b]=ringPts(f.p,f.o-.05),len=Math.hypot(b[0]-a[0],b[1]-a[1]),n=Math.max(1,Math.floor(len/3.2));
    for(let i=0;i<n;i++){const t=(i+.5)/n;L.lights.push([a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t,f.h-.15])}
    if(!f.p.arc){const W=f.p.side==='N'?STD.wall:STD,R=W.roof,k=Math.max(1,Math.floor(len/6));
      for(let i=0;i<=k;i++){const t=i/k;const[fa,fb]=ringPts(f.p,R[2]),[ba,bb]=ringPts(f.p,R[0]);
        const F0=[fa[0]+(fb[0]-fa[0])*t,fa[1]+(fb[1]-fa[1])*t,R[3]-.6],B0=[ba[0]+(bb[0]-ba[0])*t,ba[1]+(bb[1]-ba[1])*t,R[1]-.6];
        L.truss.push([F0,B0]);if(i<k){const t2=(i+1)/k;L.truss.push([F0,[ba[0]+(bb[0]-ba[0])*t2,ba[1]+(bb[1]-ba[1])*t2,R[1]-1.8]])}}}}
  /* batı tribünü sıra şeritleri (TV: her sıra önceden çizilmiş tek görüntü, kare başına binlerce nokta yerine ~50 çizim) */
  /* tribün sıra şeritleri (düz kenarlar): her kenar ve kat için birkaç hazır sıra deseni; kare başına binlerce nokta yerine sıra başına birkaç çizim */
  L.strips={up:[],low:[]};
  if(strips){const ppm=10,k12=ppm/12,K=6,skins=['#f1c9a5','#e0ac7e','#c68a5a','#8d5a3b'];
    for(const sd of['W','N','E','S']){if(!mask[sd])continue;const ps=ring.filter(p=>p.side===sd);if(!ps.length)continue;
      for(const[key,[o1,h1,o2,h2]]of sd==='N'?[['up',STD.wall.tier]]:[['up',STD.up],['low',STD.low]]){
        const A=ringPts(ps[0],o1)[0],B=ringPts(ps[ps.length-1],o1)[1],len=Math.hypot(B[0]-A[0],B[1]-A[1]),wpx=Math.round(len*ppm),pats=[];
        for(let q=0;q<K;q++){const c=document.createElement('canvas');c.width=wpx;c.height=11;const g=c.getContext('2d');
          for(let x=2;x<wpx;x+=.8*step*ppm){if(Math.random()>.93)continue;const ym=A[1]+(B[1]-A[1])*x/wpx,home=(ym<PL/2)===(M&&!M.flip)?0:2;
            const ci=Math.random()<.6?(Math.random()<.72?home:2-home)+(Math.random()<.3?1:0):4+Math.floor(Math.random()*7);const jx=x+rand(-1,1)*k12;
            g.fillStyle=cols[ci];g.fillRect(jx-2.6*k12,3.5,5.2*k12,7.5);g.fillStyle=skins[Math.floor(Math.random()*4)];g.fillRect(jx-1.7*k12,0,3.4*k12,3.4)}
          pats.push(c)}
        const rows=Math.max(1,Math.round((o2-o1)/(.95*step)));
        for(let r=rows-1;r>=0;r--){if(r%7===6)continue;const f=(r+.5)/rows,o=o1+(o2-o1)*f,h=h1+(h2-h1)*f;
          const a=ringPts(ps[0],o)[0],b=ringPts(ps[ps.length-1],o)[1];
          L.strips[key].push({a,b,z:h,len,n:Math.max(1,Math.ceil(len/10)),r,img:pats[r%K],m:[(a[0]+b[0])/2,(a[1]+b[1])/2]})}
        /* köşe yayları da aynı desenlerle (yay parçaları kısa kirişler); batı NW/SW, doğu NE/SE yaylarını üstlenir */
        for(const ap of ring.filter(p=>p.arc&&({W:['NW','SW'],E:['NE','SE']}[sd]||[]).includes(p.side)))
          for(let r=rows-1;r>=0;r--){if(r%7===6)continue;const f=(r+.5)/rows,o=o1+(o2-o1)*f,h=h1+(h2-h1)*f,[a,b]=ringPts(ap,o),l=Math.hypot(b[0]-a[0],b[1]-a[1]);
            const sw=Math.max(4,Math.round(l*ppm)),sx=Math.floor(Math.random()*Math.max(1,wpx-sw));
            L.strips[key].push({a,b,z:h,len:l,n:1,r,img:pats[(r+3)%K],sx,sw,m:[(a[0]+b[0])/2,(a[1]+b[1])/2]})}}}}
  return{L,cols,heads:!!heads}}
/* canvas üzerinde boya: pr(x,y,z) -> [sx,sy,s] | null ; poly(points,color) dolu çokgen ; cam:[x,y] uzaktan yakına sıralama için */
function drawStadium(g,ST,pr,poly,cam,cel,above){
  if(!ST)return;const L=ST.L,far=o=>{let x=0,y=0;for(const p of o.q){x+=p[0];y+=p[1]}x/=o.q.length;y/=o.q.length;return-Math.hypot(x-cam[0],y-cam[1])};
  const sorted=a=>(a._s||(a._s=a.slice())).sort((u,v)=>far(u)-far(v));
  if(!above)for(const o of sorted(L.roof))poly(o.q,o.c);
  if(!above){g.strokeStyle='rgba(120,128,138,.55)';g.lineWidth=1;g.beginPath();
  for(const[A,B]of L.truss){const a=pr(...A),b=pr(...B);if(a&&b){g.moveTo(a[0],a[1]);g.lineTo(b[0],b[1])}}g.stroke()}
  const tt=performance.now()/1000;
  const dots=fs=>{let last=-1;for(const d of fs){const q=pr(d[0],d[1],d[2]+(cel&&d[4]<4.2?Math.max(0,Math.sin(tt*(6+d[4])+d[4]*7))*.45:0));
      if(!q||q[0]<-4||q[0]>g.canvas.width+4||q[1]<-4||q[1]>g.canvas.height+4)continue;if(d[3]!==last){last=d[3];g.fillStyle=ST.cols[last]}
      const w=Math.max(1,.46*q[2]),h=Math.max(1.2,.62*q[2]);g.fillRect(q[0]-w/2,q[1]-h,w,h);
      if(ST.heads&&q[2]>9){g.fillStyle=d[4]<2?'#e0ac7e':d[4]<4?'#c68a5a':'#f1c9a5';g.fillRect(q[0]-w*.32,q[1]-h-.3*q[2],w*.64,.3*q[2]);g.fillStyle=ST.cols[last]}}};
  const strip=a=>drawStrips(g,a.slice().sort((u,v)=>Math.hypot(v.m[0]-cam[0],v.m[1]-cam[1])-Math.hypot(u.m[0]-cam[0],u.m[1]-cam[1])),pr,cel,tt);
  for(const o of sorted(L.upper)){poly(o.q,o.c);if(o.fans)dots(o.fans)}
  if(L.strips)strip(L.strips.up);
  for(const o of sorted(L.vip)){poly(o.q,o.c);if(o.win){g.fillStyle='#ffd98a';for(const w of o.win){const q=pr(...w);if(q){const ww=Math.max(1,1.1*q[2]),hh=Math.max(1,.9*q[2]);g.fillRect(q[0]-ww/2,q[1]-hh/2,ww,hh)}}}}
  for(const o of sorted(L.lower)){poly(o.q,o.c);if(o.fans)dots(o.fans)}
  if(L.strips)strip(L.strips.low);
  if(above)for(const o of sorted(L.roof))poly(o.q,o.c==='#262b31'?'#9aa2aa':o.c); /* yukarıdan: çatı üstü açık gri */
  for(const o of sorted(L.fasc))poly(o.q,o.c);
  g.fillStyle='#fffbe8';for(const l of L.lights){const q=pr(...l);if(q){const w=Math.max(1.5,1*q[2]),h=Math.max(1,.45*q[2]);g.fillRect(q[0]-w/2,q[1]-h/2,w,h)}}
}
