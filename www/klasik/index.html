function asistanKur(havuz,dz){const D=DIZILIS[dz],sec=new Set(),xi=Array(11).fill(null),puan=(o,i)=>o?etkinlik(o,D[i][0])*uyum(o,D[i][0])**2:0;
  const sira=D.map((d,i)=>[i,havuz.filter(o=>uyum(o,d[0])>=.82).length]).sort((a,b)=>a[1]-b[1]).map(x=>x[0]);
  for(const i of sira){let en=null,es=-1;for(const o of havuz){if(sec.has(o))continue;const s=puan(o,i);if(s>es){es=s;en=o}}if(en){sec.add(en);xi[i]=en}}
  for(let tur=0,dg=true;dg&&tur<8;tur++){dg=false;
    for(let i=0;i<11;i++)for(let j=i+1;j<11;j++){const a=xi[i],b=xi[j];if(puan(b,i)+puan(a,j)>puan(a,i)+puan(b,j)+.5){xi[i]=b;xi[j]=a;dg=true}}
    for(let i=0;i<11;i++)for(const o of havuz){if(sec.has(o))continue;if(puan(o,i)>puan(xi[i],i)+.5){if(xi[i])sec.delete(xi[i]);sec.add(o);xi[i]=o;dg=true}}}
  const kalan=havuz.filter(o=>!sec.has(o)).sort((a,b)=>b.ca-a.ca),kl=kalan.find(o=>o.m==='KL'),yedek=[kl,...kalan.filter(o=>o.m!=='KL')].filter(Boolean).slice(0,9);
  return{xi,yedek,puan:D.reduce((a,_,i)=>a+puan(xi[i],i),0)}}

  c.fx.forEach(w=>w.forEach(m=>{if(m.hs===null)return;const H=T[m.h],A=T[m.a];H.o++;A.o++;H.a+=m.hs;H.y+=m.as;A.a+=m.as;A.y+=m.hs;
    if(m.hs>m.as){H.g++;A.m++;H.p+=3;H.form.push('G');A.form.push('M')}else if(m.hs<m.as){A.g++;H.m++;A.p+=3;A.form.push('G');H.form.push('M')}else{H.b++;A.b++;H.p++;A.p++;H.form.push('B');A.form.push('B')}}));
  return Object.values(T).sort((x,y)=>y.p-x.p||(y.a-y.y)-(x.a-x.y)||y.a-x.a||team(c.lg,x.id).name.localeCompare(team(c.lg,y.id).name,'tr'));
}
function simScore(h,a){const lh=clamp(1.4+(h.str-a.str)*.16+.15,.25,4),la=clamp(1.1+(a.str-h.str)*.16,.2,4);return[poisson(lh),poisson(la)]}
function addGoals(c,tm,n){if(!n)return;const sq=squad(tm);const w={K:0,D:1,O:3,F:6};for(let i=0;i<n;i++){const tot=sq.reduce((s,p)=>s+w[p.pos],0);let r=Math.random()*tot;let pick=sq[10];for(const p of sq){r-=w[p.pos];if(r<=0){pick=p;break}}c.goals[pick.id]=(c.goals[pick.id]||0)+1}}
function myMatch(c){c=c||S.car;if(!c||c.week>c.fx.length)return null;return c.fx[c.week-1].find(m=>m.h===c.id||m.a===c.id)}
function finishWeek(myH,myA,scorers){
  const c=S.car,w=c.fx[c.week-1];
  for(const m of w){const H=team(c.lg,m.h),A=team(c.lg,m.a);
    if(m.h===c.id||m.a===c.id){m.hs=myH;m.as=myA;
      if(scorers){for(const pid of scorers.h)c.goals[pid]=(c.goals[pid]||0)+1;for(const pid of scorers.a)c.goals[pid]=(c.goals[pid]||0)+1}
      else{addGoals(c,H,m.hs);addGoals(c,A,m.as)}}
    else{const[x,y]=simScore(H,A);m.hs=x;m.as=y;addGoals(c,H,x);addGoals(c,A,y)}}
  c.last=c.week;c.week++;
  if(c.week>c.fx.length){c.done=true;const t=table(c);const pos=t.findIndex(r=>r.id===c.id)+1;c.history.push({year:c.year,team:c.id,lg:c.lg,pos,champ:team(c.lg,t[0].id).name});}
  persist();
}
function leaders(c,n=10){const all={};LEAGUES[c.lg].t.forEach(r=>{const t=team(c.lg,r[0]);[...squad(t),...bench(t)].forEach(p=>all[p.id]={p,t})});return Object.entries(c.goals).filter(([k])=>all[k]).map(([k,g])=>({...all[k],g})).sort((a,b)=>b.g-a.g||a.p.n.localeCompare(b.p.n,'tr')).slice(0,n)}

/* ===================== KUPALAR (Champion Battle Manager 4.6'daki gibi): kıta kupaları ve Kıtalar Arası Kupa =====================
   Tek maçlık eleme; berabere biterse uzatma ve penaltılar. Katılanlar: kupanın liglerinden, kulüp gücü × lig itibarına göre en iyiler
   (bir ligden en çok 4; az ligli kupalarda eşit pay). Kıtalar Arası Kupa: kıta kupalarının en güçlüleri. */
const KUPA_TANIM=[{id:'avr',ad:'Şampiyonlar Ligi',kita:'Avrupa',n:16},{id:'kon',ad:'Kondor Kupası',kita:'Güney Amerika',lg:['br','ar','co'],n:16},
  {id:'kuz',ad:'Kuzey Yıldızı Kupası',kita:'Kuzey Amerika',lg:['mx','us'],n:16},{id:'ipe',ad:'İpek Yolu Kupası',kita:'Asya',lg:['sa','jp','kr','qa','cn','au'],n:16},
  {id:'sav',ad:'Savana Kupası',kita:'Afrika',lg:['eg','ma','za','dz','tn'],n:16},{id:'kit',ad:'Kıtalar Arası Kupa',kita:'Dünya',n:8}];
const kupaTanim=id=>KUPA_TANIM.find(k=>k.id===id)||KUPA_TANIM[0];
const kupaTakim=x=>team(x[0],x[1]);
function kupaHavuz(id,n){const K=kupaTanim(id),lg=K.lg||(id==='avr'?LG_ORDER.filter(k=>LEAGUES[k].kita==='Avrupa'):[]),say={};
  return lg.flatMap(l=>LEAGUES[l].t.map(r=>({l,id:r[0],p:r[5]+6*(LEAGUES[l].it||.6)+(hashStr(l+r[0])%97)/1000}))).sort((a,b)=>b.p-a.p).filter(x=>(say[x.l]=(say[x.l]||0)+1)<=Math.max(4,Math.ceil((n||K.n)/Math.max(1,lg.length)))).slice(0,n||K.n).map(x=>[x.l,x.id])}
function kupaKatilim(id){if(id!=='kit')return kupaHavuz(id);const pay={avr:3,kon:2,kuz:1,ipe:1,sav:1};return Object.entries(pay).flatMap(([k,n])=>kupaHavuz(k,n))}
function kupaTurAdi(k,i){const n=k.esle[0].length*2>>i;return n===2?'Final':n===4?'Yarı final':n===8?'Çeyrek final':'Son '+n}
function kupaBasla(id,ben){const t=kupaKatilim(id),R=rng(Date.now()&0xffffffff);for(let i=t.length-1;i>0;i--){const j=Math.floor(R()*(i+1));[t[i],t[j]]=[t[j],t[i]]}
  const b=ben.split(':'),ilk=[];for(let i=0;i<t.length;i+=2)ilk.push({a:t[i],b:t[i+1],s:null});S.kupa={id,ben:b,tur:0,esle:[ilk],bitti:false,elendi:false};persist()}
const ayni=(x,y)=>x&&y&&x[0]===y[0]&&x[1]===y[1];
function kupaBenimMac(k){k=k||S.kupa;if(!k||k.bitti||k.elendi)return null;return k.esle[k.tur].find(m=>!m.s&&(ayni(m.a,k.ben)||ayni(m.b,k.ben)))}
function kupaKazanan(m){if(!m.s)return null;const[x,y,p]=m.s;return x>y||x===y&&p&&p[0]>p[1]?m.a:m.b}
function kupaKazandi(k){const f=k.esle[k.esle.length-1];return k.bitti&&f.length===1&&ayni(kupaKazanan(f[0]),k.ben)}
function kupaSimSonuc(a,b){const A=kupaTakim(a),B=kupaTakim(b);let[x,y]=simScore(A,B);let p=null;if(x===y){const aw=Math.random()<clamp(.5+(A.str-B.str)*.05,.2,.8),lo=2+Math.floor(Math.random()*3);p=aw?[lo+1,lo]:[lo,lo+1]}return[x,y,p]}
function kupaIlerle(){const k=S.kupa,tur=k.esle[k.tur];
  for(const m of tur)if(!m.s&&(k.elendi||!(ayni(m.a,k.ben)||ayni(m.b,k.ben))))m.s=kupaSimSonuc(m.a,m.b);
  if(tur.some(m=>!m.s))return;
  if(!tur.some(m=>ayni(kupaKazanan(m),k.ben)))k.elendi=true;
  if(tur.length===1){k.bitti=true;return}
  const w=tur.map(kupaKazanan),yeni=[];for(let i=0;i<w.length;i+=2)yeni.push({a:w[i],b:w[i+1],s:null});k.esle.push(yeni);k.tur++;
  if(k.elendi)kupaIlerle()}
function kupaSonucYaz(gb,gr,pen){const k=S.kupa,m=kupaBenimMac(k);if(!m)return;const bizA=ayni(m.a,k.ben);
  m.s=bizA?[gb,gr,pen]:[gr,gb,pen&&[pen[1],pen[0]]];kupaIlerle();persist()}
function kupaMac(){const m=kupaBenimMac();if(!m)return;const k=S.kupa,rak=ayni(m.a,k.ben)?m.b:m.a;startMatch(kupaTakim(k.ben),kupaTakim(rak),null,false,{kupa:true,uzFark:0})}
function kupaSimMac(){const m=kupaBenimMac();if(!m)return;const k=S.kupa,bizA=ayni(m.a,k.ben),s=kupaSimSonuc(m.a,m.b);const[x,y,p]=s;
  if(bizA)kupaSonucYaz(x,y,p);else kupaSonucYaz(y,x,p&&[p[1],p[0]])}
function kupaAlt(){const k=S.kupa;if(!k)return 'Kıta kupaları · Kıtalar Arası Kupa';const K=kupaTanim(k.id);
  return k.bitti?`${esc(K.ad)} · ${kupaKazandi(k)?'ŞAMPİYON 🏆':'bitti'}`:k.elendi?`${esc(K.ad)} · elendin`:`${esc(K.ad)} · ${kupaTurAdi(k,k.tur)}`}
function kupaScreen(){if(S.kupa&&(!kupaTakim(S.kupa.ben)||S.kupa.esle.some(t=>t.some(m=>!kupaTakim(m.a)||!kupaTakim(m.b))))){S.kupa=null;persist()}const k=S.kupa;
  if(!k){const id=UI.kupa||'avr',K=kupaTanim(id),t=kupaKatilim(id).map(kupaTakim).filter(Boolean);
    return `<section class="screen">${topbar('KUPALAR','Kupanı ve kulübünü seç','home')}
     <div class="card"><h3>KUPA</h3><div class="chips">${KUPA_TANIM.map(x=>`<button class="chip ${x.id===id?'on':''}" data-act="ksec" data-v="${x.id}">${x.id==='kit'?'🌍 ':'🏆 '}${esc(x.ad)}</button>`).join('')}</div>
      <p class="dim" style="margin:8px 0 0">${esc(K.kita)} · ${K.n} kulüp · tek maçlık eleme, berabere biterse uzatma ve penaltılar${id==='kit'?' · kıta kupalarının en güçlü kulüpleri':''}</p>
      <h3>KULÜP</h3><div class="teams">${t.map(x=>`<button class="tm ${UI.kteam===x.lg+':'+x.id?'on':''}" data-act="kteam" data-v="${x.lg}:${x.id}">${KIT(x)}<span><b>${esc(x.name)}</b><small>${esc(LEAGUES[x.lg].kurgu)} ${stars(x.str)}</small></span></button>`).join('')}</div></div>
     <div class="stack"><button class="big" data-act="kbasla"${UI.kteam?'':' disabled'}>${UI.kteam?'KUPAYA BAŞLA<small>'+esc(kupaTakim(UI.kteam.split(':')).name)+'</small>':'KULÜP SEÇ'}</button></div></section>`}
  const K=kupaTanim(k.id),bm=kupaBenimMac(k),ben=kupaTakim(k.ben),rak=bm&&kupaTakim(ayni(bm.a,k.ben)?bm.b:bm.a);
  const satir=m=>{const A=kupaTakim(m.a),B=kupaTakim(m.b),w=kupaKazanan(m),biz=ayni(m.a,k.ben)||ayni(m.b,k.ben);
    return `<div class="km ${biz?'biz':''}"><span class="${w&&ayni(w,m.a)?'w':''}">${esc(A.name)}</span><b>${m.s?`${m.s[0]}-${m.s[1]}${m.s[2]?` <small>(p ${m.s[2][0]}-${m.s[2][1]})</small>`:''}`:'–'}</b><span class="${w&&ayni(w,m.b)?'w':''}">${esc(B.name)}</span></div>`};
  const turlar=k.esle.map((t,i)=>`<h3>${kupaTurAdi(k,i).toLocaleUpperCase('tr')}</h3>${t.map(satir).join('')}`).reverse().join('');
  const son=k.bitti?(kupaKazandi(k)?`<div class="yildiz" style="margin:0 0 10px">🏆 ŞAMPİYONSUN! ${esc(ben.name)} · ${esc(K.ad)}</div>`:`<p style="font-weight:800;text-align:center">Şampiyon: ${esc(kupaTakim(kupaKazanan(k.esle[k.esle.length-1][0])).name)}</p>`):k.elendi?`<p style="font-weight:800;text-align:center">${esc(ben.name)} elendi.</p>`:'';
  return `<section class="screen">${topbar(K.ad.toLocaleUpperCase('tr'),esc(ben.name)+' · '+(k.bitti?'kupa bitti':k.elendi?'elendin':kupaTurAdi(k,k.tur)),'home')}
   <div class="card kupa">${son}${turlar}</div>
   <div class="stack">${bm?`<button class="big" data-act="kmac">MAÇA ÇIK<small>${kupaTurAdi(k,k.tur)} · ${esc(ben.short)} - ${esc(rak.short)}</small></button><button class="alt dark" data-act="ksim">MAÇI SİMÜLE ET</button>`:''}
   ${kupaKazandi(k)?'<button class="alt ghost" data-act="kpaylas">📣 ŞAMPİYONLUĞU PAYLAŞ</button>':''}
   <button class="alt ghost" data-act="kbirak">${k.bitti||k.elendi?'YENİ KUPA':UI.kbirakOnay?'EMİN MİSİN? KUPA SİLİNİR · BİR DAHA BAS':'KUPAYI BIRAK'}</button></div></section>`}

     ball:{x:PW/2,y:PL/2,z:0,vx:0,vy:0,vz:0,owner:null,last:null,lastTeam:0,kicker:null,shot:null,intended:null,gkTried:false},

      const a=Math.round(k*seg*SC),w=Math.round(seg*SC)-2;KB2.push(vert?{x:x0,y:y0+a,len:w,vert:1,i:KB2.length}:{x:x0+a,y:y0,len:w,vert:0,i:KB2.length})}};

/* ===================== HAKEM: FAUL · KART · PENALTI · OFSAYT · VAR · TEKRAR · ASİSTAN TAKTİĞİ ===================== */
const kutudaMi=(ti,x,y)=>Math.abs(y-goalYOf(ti))<BOXD&&x>(PW-BOXW)/2&&x<(PW+BOXW)/2;   /* ti'nin hücum ettiği ceza sahası */

  const arkadan=(o.dx*(o.x-p.x)+o.dy*(o.y-p.y))/(Math.hypot(o.x-p.x,o.y-p.y)||1)>.35,topYakin=Math.hypot(M.ball.x-p.x,M.ball.y-p.y)<Math.hypot(o.x-p.x,o.y-p.y)-.1;

function loop(now){
  if(!M)return;
  const dt=Math.min(.05,(now-M.lastT)/1000);M.lastT=now;
  if(!M.paused&&dt>0){const n=Math.max(1,Math.ceil(dt*60-1e-3)),h=dt/n;for(let i=0;i<n;i++){step(h);if(!M)return}}
  draw();

}
const KM_SINIR=[0,45,90,105,120];
function minute(){return Math.min(KM_SINIR[M.half],Math.floor(M.clock/M.dur*90))}

/* hakem tehlikeli pozisyon bitmeden düdük çalmaz: şut/orta havada ya da top hücum edenin son üçte birinde */
function tehlike(){const b=M.ball;if(b.shot||b.cross)return true;return Math.min(b.y,PL-b.y)<PL*.3} /* top iki ceza sahası bölgesinden birindeyse hücum sürüyor */
function uzatmaKontrol(sinir){if(M.demo)return M.clock>=sinir; /* gösterim / canlandırma: süre tam dolunca biter (gerçek maç senaryosu kendi dakikalarını yönetir) */
  if(M.uz==null&&M.clock>=sinir){M.uz=M.half===1?1+Math.floor(Math.random()*4):M.half===2?3+Math.floor(Math.random()*4):1+Math.floor(Math.random()*2);banner('UZATMA','+'+M.uz+' DAKİKA',null,true);setTimeout(()=>{try{hideBanner()}catch(e){}},1800)}
  const bitis=M.uz==null?Infinity:sinir+M.uz*M.dur/90;const olu=M.durdu;M.durdu=0;if(M.clock<bitis)return false;
  /* süre dolunca düdük ancak tehlike yokken: kale vuruşu, kendi yarısında taç ya da top orta bölgeye uzaklaştırılınca. Korner ve ceza sahası yakınındaki taç kullanılır;
     şut/orta havadayken ya da top ceza sahasındayken düdük çalmaz. En geç ~4 dk sonra top kaleye 24 m+ uzaksa, ~7 dk sonra top ceza sahası dışındaysa. */
  const b=M.ball,u=Math.min(b.y,PL-b.y),temiz=!b.shot&&!b.cross;

    M.stateT-=dt;

    if(yol){const q=M.setPiece.p,ddx=yol.tx-q.x,ddy=yol.ty-q.y,dd=Math.hypot(ddx,ddy);if(yol.bekle>0||M.stateT<.3){const qx=q.x,qy=q.y,qa=q.anim;moveOffBall(dt,true);q.x=qx;q.y=qy;q.anim=qa}q.vx=q.vy=0; /* uzun yürüyüşte diğerleri de yerlerine geçer */

      if(M.stateT<=0&&dd>.3&&(yol.bekle+=dt)<6)M.stateT=.05;   /* oyuncu topa varmadan vuruş yok (en çok ~6 sn bekler) */
      if(M.stateT<=0){q.x=yol.tx;q.y=yol.ty;q.dx=yol.fx;q.dy=yol.fy;M.setPiece.yol=null}}
    if(M.stateT<=0){const f=M.after;M.after=null;if(f)f();else M.state='play';}

    if(esit()){M.s90=[M.T[0].score,M.T[1].score];M.uzVar=true;M.hak={n:6,w:4};M.clock=M.dur;M.half=3;M.state='half';M.stateT=3.4;SND.whistle(2);banner('UZATMA','2×15 DAKİKA · +1 DEĞİŞİKLİK'+molaIpucu,null,true);kmMola(2);
      M.after=()=>{M.flip=!M.flip;M.tAtt=null;M.possTeam=null;M.TP=null;if(camMode()===1)buildPitch();kickoff(0);M.state='pre';M.stateT=.8;SND.whistle(1);banner('UZATMA','1. YARI',null,true)};return}

  if(M.half===3&&uzatmaKontrol(M.dur*7/6)){M.uz=null;M.clock=M.dur*7/6;M.half=4;M.state='half';M.stateT=2;SND.whistle(2);banner('UZATMA','DEVRE ARASI · '+M.T[0].score+'-'+M.T[1].score,null,true);
    M.after=()=>{M.flip=!M.flip;M.tAtt=null;M.possTeam=null;M.TP=null;if(camMode()===1)buildPitch();kickoff(1);M.state='pre';M.stateT=.8;SND.whistle(1);banner('UZATMA','2. YARI',null,true)};return}
  if(M.half===4&&uzatmaKontrol(M.dur*8/6)){M.uz=null;if(esit())kmPenaltiBasla();else kmBitir();return}
  if(mn!==M._lm){M._lm=mn;hud()}

  kmKondisyon(dt);kmOtoDeg();

  tx=vw>PW+8?PW/2:clamp(tx,vw/2-4,PW-vw/2+4);ty=clamp(ty,vh*.2,PL-vh*.2);M.cam.x+=(tx-M.cam.x)*Math.min(1,dt*4);M.cam.y+=(ty-M.cam.y)*Math.min(1,dt*4)}

/* ---------- Kontrol değişimi ---------- */
function updateCtrl(){
  if(M.demo){M.ctrl=null;return}
  const b=M.ball,mine=M.P.filter(p=>p.team===0);
  if(b.owner&&b.owner.team===0){M.ctrl=b.owner;return}
  if(b.intended&&b.intended.team===0&&!b.owner){M.ctrl=b.intended;return}
  const field=mine.filter(p=>p.role!=='G');
  let best=null,bd=1e9;for(const p of field){const d=Math.hypot(p.x-b.x,p.y-b.y);if(d<bd){bd=d;best=p}}
  const cur=M.ctrl&&M.ctrl.team===0&&M.ctrl.role!=='G'?M.ctrl:null;
  if(M.input.pasE&&!(b.owner&&b.owner.team===0)){
    const ord=field.map(p=>({p,d:Math.hypot(p.x-b.x,p.y-b.y)})).sort((a,c)=>a.d-c.d);
    M.ctrl=(cur&&ord[0].p===cur&&ord[1])?ord[1].p:ord[0].p;M.input.pasE=false;M.manualT=1.5;SND.tone(1200,.05,'square',.05);return}
  if(!cur){M.ctrl=best;return}
  if(M.manualT>0||cur.slide>0)return;
  const cd=Math.hypot(cur.x-b.x,cur.y-b.y);
  const pushing=M.input.x||M.input.y;
  if(best!==cur&&((!pushing&&cd-bd>3.5)||(pushing&&cd-bd>8)||cd>18))M.ctrl=best;
}

function nearestOpp(p){let best=null,bd=1e9;for(const q of M.P)if(q.team!==p.team){const d=Math.hypot(q.x-p.x,q.y-p.y);if(d<bd){bd=d;best=q}}return[best,bd]}
function chasers(ti){ /* topa en yakın iki saha oyuncusu */

function deepestLine(ti){return yAtDepth(ti,teamPlan(ti).last)}
function offBallTarget(p){
  const b=M.ball,ti=p.team,P=teamPlan(ti),pos=p.pos,R=rightOf(ti);

    if(m){const og=ownGoalY(ti),md=depthOf(ti,m.y),dx=PW/2-m.x,dy=og-m.y,d=Math.hypot(dx,dy)||1,gap=md<22?1.8:md<34?2.6:3.4;
      let x=m.x+dx/d*gap+m.vx*.15,y=m.y+dy/d*gap+m.vy*.15;

  if(car&&car.role==='G'){ /* kaleci oyunu kuruyor: stoperler açılır, bekler yükselir, 6 numara gelir */

    if(pos==='LB'||pos==='RB')return at(22,sideX(pos==='RB'?.95:-.95),.9);

function formTarget(p){if(p.role==='G')return home(p);return slotPos(p,teamPlan(p.team).poss)}
/* önündeki rakibe uzaklık (ileri koni) */

function thinkCarrier(p,dt){

    if(wide&&cd>PL-26&&Math.random()<.35+tr(p,'cross',0)){const q=crossTarget(p);if(q){doCross(p,q);return}}
    const pressed=od<3.2,s=bestPass(p,0,f,false),sc=M._passScore;

}
function bestPass(p,dx,dy,any){

function think(p,dt){
  const b=M.ball,T=M.T[p.team];
  p.tx=null;p.ty=null;p.run=0;p.mx=0;p.my=0;
  if(p.stun>0||p.slide>0)return;

      if(p.firstTime){p.firstTime=0;if(Math.hypot(PW/2-p.x,goalYOf(p.team)-p.y)<19){doShoot(p,ix,.85);return}}

      if(M.input.sutE){doShoot(p,ix,sutGucu());return}

    }
    if(M.input.sutE&&!(p.scd>0)){const bd2=Math.hypot(b.x-p.x,b.y-p.y);
      if(bd2<5.5){const lx=b.x+(b.owner?b.owner.vx*.18:b.vx*.12),ly=b.y+(b.owner?b.owner.vy*.18:b.vy*.12);doSlide(p,lx-p.x,ly-p.y)}else doSlide(p,ix||p.dx,iy||p.dy);return}
    if(ix||iy){p.mx=ix;p.my=iy;p.run=1;return}
    /* joystick boşta: boş topa kendisi koşar, yoksa yerinde bekler */

  }

  /* top kimsede değilken / pasın hedefiysem */

      if(b.owner&&b.owner.team!==p.team&&Math.hypot(p.x-b.x,p.y-b.y)<2.4&&!(p.scd>0)&&Math.random()<dt*(.35+M.T[p.team].skill*.4)*(M.T[p.team].human?.6:(!M.demo&&b.owner===M.ctrl?DIFF.slide[M.diff]:1)))doSlide(p,b.x-p.x,b.y-p.y);return}
    if(!b.owner&&!humanTeamChaser&&second===p){const t=interceptPoint(p);p.tx=t.x;p.ty=t.y;p.run=.8;return}

    if(humanTeamChaser&&b.owner&&b.owner.team!==p.team&&p!==M.ctrl){const helper=ch.find(x=>x.p!==M.ctrl);if(helper&&helper.p===p){const og=ownGoalY(p.team);const k=M.diff===2?.3:.15;p.tx=b.x+(PW/2-b.x)*.2;p.ty=b.y+(og-b.y)*k;p.run=.85;return}}
    /* 6 numara: orta bölgede topa ikinci baskıcı olarak gider */

      if(Math.hypot(p.x-b.x,p.y-b.y)<2.2&&!(p.scd>0)&&Math.random()<dt*.35*(M.T[p.team].human?.7:(!M.demo&&b.owner===M.ctrl?DIFF.slide[M.diff]:1)))doSlide(p,b.x-p.x,b.y-p.y);return}
    /* ikinci baskıcı: rakip topla geliyorsa yolunu kes */

function moveOffBall(dt,soft){for(const p of M.P){const h=formTarget(p);const dx=h.x-p.x,dy=h.y-p.y,d=Math.hypot(dx,dy);if(d>.5){const s=3*(soft?.8:1);p.vx=dx/d*s;p.vy=dy/d*s;p.x+=p.vx*dt;p.y+=p.vy*dt;p.anim+=s*dt;p.dx=dx/d;p.dy=dy/d}}}
function interceptPoint(p){

}
function thinkGK(p,dt){

  const inBox=Math.abs(b.y-og)<BOXD&&b.x>(PW-BOXW)/2&&b.x<(PW+BOXW)/2;
  /* şut geliyor mu */
  if(!b.owner&&Math.sign(b.vy)===-s&&Math.abs(b.vy)>6){const t=(p.y-b.y)/b.vy;if(t>0&&t<1.6){const xc=b.x+b.vx*t;if(xc>GX0-2.5&&xc<GX1+2.5){p.tx=clamp(xc,GX0-1,GX1+1);p.ty=p.y;p.run=1.25;p.dive=1;return}}}

  if(!b.owner&&(inBox||sweep)){const near=chasers(p.team)[0];const myd=Math.hypot(p.x-b.x,p.y-b.y);const[,od]=[0,M.P.filter(q=>q.team!==p.team).reduce((m,q)=>Math.min(m,Math.hypot(q.x-b.x,q.y-b.y)),99)];
    if(myd<od+(sweep?-2:1.5)||(!sweep&&myd<4)){const t=interceptPoint(p);p.tx=t.x;p.ty=t.y;p.run=1;return}}

function release(p,vx,vy,vz,intended){const b=M.ball;if(M.ist&&intended&&intended.team===p.team){M.ist.pas[p.team]++;kmOy(p).p++}kmOfsaytBak(p,intended);b.owner=null;b.x=p.x+p.dx*.5;b.y=p.y+p.dy*.5;b.vx=vx;b.vy=vy;b.vz=vz;b.z=Math.max(b.z,.05);b.last=p;b.lastTeam=p.team;b.kicker=p;b.intended=intended||null;b.gkTried=false;b.cross=false;p.cd=.35;p.hold=0;b.atis=!!(M.setPiece&&M.setPiece.tac&&M.setPiece.p===p);M.setPiece=null}
function doPass(p,dx,dy,target){
  const q=target||bestPass(p,dx,dy,true);
  if(!q){const n=Math.hypot(dx,dy)||1;release(p,dx/n*14,dy/n*14,.5);SND.kick(.6);return}
  const d=Math.hypot(q.x-p.x,q.y-p.y);const lead=clamp(d/16,.2,1.1);
  let tx=q.x+q.vx*lead,ty=q.y+q.vy*lead;const D=Math.hypot(tx-p.x,ty-p.y);
  const T=M.T[p.team];const[,odP]=nearestOpp(p);const err=(1-T.skill)*D*(D>22?.15:.08)*(odP<2.5?1.4:1);tx+=rand(-err,err);ty+=rand(-err,err);
  const ux=(tx-p.x)/D,uy=(ty-p.y)/D;
  let v,vz=0;
  if(D>22){vz=4.5+D*.07;const ta=2*vz/18;v=D/(ta+.75)}else v=clamp(D*1.1+3.5,8,25);
  p.dx=ux;p.dy=uy;release(p,ux*v,uy*v,vz,q);SND.kick(.7);
}
function doAraPas(p,dx,dy){const q=bestPass(p,dx,dy,true);if(!q){doPass(p,dx,dy);return}
  const f=fwdOf(p.team),T=M.T[p.team];let tx=clamp(q.x+q.vx*.6,3,PW-3),ty=clamp(q.y+f*rand(6,9),2,PL-2);
  const D=Math.hypot(tx-p.x,ty-p.y)||1,err=(1-T.skill)*D*.07;tx+=rand(-err,err);ty+=rand(-err,err);
  const ux=(tx-p.x)/D,uy=(ty-p.y)/D,v=clamp(D*1.05+4,9,24);p.dx=ux;p.dy=uy;release(p,ux*v,uy*v,0,q);SND.kick(.75)}
function doShoot(p,aimX,pow){pow=pow||1;if(M.ist){M.ist.sut[p.team]++;kmOy(p).s++}
  const gy=goalYOf(p.team),f=fwdOf(p.team),T=M.T[p.team];
  const dG=Math.hypot(PW/2-p.x,gy-p.y);
  if(dG>36){/* uzun top */const q=bestPass(p,0,f,true);if(q&&Math.random()<.6){doPass(p,q.x-p.x,q.y-p.y,q);return}release(p,rand(-3,3),f*22,7);SND.kick(.9);return}
  const human=T.human&&p===M.ctrl;
  let ax=PW/2+(human?aimX*2.9:rand(-2.6,2.6));
  const gk=M.P.find(q=>q.team!==p.team&&q.role==='G');
  if(!human&&gk){ax=gk.x>PW/2?PW/2-rand(1.4,3.1):PW/2+rand(1.4,3.1)}
  const acc=T.skill*(human?1.02:1);const[,odS]=nearestOpp(p);const press=odS<2.5?1.35:1;
  const err=(1.15-acc)*(1.2+dG*.13)*press;ax+=rand(-err,err)+(Math.random()<.12+(1-acc)*.3?rand(-1,1)*rand(2.5,5):0);
  let tz=Math.random()<.1+dG*.006?rand(2.6,3.6):rand(.2,2.2);if(human&&pow>1.1&&Math.random()<(pow-1.1)*2.5)tz=rand(GH+.4,GH+1.6); /* fazla güç: üstten auta gidebilir */
  const dx=ax-p.x,dy=gy-p.y,d=Math.hypot(dx,dy);const v=(22+T.str*.5)*pow;
  const t=d/v;const vz=(tz+9*t*t)/t;
  p.dx=dx/d;p.dy=dy/d;release(p,dx/d*v,dy/d*v,clamp(vz,1,8));M.ball.shot={team:p.team,t:0};SND.kick(1.2);
}
function doSlide(p,dx,dy){const n=Math.hypot(dx,dy)||1;p.dx=dx/n;p.dy=dy/n;p.slide=.42;p.scd=1.1;p.vx=p.dx*10.5;p.vy=p.dy*10.5;SND.noise(.18,.08,700)}

function movePlayer(p,dt){
  const T=M.T[p.team];let vx,vy;
  if(p.slide>0){p.slide-=dt;p.vx*=Math.pow(.15,dt);p.vy*=Math.pow(.15,dt);vx=p.vx;vy=p.vy;
    const b=M.ball;const d=Math.hypot(b.x-p.x,b.y-p.y);
    if(d<1.45&&b.z<1&&b.owner!==p&&!(duranBekliyor()&&b.owner.team!==p.team)){if(b.owner&&b.owner.team!==p.team&&kmKaymaFaul(p,b.owner)){p.slide=0;return}if(b.owner&&b.owner.team!==p.team){const o=b.owner;o.stun=.8;o.cd=.9;b.owner=null;if(!M.demo&&o.role!=='G'&&Math.random()<.025)kmSakat(o)}if(!b.owner){const hum=!M.demo&&p===M.ctrl;if(hum){take(p);p.won=1;SND.kick(.5)}else{b.vx=p.dx*7+rand(-3,3);b.vy=p.dy*7+rand(-3,3);b.vz=.8;b.lastTeam=p.team;b.last=p;b.intended=null;b.shot=null;SND.kick(.5)}}}
    if(p.slide<=0){p.stun=M.ball.owner===p?0:.35;p.won=0}
  }else if(p.stun>0){vx=p.vx*.8;vy=p.vy*.8}
  else{
    const hum=!M.demo&&p===M.ctrl;const top=6.6*(T.spd+tr(p,'spd',0))*(hum?1.1:(M.ball.owner===p?.9:1))*(p.role==='G'&&p.dive?1.15:1)*(.72+.28*(p.st??1))*(p.inj?.6:1);
    let mx=0,my=0,sp=0;
    if(p.tx!=null){const dx=p.tx-p.x,dy=p.ty-p.y,d=Math.hypot(dx,dy);if(d>.35){mx=dx/d;my=dy/d;sp=top*p.run*Math.min(1,d/1.5)}}
    else if(p.mx||p.my){mx=p.mx;my=p.my;sp=top*(p.run||1)*Math.min(1,Math.hypot(p.mx,p.my)*1.15)}
    const tvx=mx*sp,tvy=my*sp,k=Math.min(1,dt*(M.ball.owner===p?7:9));
    p.vx+=(tvx-p.vx)*k;p.vy+=(tvy-p.vy)*k;vx=p.vx;vy=p.vy;
    const s=Math.hypot(vx,vy);if(s>.5){p.dx=vx/s;p.dy=vy/s}
  }

  p.x=clamp(p.x,-3,PW+3);p.y=clamp(p.y,-3,PL+3);
  if(p.role==='G'){const og=ownGoalY(p.team);if(og===PL)p.y=Math.max(p.y,PL-BOXD-2);else p.y=Math.min(p.y,BOXD+2);}
  p.anim+=Math.hypot(vx,vy)*dt;
}
/* duran top kuralı: topu kullanan oyuncu topa dokunmadan rakipler 9,15 m uzakta bekler, topa müdahale edemez; santrada rakip kendi yarısındadır */
const DURAN_MESAFE=9.15;
function duranBekliyor(){return !!(M.setPiece&&M.ball.owner&&M.ball.owner===M.setPiece.p)}
function mesafeKurali(){if(!duranBekliyor()||M.setPiece.pen)return;const b=M.ball,ti=M.setPiece.p.team,ko=!!M.setPiece.ko;
  const bj=M.setPiece.baraj;if(bj)for(const[q,x,y,fx,fy]of bj){q.x=x;q.y=y;q.vx=q.vy=0;q.dx=fx;q.dy=fy;q.slide=0;const ex=x-b.x,ey=y-b.y,ed=Math.hypot(ex,ey)||1;if(ed<DURAN_MESAFE){q.x=b.x+ex/ed*DURAN_MESAFE;q.y=b.y+ey/ed*DURAN_MESAFE}}
  for(const q of M.P){if(q.team===ti||bj&&bj.some(e=>e[0]===q))continue;q.slide=0;
    if(ko){if(fwdOf(q.team)===-1)q.y=Math.max(q.y,PL/2+.3);else q.y=Math.min(q.y,PL/2-.3)}
    let dx=q.x-b.x,dy=q.y-b.y,d=Math.hypot(dx,dy);
    if(d<DURAN_MESAFE){if(d<.01){dx=0;dy=-fwdOf(ti);d=1}const a0=Math.atan2(dy,dx);
      for(let k=0;k<24;k++){const a=a0+(k%2?1:-1)*Math.ceil(k/2)*Math.PI/12,nx=b.x+Math.cos(a)*DURAN_MESAFE,ny=b.y+Math.sin(a)*DURAN_MESAFE; /* saha dışına düşerse çember üzerinde kayar */
        if(nx>=.5&&nx<=PW-.5&&ny>=.5&&ny<=PL-.5&&(!ko||(fwdOf(q.team)===-1?ny>=PL/2:ny<=PL/2))){q.x=nx;q.y=ny;break}}
      q.vx*=.3;q.vy*=.3}}}
function separate(){const P=M.P;for(let i=0;i<P.length;i++)for(let j=i+1;j<P.length;j++){const a=P[i],b=P[j],dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy);if(d>0&&d<.9){const o=(.9-d)/2,ux=dx/d,uy=dy/d;if(a.slide<=0){a.x-=ux*o;a.y-=uy*o}if(b.slide<=0){b.x+=ux*o;b.y+=uy*o}}}}

function ballStep(dt){
  if(M.state!=='play')return;   /* aynı adımda duran top verildiyse top yerinde kalır */
  const b=M.ball;
  if(b.owner){const p=b.owner;const ph=p.anim*1.6;const off=.62+Math.sin(ph)*.12;b.x=p.x+p.dx*off;b.y=p.y+p.dy*off;b.z=0;b.vx=p.vx;b.vy=p.vy;b.vz=0;b.lastTeam=p.team;b.last=p;
    /* topla çizgiyi geçmek: taç / aut / korner, kale ağzından girerse gol */
    if(!M.setPiece&&p.role!=='G'&&(b.x<-.15||b.x>PW+.15||b.y<-.15||b.y>PL+.15)){b.owner=null;b.kicker=p;if(outOfPlay(b))return}
    /* top kapma (duran topta topçu topa dokunmadan kimse alamaz) */
    if(!duranBekliyor())for(const q of M.P){if(q.team===p.team||q.stun>0||q.slide>0||q.cd>0)continue;const d=Math.hypot(q.x-b.x,q.y-b.y);if(d<.85){
      const Tq=M.T[q.team],Tp=M.T[p.team];
      if(Tp.human&&p===M.ctrl&&p.hold<.6)continue;
      let rate=(1.1+Tq.skill-Tp.skill*.6)*(Tq.human?(q===M.ctrl?2.6:1.25):1)*(Tp.human&&p===M.ctrl?DIFF.steal[M.diff]:1);
      if(p.role==='G'&&!p.ayak)rate*=.2;rate*=(1-tr(p,'hold',0))*(1+tr(q,'tackle',0));if(!(Tp.human&&p===M.ctrl))rate*=.55; /* yapay zekâ topçusu da topu biraz saklayabilsin */
      if(Math.random()<rate*dt*2.2){if(kmMudahaleFaul(q,p))return;b.owner=q;q.hold=0;p.cd=.7;p.stun=.25;b.intended=null;M.setPiece=null;SND.kick(.4);break}}}
    return;
  }
  const sp0=Math.hypot(b.vx,b.vy);
  b.x+=b.vx*dt;b.y+=b.vy*dt;
  if(b.z>0||b.vz>0){b.vz-=18*dt;b.z+=b.vz*dt;const dr=Math.pow(.88,dt);b.vx*=dr;b.vy*=dr;if(b.z<=0){b.z=0;if(b.vz<-2.5){b.vz=-b.vz*.42;SND.bounce()}else b.vz=0}}
  else{const f=Math.exp(-1.15*dt);b.vx*=f;b.vy*=f}
  if(b.shot)b.shot.t+=dt;
  if(Math.hypot(b.vx,b.vy)<.6&&b.z===0){b.vx=b.vy=0}
  /* kaleci kurtarışı */
  for(const g of M.P){if(g.role!=='G'||g.cd>0)continue;const d=Math.hypot(g.x-b.x,g.y-b.y);const reach=1.25+(g.dive?.9:0);
    if(d<reach&&b.z<2.7){if(b.gkTried&&b.gkTried===g)continue;b.gkTried=g;
      const towards=ownGoalY(g.team)===PL?b.vy>0:b.vy<0;const sp=Math.hypot(b.vx,b.vy);
      if(!towards||sp<9){take(g);return}
      /* çerçeveyi bulmayacak şutu bırakır (direk dibinden geçmiyorsa) */
      {const ly=ownGoalY(g.team),tt=(ly-b.y)/b.vy;if(tt>0&&tt<2){const xc=b.x+b.vx*tt,zc=b.z+b.vz*tt-9*tt*tt;if((xc<GX0-.35||xc>GX1+.35||zc>GH+.25)&&d>.6){b.gkTried=g;continue}}}

function draw2D(){

  g.fillStyle='#1d3b1c';g.fillRect(0,0,IW,IH);

    if(B.vert){g.save();g.translate(ox+B.x,oy+B.y+B.len);g.rotate(-Math.PI/2);g.drawImage(c,0,0,B.len,th);g.restore()}else g.drawImage(c,ox+B.x,oy+B.y,B.len,th)}
  g.imageSmoothingEnabled=false;
  const W=(x,y)=>[sp(IW/2+(x-cam.x)*SC),sp(IH/2+(y-cam.y)*SC)];
  const b=M.ball;
  const ents=M.P.map(p=>({y:p.y,p}));ents.push({y:b.y+.01,ball:true});ents.sort((a,c)=>a.y-c.y);
  /* top gölgesi önce */
  {const[sx,sy]=W(b.x,b.y);g.fillStyle='rgba(0,0,0,.35)';g.fillRect(sx-1,sy,3,1)}
  for(const e of ents){if(e.ball){drawBall(g,W);continue}drawPlayer(g,e.p,W)}

/* ===================== YAYIN MOTORU =====================
   TV kamerasının çizim motoru tek ortak motor; Dinamik, Tele ve Stadyum onun farklı açılardaki çatallarıdır.
   Kamera hep yataya bakar (dikey çizgiler dik kalır, oyuncular ayakta durur), görüntü merceği aşağı kaydırılır:
   yayın kameralarının "düz" görüntüsü. Klasik (tepeden piksel) ayrı kalır. */
const CAMS={
  1:{ad:'Dinamik',h:21,R:33,wl:50,wp:25,cyl:.62,cyp:.62,HK:1.1},
  2:{ad:'Tele',yaw:.42,h:24,R:56,wl:46,wp:30,cyl:.58,cyp:.56,HK:1.15},
  3:{ad:'Stadyum',yaw:-.2,h:46,R:94,wl:76,wp:38,cyl:.6,cyp:.6,HK:1},
  4:{ad:'TV',HK:1.25}};
const TVC={D:62,h:34},NEAR=1.2;
let TVF=1000,TVK=1,bcImg=null;
const BC={x:PW+62,y:PL/2,h:34,f:[-1,0],r:[0,-1],F:1000,oy:0,R:96};
function bcMask(){const m=camMode();return m===1?(M.flip?{W:1,E:1,S:1}:{W:1,E:1,N:1}):m===2?{W:1,N:1,S:1,cutE:1}:{W:1,N:1,S:1}} /* Tele: kameraya çok yakın kale arkası uçları kesilir */

/* izdüşüm: dünya (x en, y boy, z yükseklik) -> [ekranX, ekranY, ölçek px/m, derinlik] ; kameranın arkası null */
function bcP(x,y,z){const dx=x-BC.x,dy=y-BC.y,d=dx*BC.f[0]+dy*BC.f[1];if(d<NEAR*.999)return null;const s=BC.F/d;return[IW/2+(dx*BC.r[0]+dy*BC.r[1])*s,BC.oy+(BC.h-(z||0))*s,s,d]}
const bcD=(x,y)=>(x-BC.x)*BC.f[0]+(y-BC.y)*BC.f[1];
const tvP=bcP,tvQ=(x,u,z)=>bcP(x,PL-u,z);
/* yakın düzlemde kırpma: çokgen ve doğru parçası (kameranın arkasına taşan zemin/çizgi kaybolmaz, kara boşluk kalmaz) */
function clipW(pts){const o=[],N=NEAR+.01;for(let i=0;i<pts.length;i++){const A=pts[i],B=pts[(i+1)%pts.length],da=bcD(A[0],A[1])-N,db=bcD(B[0],B[1])-N;
    if(da>=0)o.push(A);if((da>=0)!==(db>=0)){const t=da/(da-db);o.push([A[0]+(B[0]-A[0])*t,A[1]+(B[1]-A[1])*t,(A[2]||0)+((B[2]||0)-(A[2]||0))*t])}}return o}

  if(da<0||db<0){const t=da/(da-db),P=[a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t,(a[2]||0)+((b[2]||0)-(a[2]||0))*t];if(da<0)a=P;else b=P}
  const p=bcP(a[0],a[1],(a[2]||0)*(zk||1)),q=bcP(b[0],b[1],(b[2]||0)*(zk||1));if(!p||!q)return null;path.moveTo(p[0],p[1]);path.lineTo(q[0],q[1]);return(p[2]+q[2])/2}

function bcResize(W,H){

/* TV: yan tribünün üstünden dümdüz, ray üstünde kayan kamera */
function cameraTV(dt){
  const b=M.ball;const first=!M.tv;if(first)M.tv={u:PL/2,oy:0};const t=M.tv;
  const lead=b.owner?-fwdOf(b.owner.team)*5:0;

  const tu=clamp(PL-b.y+lead,half-12,PL-half+12);
  const near=TVF*TVC.h/TVC.D,far=TVF*TVC.h/(TVC.D+PW+3);

}
/* çatallar: aynı motor, farklı yer/yükseklik/açı; topu yumuşakça izler */
function cameraBC(dt){const m=camMode();if(m===4)return cameraTV(dt);
  const c=CAMS[m],b=M.ball,f=bcDir(),r=[-f[1],f[0]],por=IH/IW>1.2,F=IW*c.R/(por?c.wp:c.wl),hw=IW/2*c.R/F;
  const lead=b.owner?fwdOf(b.owner.team)*(m===1?6:5):0;
  let tx,ty;
  if(m===1){tx=clamp(b.x*.6+PW/2*.4,16,PW-16);ty=clamp(b.y+lead,4,PL-4)}
  else{tx=clamp(b.x*.6+PW/2*.4,16,PW-16);ty=clamp(b.y+lead,Math.min(PL/2,hw-10),Math.max(PL/2,PL-hw+10))}
  const first=!M.bc||M.bc.m!==m||M.bc.fl!==M.flip;if(first)M.bc={m,fl:M.flip,x:tx,y:ty};
  else{const k=Math.min(1,dt*3.2);M.bc.x+=(tx-M.bc.x)*k;M.bc.y+=(ty-M.bc.y)*k}
  const T=M.bc;Object.assign(BC,{x:T.x-f[0]*c.R,y:T.y-f[1]*c.R,h:c.h,f,r,F,R:c.R,oy:IH*(por?c.cyp:c.cyl)-c.h*F/c.R,tx:T.x,ty:T.y});
}
/* tribün sıra şeritleri: her sıra önceden çizilmiş görüntü, kamera açısına göre dilimlenip eğilerek çizilir */
function drawStrips(g,list,pr,cel,tt){
  for(const S of list){const ax=S.a[0],ay=S.a[1],bx=S.b[0],by=S.b[1];
    const par=Math.abs((bx-ax)*BC.f[0]+(by-ay)*BC.f[1])<.02*S.len;let n=par?1:S.n;if(cel)n=Math.max(n,18);
    const img=S.img,sx0=S.sx||0,sw=(S.sw||img.width)/n,ih=img.height;
    for(let k=0;k<n;k++){const t0=k/n,t1=(k+1)/n;
      const A=pr(ax+(bx-ax)*t0,ay+(by-ay)*t0,S.z+.05),B=pr(ax+(bx-ax)*t1,ay+(by-ay)*t1,S.z+.05);if(!A||!B)continue;
      if(Math.max(A[0],B[0])<0||Math.min(A[0],B[0])>IW||Math.max(A[1],B[1])<0||Math.min(A[1],B[1])-2*A[2]>IH)continue;
      const H=1.05*(A[2]+B[2])/2,dy=cel?Math.max(0,Math.sin(tt*(6.5+(k*7+S.r)%5*.4)+S.r*1.3+k*2.1))*.45*A[2]:0;

      const m=Math.min(8,Math.max(1,Math.ceil(Math.abs(B[1]-A[1])/3.5))),ssw=sw/m,dx=(B[0]-A[0])/m,dyy=(B[1]-A[1])/m,ww=Math.abs(dx)+.6;
      for(let j=0;j<m;j++){const x=A[0]+dx*(j+(dx<0?1:0)),y=A[1]+dyy*(j+.5);g.drawImage(img,sx0+k*sw+j*ssw,0,ssw,ih,dx<0?x-.3:x,y-H-dy,ww,H)}}}
}

  g.fillStyle='#2a2f35';if(polyW(g,[[-200,-200,0],[PW+200,-200,0],[PW+200,PL+200,0],[-200,PL+200,0]]))g.fill();

    if(A&&B&&B[1]>A[1]+1){const sg=g.createLinearGradient(0,A[1],0,B[1]);sg.addColorStop(0,'rgba(10,30,15,.30)');sg.addColorStop(.5,'rgba(0,0,0,0)');sg.addColorStop(1,'rgba(255,255,220,.06)');g.fillStyle=sg;

    const A=bcP(B.a[0],B.a[1],0),Z=bcP(B.b[0],B.b[1],0);if(!A||!Z)continue;if(Math.max(A[0],Z[0])<0||Math.min(A[0],Z[0])>IW)continue;
    const cvs=ledCanvas(B.i),h=1.1*(A[2]+Z[2])/2;g.setTransform((Z[0]-A[0])/cvs.width,(Z[1]-A[1])/cvs.width,0,h/cvs.height,A[0],A[1]-h);g.drawImage(cvs,0,0);g.setTransform(1,0,0,1,0,0)}

  const W=new Map(),seg=(A,B)=>{const n=Math.max(1,Math.ceil(Math.hypot(B[0]-A[0],B[1]-A[1])/4));for(let k=0;k<n;k++){const a=[A[0]+(B[0]-A[0])*k/n,A[1]+(B[1]-A[1])*k/n],b=[A[0]+(B[0]-A[0])*(k+1)/n,A[1]+(B[1]-A[1])*(k+1)/n];
      const p=new Path2D(),s=segW(p,a,b);if(s==null)continue;const w=Math.max(1,Math.round(.13*s*2)/2);let P=W.get(w);if(!P)W.set(w,P=new Path2D());P.addPath(p)}};

  for(const p of ring){const W=p.side==='N'?STD.wall:null;
    if(W){const[o1,h1,o2,h2]=W.tier;L.roof.push({q:bandQuad(p,W.roof[0],W.roof[1],W.roof[2],W.roof[3]),c:'#262b31'},{q:bandQuad(p,W.back[0],W.back[1],W.back[0],W.back[2]),c:'#3d4349'});
      L.upper.push({q:bandQuad(p,o1,h1,o2,h2),c:'#4b5056',fans:noDots(p)?null:fans(p,o1,h1,o2,h2)});
      L.fasc.push({q:bandQuad(p,W.fasc[0],W.fasc[1],W.fasc[0],W.fasc[2]),c:'#d9dde1',p,o:W.fasc[0],h:W.fasc[1]});continue}
    const[l1,lh1,l2,lh2]=STD.low,[u1,uh1,u2,uh2]=STD.up,R=STD.roof,B=STD.back,V=STD.vip,F=STD.fasc;
    L.roof.push({q:bandQuad(p,R[0],R[1],R[2],R[3]),c:'#262b31'},{q:bandQuad(p,B[0],B[1],B[0],B[2]),c:'#3d4349'});
    L.upper.push({q:bandQuad(p,u1,uh1,u2,uh2),c:'#4b5056',fans:noDots(p)?null:fans(p,u1,uh1,u2,uh2)});
    L.vip.push({q:bandQuad(p,V[0],V[1],V[0],V[2]),c:'#18222b',p,o:V[0],h:(V[1]+V[2])/2},{q:bandQuad(p,l2,lh2,u1,uh1),c:'#6d737a'});
    L.lower.push({q:bandQuad(p,l1,lh1,l2,lh2),c:'#575c62',fans:noDots(p)?null:fans(p,l1,lh1,l2,lh2)},{q:bandQuad(p,0,0,0,l1+lh1),c:'#7b8187'});
    L.fasc.push({q:bandQuad(p,F[0],F[1],F[0],F[2]),c:'#d9dde1',p,o:F[0],h:F[1]})}
  /* loca camlarında ışık, saçakta projektör, çatı altında makas */
  for(const v of L.vip){if(!v.p)continue;const[a,b]=ringPts(v.p,v.o-.3),len=Math.hypot(b[0]-a[0],b[1]-a[1]),n=Math.max(1,Math.floor(len/2.2));
    v.win=[];for(let i=0;i<n;i++){const t=(i+.5)/n;if(Math.random()<.78)v.win.push([a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t,v.h])}}
  for(const f of L.fasc){const[a,b]=ringPts(f.p,f.o-.05),len=Math.hypot(b[0]-a[0],b[1]-a[1]),n=Math.max(1,Math.floor(len/3.2));
    for(let i=0;i<n;i++){const t=(i+.5)/n;L.lights.push([a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t,f.h-.15])}
    if(!f.p.arc){const W=f.p.side==='N'?STD.wall:STD,R=W.roof,k=Math.max(1,Math.floor(len/6));
      for(let i=0;i<=k;i++){const t=i/k;const[fa,fb]=ringPts(f.p,R[2]),[ba,bb]=ringPts(f.p,R[0]);
        const F0=[fa[0]+(fb[0]-fa[0])*t,fa[1]+(fb[1]-fa[1])*t,R[3]-.6],B0=[ba[0]+(bb[0]-ba[0])*t,ba[1]+(bb[1]-ba[1])*t,R[1]-.6];
        L.truss.push([F0,B0]);if(i<k){const t2=(i+1)/k;L.truss.push([F0,[ba[0]+(bb[0]-ba[0])*t2,ba[1]+(bb[1]-ba[1])*t2,R[1]-1.8]])}}}}
  /* batı tribünü sıra şeritleri (TV: her sıra önceden çizilmiş tek görüntü, kare başına binlerce nokta yerine ~50 çizim) */
  /* tribün sıra şeritleri (düz kenarlar): her kenar ve kat için birkaç hazır sıra deseni; kare başına binlerce nokta yerine sıra başına birkaç çizim */
  L.strips={up:[],low:[]};
  if(strips){const ppm=10,k12=ppm/12,K=6,skins=['#f1c9a5','#e0ac7e','#c68a5a','#8d5a3b'];
    for(const sd of['W','N','E','S']){if(!mask[sd])continue;const ps=ring.filter(p=>p.side===sd);if(!ps.length)continue;
      for(const[key,[o1,h1,o2,h2]]of sd==='N'?[['up',STD.wall.tier]]:[['up',STD.up],['low',STD.low]]){
        const A=ringPts(ps[0],o1)[0],B=ringPts(ps[ps.length-1],o1)[1],len=Math.hypot(B[0]-A[0],B[1]-A[1]),wpx=Math.round(len*ppm),pats=[];
        for(let q=0;q<K;q++){const c=document.createElement('canvas');c.width=wpx;c.height=11;const g=c.getContext('2d');
          for(let x=2;x<wpx;x+=.8*step*ppm){if(Math.random()>.93)continue;const ym=A[1]+(B[1]-A[1])*x/wpx,home=(ym<PL/2)===(M&&!M.flip)?0:2;
            const ci=Math.random()<.6?(Math.random()<.72?home:2-home)+(Math.random()<.3?1:0):4+Math.floor(Math.random()*7);const jx=x+rand(-1,1)*k12;
            g.fillStyle=cols[ci];g.fillRect(jx-2.6*k12,3.5,5.2*k12,7.5);g.fillStyle=skins[Math.floor(Math.random()*4)];g.fillRect(jx-1.7*k12,0,3.4*k12,3.4)}
          pats.push(c)}
        const rows=Math.max(1,Math.round((o2-o1)/(.95*step)));
        for(let r=rows-1;r>=0;r--){if(r%7===6)continue;const f=(r+.5)/rows,o=o1+(o2-o1)*f,h=h1+(h2-h1)*f;
          const a=ringPts(ps[0],o)[0],b=ringPts(ps[ps.length-1],o)[1];
          L.strips[key].push({a,b,z:h,len,n:Math.max(1,Math.ceil(len/10)),r,img:pats[r%K],m:[(a[0]+b[0])/2,(a[1]+b[1])/2]})}
        /* köşe yayları da aynı desenlerle (yay parçaları kısa kirişler); batı NW/SW, doğu NE/SE yaylarını üstlenir */
        for(const ap of ring.filter(p=>p.arc&&({W:['NW','SW'],E:['NE','SE']}[sd]||[]).includes(p.side)))
          for(let r=rows-1;r>=0;r--){if(r%7===6)continue;const f=(r+.5)/rows,o=o1+(o2-o1)*f,h=h1+(h2-h1)*f,[a,b]=ringPts(ap,o),l=Math.hypot(b[0]-a[0],b[1]-a[1]);
            const sw=Math.max(4,Math.round(l*ppm)),sx=Math.floor(Math.random()*Math.max(1,wpx-sw));
            L.strips[key].push({a,b,z:h,len:l,n:1,r,img:pats[(r+3)%K],sx,sw,m:[(a[0]+b[0])/2,(a[1]+b[1])/2]})}}}}
  return{L,cols,heads:!!heads}}
/* canvas üzerinde boya: pr(x,y,z) -> [sx,sy,s] | null ; poly(points,color) dolu çokgen ; cam:[x,y] uzaktan yakına sıralama için */
function drawStadium(g,ST,pr,poly,cam,cel,above){
  if(!ST)return;const L=ST.L,far=o=>{let x=0,y=0;for(const p of o.q){x+=p[0];y+=p[1]}x/=o.q.length;y/=o.q.length;return-Math.hypot(x-cam[0],y-cam[1])};
  const sorted=a=>(a._s||(a._s=a.slice())).sort((u,v)=>far(u)-far(v));
  if(!above)for(const o of sorted(L.roof))poly(o.q,o.c);
  if(!above){g.strokeStyle='rgba(120,128,138,.55)';g.lineWidth=1;g.beginPath();
  for(const[A,B]of L.truss){const a=pr(...A),b=pr(...B);if(a&&b){g.moveTo(a[0],a[1]);g.lineTo(b[0],b[1])}}g.stroke()}
  const tt=performance.now()/1000;
  const dots=fs=>{let last=-1;for(const d of fs){const q=pr(d[0],d[1],d[2]+(cel&&d[4]<4.2?Math.max(0,Math.sin(tt*(6+d[4])+d[4]*7))*.45:0));
      if(!q||q[0]<-4||q[0]>g.canvas.width+4||q[1]<-4||q[1]>g.canvas.height+4)continue;if(d[3]!==last){last=d[3];g.fillStyle=ST.cols[last]}
      const w=Math.max(1,.46*q[2]),h=Math.max(1.2,.62*q[2]);g.fillRect(q[0]-w/2,q[1]-h,w,h);
      if(ST.heads&&q[2]>9){g.fillStyle=d[4]<2?'#e0ac7e':d[4]<4?'#c68a5a':'#f1c9a5';g.fillRect(q[0]-w*.32,q[1]-h-.3*q[2],w*.64,.3*q[2]);g.fillStyle=ST.cols[last]}}};
  const strip=a=>drawStrips(g,a.slice().sort((u,v)=>Math.hypot(v.m[0]-cam[0],v.m[1]-cam[1])-Math.hypot(u.m[0]-cam[0],u.m[1]-cam[1])),pr,cel,tt);
  for(const o of sorted(L.upper)){poly(o.q,o.c);if(o.fans)dots(o.fans)}
  if(L.strips)strip(L.strips.up);
  for(const o of sorted(L.vip)){poly(o.q,o.c);if(o.win){g.fillStyle='#ffd98a';for(const w of o.win){const q=pr(...w);if(q){const ww=Math.max(1,1.1*q[2]),hh=Math.max(1,.9*q[2]);g.fillRect(q[0]-ww/2,q[1]-hh/2,ww,hh)}}}}
  for(const o of sorted(L.lower)){poly(o.q,o.c);if(o.fans)dots(o.fans)}
  if(L.strips)strip(L.strips.low);
  if(above)for(const o of sorted(L.roof))poly(o.q,o.c==='#262b31'?'#9aa2aa':o.c); /* yukarıdan: çatı üstü açık gri */
  for(const o of sorted(L.fasc))poly(o.q,o.c);
  g.fillStyle='#fffbe8';for(const l of L.lights){const q=pr(...l);if(q){const w=Math.max(1.5,1*q[2]),h=Math.max(1,.45*q[2]);g.fillRect(q[0]-w/2,q[1]-h/2,w,h)}}
}
