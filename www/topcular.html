<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#1e140c">
<title>Topçular</title>
<style>
:root{--k:#9e1b1b;--a:#e0b04a;--p:#f3e4c0;--d:#1e140c;--sl:env(safe-area-inset-left,0px);--sr:env(safe-area-inset-right,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#1e140c;font-family:Georgia,'Times New Roman',serif;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
canvas{display:block;cursor:crosshair}
button{font-family:inherit}
.hidden{display:none!important}
.panel{background:linear-gradient(#2a1b10ee,#1a100aee);border:2px solid var(--a);border-radius:8px;color:var(--p);box-shadow:0 3px 10px #0008,inset 0 0 0 1px #0006;padding:6px 12px}
#top{position:fixed;top:max(8px,env(safe-area-inset-top));left:calc(8px + var(--sl));right:calc(8px + var(--sr));display:flex;justify-content:space-between;gap:8px;pointer-events:none;align-items:flex-start}
#top>*{pointer-events:auto}
#title b{display:block;letter-spacing:3px;color:var(--a);font-size:16px}
#title span{font-size:12px;opacity:.85}
#turn{font-size:14px;text-align:center;min-width:170px}
#turn small{display:block;opacity:.75;font-size:11px;letter-spacing:1px}
.rgt{display:flex;gap:8px;align-items:flex-start}
#windBox{display:flex;align-items:center;gap:8px;font-size:12px;letter-spacing:1px;height:40px}
#windBar{width:100px;height:10px;background:#0006;border:1px solid #e0b04a88;position:relative;border-radius:5px;overflow:hidden}
#windFill{position:absolute;top:0;bottom:0;background:linear-gradient(90deg,#7fc3e8,#d8f1ff)}
#windBar:after{content:'';position:absolute;left:50%;top:0;bottom:0;width:1px;background:var(--a)}
#windTxt{min-width:38px;text-align:right;font-weight:bold}
.rbtn{width:40px;height:40px;border-radius:50%;border:2px solid var(--a);background:#2a1b10;color:var(--p);font-size:16px;cursor:pointer;flex:none}
#bottom{position:fixed;bottom:max(8px,env(safe-area-inset-bottom));left:calc(8px + var(--sl));right:calc(8px + var(--sr));display:flex;justify-content:center;align-items:center;gap:10px;pointer-events:none}
#bottom>*{pointer-events:auto}
#weapons{display:flex;gap:5px;padding:5px}
.wbtn{font-size:13px;background:#3a2516;color:var(--p);border:1px solid #e0b04a66;border-radius:6px;padding:6px 9px;cursor:pointer;display:flex;align-items:center;gap:6px;white-space:nowrap}
.wbtn.sel{background:var(--k);border-color:var(--a);box-shadow:0 0 0 1px var(--a)}
.wbtn:disabled{opacity:.35;cursor:default}
.wbtn i{display:inline-block;border-radius:50%;background:#151515;box-shadow:inset -2px -2px 0 #000,inset 1px 1px 0 #777;flex:none}
.wbtn small{opacity:.85}
#aimInfo{font-size:14px;white-space:nowrap;display:flex;gap:12px;padding:5px 8px}
.ctl{display:flex;align-items:center;gap:5px}
.ctl b{min-width:42px;text-align:center;display:inline-block;color:var(--a)}
.sbtn{width:32px;height:32px;border-radius:6px;border:1px solid #e0b04a88;background:#3a2516;color:var(--p);font:bold 14px Georgia;cursor:pointer;touch-action:none}
.sbtn:active{background:var(--k)}
#fireBtn,.bigbtn{font:bold 16px Georgia,serif;letter-spacing:2px;color:#fff3d6;background:linear-gradient(#c22a22,#7d1210);border:2px solid var(--a);border-radius:10px;padding:10px 22px;cursor:pointer;box-shadow:0 4px 0 #4a0a08,0 6px 14px #0008}
#fireBtn:active,.bigbtn:active{transform:translateY(2px);box-shadow:0 2px 0 #4a0a08}
#fireBtn:disabled{filter:grayscale(.8);opacity:.55;cursor:default}
.btn2{font:15px Georgia,serif;color:#2b1a0e;background:linear-gradient(#f3e3bd,#d8bb83);border:2px solid #7d1210;border-radius:9px;padding:8px 18px;cursor:pointer;box-shadow:0 3px 0 #5a3a1a}
.btn2:active{transform:translateY(2px);box-shadow:0 1px 0 #5a3a1a}
#banner{position:fixed;left:0;right:0;top:24%;text-align:center;pointer-events:none;opacity:0;color:var(--p);text-shadow:0 3px 0 #000,0 0 20px #000}
#banner.show{animation:ban 1.9s ease forwards}
#bannerBig{font-size:clamp(26px,6vw,54px);letter-spacing:6px;color:var(--a);font-weight:bold}
#bannerSmall{font-size:clamp(14px,2.4vw,20px);margin-top:4px}
@keyframes ban{0%{opacity:0;transform:scale(1.15)}12%{opacity:1;transform:scale(1)}75%{opacity:1}100%{opacity:0}}
#toastWrap{position:fixed;left:0;right:0;top:76px;display:flex;justify-content:center;pointer-events:none}
#toast{opacity:0;font-size:15px}
#toast.show{animation:tst 2.6s ease forwards}
@keyframes tst{0%{opacity:0;transform:translateY(-6px)}10%{opacity:1;transform:none}80%{opacity:1}100%{opacity:0}}
#hint{position:fixed;left:50%;bottom:86px;transform:translateX(-50%);font-size:14px;text-align:center;line-height:1.45;pointer-events:none;animation:pulse 1.6s ease-in-out infinite}
#hint b{color:var(--a)}
@keyframes pulse{50%{box-shadow:0 0 0 4px #e0b04a55,0 3px 10px #0008}}
#overlay{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:radial-gradient(#0003,#000b);padding:12px;z-index:5}
#overlay.show{display:flex}
.card{max-width:520px;width:100%;text-align:center;padding:20px 24px;background:linear-gradient(#f5e7c6,#e1c792);color:#2b1a0e;border:3px solid #7d1210;outline:2px solid var(--a);outline-offset:-9px;border-radius:10px;box-shadow:0 20px 50px #000c;max-height:100%;overflow:auto}
.card h1{margin:0;font-size:clamp(28px,6vw,46px);letter-spacing:6px;color:#7d1210;text-shadow:0 2px 0 #e0b04a}
.card .sub{font-style:italic;margin:2px 0 10px;font-size:15px}
.card p{line-height:1.5;margin:8px 0;font-size:15px}
.card .help{font-size:13px;background:#0000000f;border:1px solid #7d121033;border-radius:6px;padding:8px 12px;text-align:left;margin:10px 0 14px;line-height:1.55}
.card .help b{color:#7d1210}
.card .row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:12px}
.foes{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin:8px 0}
.foes span{font-size:13px;background:#7d121014;border:1px solid #7d121044;border-radius:20px;padding:3px 10px}
.new{display:inline-block;background:#7d1210;color:#ffe9b8;border-radius:5px;padding:4px 10px;font-size:13px;margin-top:4px}
.stars{font-size:44px;color:#c48a12;letter-spacing:6px;text-shadow:0 2px 0 #7d1210;line-height:1.1}
.stars .off{color:#0003;text-shadow:none}
/* ana menü */
.screen{position:fixed;inset:0;z-index:4;display:none}
.screen.show{display:flex}
#menu{align-items:center;justify-content:flex-start;padding-left:calc(6vw + var(--sl));background:linear-gradient(90deg,#1e140cee 0%,#1e140caa 38%,#1e140c00 65%)}
.menuBox{display:flex;flex-direction:column;align-items:flex-start;gap:10px;max-width:420px}
.menuBox h1{margin:0;font-size:clamp(40px,9vw,76px);letter-spacing:10px;color:var(--a);text-shadow:0 4px 0 #7d1210,0 0 30px #000}
.menuBox .tag{color:var(--p);font-style:italic;font-size:clamp(14px,2.2vw,19px);margin:-4px 0 12px;opacity:.9}
.menuBox .bigbtn{font-size:18px;padding:12px 30px}
.menuBox .row{display:flex;gap:8px;flex-wrap:wrap}
.credit{color:var(--p);opacity:.6;font-size:12px;margin-top:10px;letter-spacing:1px}
.crest{width:84px;height:54px}
/* harita */
#map{flex-direction:column;background:#24170d;padding:max(10px,env(safe-area-inset-top)) calc(12px + var(--sr)) max(10px,env(safe-area-inset-bottom)) calc(12px + var(--sl))}
.mapTop{display:flex;align-items:center;justify-content:space-between;gap:10px;color:var(--p)}
.seferTitle{text-align:center}
.seferTitle small{display:block;letter-spacing:4px;color:var(--a);font-size:12px}
.seferTitle b{font-size:clamp(20px,3.6vw,30px);letter-spacing:6px}
.seferTitle span{display:block;font-size:12px;font-style:italic;opacity:.8}
.totStars{font-size:16px;color:var(--a);min-width:110px;text-align:right}
.mapBody{flex:1;display:flex;align-items:stretch;gap:10px;margin-top:8px;min-height:0}
.arrow{width:46px;border-radius:10px;border:2px solid var(--a);background:#2a1b10;color:var(--a);font-size:28px;cursor:pointer}
.arrow:disabled{opacity:.25;cursor:default}
.parch{flex:1;position:relative;border-radius:12px;border:3px solid #7d1210;outline:2px solid var(--a);outline-offset:-9px;background:radial-gradient(ellipse at 50% 40%,#f4e4bd 0%,#e6cc95 70%,#cfae6e 100%);overflow:hidden;box-shadow:inset 0 0 60px #7a4a1a66}
.parch svg{position:absolute;inset:0;width:100%;height:100%}
.node{position:absolute;transform:translate(-50%,-50%);background:none;border:0;cursor:pointer;display:flex;flex-direction:column;align-items:center;color:#2b1a0e;padding:0}
.seal{width:clamp(44px,7vw,62px);height:clamp(44px,7vw,62px);border-radius:50%;display:flex;align-items:center;justify-content:center;font:bold clamp(18px,3vw,26px) Georgia;color:#ffe9b8;background:radial-gradient(circle at 35% 30%,#d2402f,#8a1612 60%,#5c0c09);border:3px solid #e0b04a;box-shadow:0 4px 10px #0007}
.node .nm{font-weight:bold;font-size:clamp(12px,1.8vw,15px);margin-top:4px;text-shadow:0 1px 0 #fff8}
.node .yr{font-size:11px;font-style:italic;opacity:.8}
.node .st{color:#b57c0e;font-size:15px;letter-spacing:1px;text-shadow:0 1px 0 #5a3a10}
.node .st .off{color:#0002;text-shadow:none}
.node.locked{cursor:default}
.node.locked .seal{background:radial-gradient(circle at 35% 30%,#9a9488,#6f6a60 60%,#4d4943);border-color:#8d7f62;color:#e8e1cf}
.node.locked .nm,.node.locked .yr{opacity:.55}
.node.next .seal{animation:glow 1.4s ease-in-out infinite}
@keyframes glow{50%{box-shadow:0 0 0 6px #e0b04a88,0 4px 10px #0007}}
#rotate{display:none;position:fixed;inset:0;z-index:9;background:#1e140c;color:var(--p);align-items:center;justify-content:center;text-align:center;font-size:20px;padding:30px}
body.portrait.touch #rotate{display:flex}
html.rot body{position:fixed;top:0;left:0;width:100vh;height:100vw;transform:rotate(90deg) translateY(-100%);transform-origin:top left}
html.rot #rotate{display:none!important}
@media (max-height:500px){
  .panel{padding:4px 8px}#title{display:none}#turn{min-width:120px;font-size:12px}
  #fireBtn{padding:8px 14px;font-size:14px}.wbtn{padding:5px 7px;font-size:12px}.wbtn .wl{display:none}
  .sbtn{width:30px;height:30px}#aimInfo{gap:8px;font-size:12px}.ctl .lb{display:none}
  #toastWrap{top:54px}#hint{bottom:66px;font-size:12px}.rbtn{width:34px;height:34px;font-size:14px}#windBox{height:34px}#windBar{width:70px}
  .card{padding:12px 18px}.card p{font-size:13px;margin:5px 0}.card .help{font-size:12px;margin:6px 0 8px}.stars{font-size:34px}
}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="hud" class="hidden">
  <div id="top">
    <div class="panel" id="title"><b>TOPÇULAR</b><span id="lvTitle">—</span></div>
    <div class="panel" id="turn">—</div>
    <div class="rgt">
      <div class="panel" id="windBox"><span>RÜZGÂR</span><div id="windBar"><div id="windFill"></div></div><span id="windTxt">0</span></div>
      <button class="rbtn" id="pauseBtn" title="Duraklat">❚❚</button>
    </div>
  </div>
  <div id="bottom">
    <div class="panel" id="weapons">
      <button class="wbtn" data-w="gulle"><i style="width:12px;height:12px"></i><span class="wl">Gülle</span> <small id="am_gulle">∞</small></button>
      <button class="wbtn" data-w="sacma"><i style="width:6px;height:6px"></i><i style="width:6px;height:6px;margin-left:-4px"></i><span class="wl">Saçma</span> <small id="am_sacma">×2</small></button>
      <button class="wbtn" data-w="humbara"><i style="width:15px;height:15px"></i><span class="wl">Humbara</span> <small id="am_humbara">×2</small></button>
      <button class="wbtn" data-w="balyemez"><i style="width:15px;height:15px;background:#3b3026"></i><span class="wl">Balyemez</span> <small id="am_balyemez">×2</small></button>
    </div>
    <div class="panel" id="aimInfo"><span class="ctl"><button class="sbtn" data-k="ang" data-d="-1">▼</button><span class="lb">Açı</span><b id="angT">35°</b><button class="sbtn" data-k="ang" data-d="1">▲</button></span><span class="ctl"><button class="sbtn" data-k="pow" data-d="-1">−</button><span class="lb">Güç</span><b id="powT">%60</b><button class="sbtn" data-k="pow" data-d="1">+</button></span></div>
    <button id="fireBtn">ATEŞ!</button>
  </div>
  <div id="hint" class="panel hidden"></div>
</div>

<div id="banner"><div id="bannerBig"></div><div id="bannerSmall"></div></div>
<div id="toastWrap"><div id="toast" class="panel"></div></div>

<div id="menu" class="screen show">
  <div class="menuBox">
    <svg class="crest" viewBox="0 0 84 54"><g fill="#e0b04a"><rect x="14" y="20" width="56" height="12" rx="6" transform="rotate(-14 42 26)"/><circle cx="26" cy="38" r="12" fill="none" stroke="#e0b04a" stroke-width="4"/><circle cx="26" cy="38" r="3"/><path d="M8 50h44l-6-8H16z" fill="#9e1b1b"/><circle cx="74" cy="12" r="5"/></g></svg>
    <h1>TOPÇULAR</h1>
    <div class="tag">Rumeli'den Viyana'ya · 20 kuşatma</div>
    <button class="bigbtn" id="playBtn">SEFERE BAŞLA</button>
    <div class="row"><button class="btn2" id="howBtn">Nasıl Oynanır</button><button class="btn2" id="sndBtn">Ses: Açık</button></div>
    <div class="credit">Bir Mr. Anduv! yapımıdır. · v1.0</div>
  </div>
</div>

<div id="map" class="screen">
  <div class="mapTop">
    <button class="btn2" id="mapBack">‹ Menü</button>
    <div class="seferTitle"><small id="sfNo">I. SEFER</small><b id="sfName">RUMELİ</b><span id="sfSub"></span></div>
    <div class="totStars" id="totStars">★ 0 / 60</div>
  </div>
  <div class="mapBody">
    <button class="arrow" id="sfPrev">‹</button>
    <div class="parch"><svg id="mapSvg" viewBox="0 0 100 100" preserveAspectRatio="none"></svg><div id="nodes"></div></div>
    <button class="arrow" id="sfNext">›</button>
  </div>
</div>

<div id="overlay"><div class="card" id="card"></div></div>
<div id="rotate"><div>↻<br>Topçular yatay oynanır.<br>Telefonunu yan çevir.</div></div>

<script>
'use strict';
/* Champion maç modu: ?mac=1 ile lig maçı olarak açılır, sonucu ana oyuna yollar */
const MQ=new URLSearchParams(location.search);
const MAC=MQ.get('mac')==='1'?{lv:Math.max(0,Math.min(19,+MQ.get('lv')||0)),up:Math.max(0,Math.min(10,+MQ.get('up')||0)),ben:MQ.get('ben')||'Takımın',bk:MQ.get('bk')||'EV',b1:MQ.get('b1')||'#a3201c',b2:MQ.get('b2')||'#d9a536',
  rakip:MQ.get('rakip')||'Rakip',rk:MQ.get('rk')||'DEP',r1:MQ.get('r1')||'#3d5878',r2:MQ.get('r2')||'#a8a8a8',lig:MQ.get('lig')||'Lig',hafta:MQ.get('hafta')||'',saha:MQ.get('saha')||'ic',ses:MQ.get('ses')!=='0'}:null;
const TC1=MAC?MAC.b1:'#a3201c',TC2=MAC?MAC.b2:'#d9a536',EC1=MAC?MAC.r1:'#3d5878',EC2=MAC?MAC.r2:'#a8a8a8';
const macScore=(win,stars,prog)=>win?(stars>=3?[3,0]:stars===2?[2,1]:[1,0]):(prog>=.8?[1,1]:prog>=.5?[1,2]:[0,3]);
function macPost(d){try{(window.parent&&window.parent!==window?window.parent:window).postMessage(Object.assign({ccm:'sonuc'},d),'*');}catch(e){}}
let ROT=false;
const VW=()=>ROT?innerHeight:innerWidth,VH=()=>ROT?innerWidth:innerHeight;
// ================= SABİTLER =================
const W=2400,H=900,WATER=832,G=620,US=2.0,AIM_LEN=320,PV=1200;
const KIND={
  gulle:{r:33,dmg:45,size:6,wm:1,sm:0.72},
  sacma:{r:16,dmg:18,size:3.4,wm:1.2,sm:0.6},
  humbara:{r:60,dmg:70,size:8.5,wm:0.9,sm:0.7},
  balyemez:{r:40,dmg:62,size:8,wm:0.45,sm:1.05},
  egulle:{r:26,dmg:24,size:6,wm:1,sm:0.72},
  ehavan:{r:42,dmg:32,size:7.5,wm:0.8,sm:0.72},
  ok:{r:0,dmg:12,size:2,wm:1.5},
  kursun:{r:0,dmg:10,size:2,wm:0.35}
};
const WNAMES={gulle:'Gülle',sacma:'Saçma',humbara:'Humbara',balyemez:'Balyemez'};
const ETYPE={
  okcu:{hp:40,shot:'ok',vmax:820,name:'Okçu'},
  tufek:{hp:38,shot:'kursun',vmax:1350,name:'Tüfekçi'},
  top:{hp:66,shot:'egulle',vmax:1100,name:'Kale Topu'},
  havan:{hp:60,shot:'ehavan',vmax:960,name:'Havan',high:true}
};
const TER={
  nehir:{a:640,b:885,c:585,v1:560,v2:900,h1:1230,h2:1580},
  tepe:{a:650,b:885,c:530,v1:560,v2:880,h1:1200,h2:1540},
  dag:{a:690,b:880,c:470,v1:570,v2:880,h1:1150,h2:1540},
  ova:{a:660,b:735,c:665,v1:600,v2:820,h1:1250,h2:1440},
  deniz:{a:650,b:900,c:610,v1:560,v2:760,h1:1380,h2:1580}
};
const SEFER=[
  {no:'I. SEFER',name:'RUMELİ',sub:'Tuna boyunda ilk kaleler',sky:['#3d5f8a','#c9a77e','#f0c98e'],r1:'#8f8aa0',r2:'#6f7b78'},
  {no:'II. SEFER',name:'MACARİSTAN',sub:'Budin yolunda',sky:['#2f6aa3','#9fc0d8','#e9e0c4'],r1:'#8aa0b0',r2:'#6b8270'},
  {no:'III. SEFER',name:'ADALAR',sub:'Ege ve Akdeniz kaleleri',sky:['#4a4f8a','#d98f7a','#f6c48c'],r1:'#9a7f98',r2:'#7a6f80'},
  {no:'IV. SEFER',name:'ORTA AVRUPA',sub:'Kızıl Elma: Viyana',sky:['#26284f','#8a6a8a','#e0a070'],r1:'#5f5878',r2:'#4c5462'}
];
// bölüm: [ad, yıl, arazi, kale başlangıcı, bloklar [en, yükseklik, düşman], brifing]
const LEVELS=[
 ['Güvercinlik',1428,'nehir',1640,[[70,190,'okcu'],[50,110,null],[90,160,'top'],[64,180,'okcu']],'Tuna kıyısındaki bu kale ilk sınavın. Önce menzili ve rüzgârı tanı.'],
 ['Semendire',1439,'nehir',1620,[[76,200,'okcu'],[44,120,'okcu'],[30,0],[100,230,'top'],[70,170,'okcu']],'Semendire\'nin üçgen surları. Okçular çok, topları susturmayı ihmal etme.'],
 ['Akçahisar',1478,'dag',1600,[[70,150,'okcu'],[90,200,'top'],[40,0],[60,140,'okcu'],[76,180,'top']],'Kale dağın tepesinde. Yüksek açıyla atış gerekecek. Saçma artık cephanende.'],
 ['İşkodra',1479,'tepe',1580,[[70,190,'tufek'],[44,110,null],[100,240,'top'],[50,0],[60,130,'okcu'],[74,190,'tufek']],'Surlarda tüfekçiler var. Kurşunları dümdüz gelir, rüzgârdan pek etkilenmez.'],
 ['Belgrad',1521,'nehir',1615,[[80,207,'top'],[44,127,'okcu'],[91,0],[112,253,'top'],[96,117,'tufek'],[78,187,'okcu']],'Tuna\'nın ötesindeki büyük kale. Humbaralar geldi: büyük patlama, az cephane.'],
 ['Budin',1541,'tepe',1560,[[80,230,'top'],[50,130,'tufek'],[60,0],[120,240,'top'],[60,140,'okcu'],[50,0],[80,210,'tufek']],'Macaristan\'ın kalbi Budin. Burçlar yüksek, iyi nişan al.'],

function groundY(x){
  let y=T.a+(T.b-T.a)*sstep(T.v1,T.v2,x)+(T.c-T.b)*sstep(T.h1,T.h2,x);
  y+=(Math.sin(x*0.013)*10+Math.sin(x*0.031+1)*5+Math.sin(x*0.0045+2)*16)*(1-sstep(T.h2-120,T.h2,x)*0.75);
  return y;
}

const earth=new Uint8Array(W*H),stone=new Uint8Array(W*H);
function mkCanvas(){const c=document.createElement('canvas');c.width=W;c.height=H;return c;}
const earthC=mkCanvas(),stoneC=mkCanvas(),ectx=earthC.getContext('2d'),sctx=stoneC.getContext('2d');
function solid(x,y){x|=0;y|=0;if(x<0||x>=W||y<0)return false;if(y>=H)return true;const i=y*W+x;return earth[i]===1||stone[i]===1;}
function surfaceY(x){for(let y=0;y<H;y++)if(solid(x,y))return y;return H;}
let enemySpots=[],flagSpot=null;

function buildWorld(){
  earth.fill(0);stone.fill(0);
  ectx.clearRect(0,0,W,H);sctx.clearRect(0,0,W,H);
  const img=ectx.createImageData(W,H),d=img.data;
  const sand=LV.ter==='deniz';
  for(let x=0;x<W;x++){
    const top=Math.round(groundY(x));
    for(let y=Math.max(0,top);y<H;y++){
      const i=y*W+x;earth[i]=1;
      const dep=y-top,n=hash(x,y);let r,g,b;
      if(dep<4){if(sand&&top>WATER-30){r=200+n*20;g=180+n*20;b=120;}else{r=78+n*25;g=128+n*30;b=46;}}
      else if(dep<8){r=96+n*20;g=96+n*16;b=44;}
      else{const f=1-Math.min(dep/520,0.5),s=Math.sin(y*0.06+Math.sin(x*0.01)*2)*8;
        r=(128+s+n*18)*f;g=(88+s*0.7+n*14)*f;b=(52+n*10)*f;
        if(LV.ter==='dag'&&x>T.h1){r=(118+s+n*20)*f;g=(104+s+n*18)*f;b=(92+n*14)*f;}
        if(n>0.992){r=150;g=142;b=128;}}
      const p=i*4;d[p]=r;d[p+1]=g;d[p+2]=b;d[p+3]=255;
    }
  }
  ectx.putImageData(img,0,0);

  const simg=sctx.createImageData(W,H),sd=simg.data;
  const tint=[[0,0,0],[6,4,-4],[14,8,-6],[-8,-6,0]][LV.sefer];
  function rect(x0,y0,x1,y1,slit){
    x0=Math.max(0,x0|0);y0=Math.max(0,y0|0);x1=Math.min(W,x1|0);y1=Math.min(H,y1|0);
    for(let y=y0;y<y1;y++)for(let x=x0;x<x1;x++){
      const i=y*W+x;stone[i]=1;
      const row=Math.floor(y/12),off=(row%2)*13,bx=Math.floor((x+off)/26);
      let r,g,b;
      if((y%12)<2||((x+off)%26)<2){r=74;g=68;b=60;}
      else{const v=hash(bx,row)*34,n=hash(x,y)*10;r=150+v+n+tint[0];g=140+v+n+tint[1];b=122+v*0.8+n+tint[2];}
      if(x-x0<3||x1-x<3){r*=0.72;g*=0.72;b*=0.72;}
      if(slit&&Math.abs(x-slit.x)<2&&y>slit.y&&y<slit.y+24){r=34;g=28;b=24;}
      const p=i*4;sd[p]=r;sd[p+1]=g;sd[p+2]=b;sd[p+3]=255;
    }
  }
  enemySpots=[];flagSpot=null;let best=-1;
  let x=LV.cx;
  for(const bl of LV.blocks){
    const [w,h,type]=bl;
    if(h>0){
      const gy=groundY(x+w/2),top=gy-h,bottom=Math.max(groundY(x),groundY(x+w),gy)+45;
      rect(x,top,x+w,bottom,w>=70&&h>=150?{x:x+w/2,y:top+40}:null);
      const ux=x+w/2;
      for(let mx=x+3;mx+11<=x+w;mx+=22){
        if(type&&Math.abs(mx+5.5-ux)<30)continue;
        rect(mx,top-14,mx+11,top);
      }
      if(type)enemySpots.push([type,ux]);
      if(h>best){best=h;flagSpot={x:type?x+w-8:x+w/2,top};}
    }
    x+=w;
  }
  sctx.putImageData(simg,0,0);
}

function carve(mask,c,x,y,r){
  if(r<=0)return;
  const r2=r*r,x0=Math.max(0,Math.floor(x-r)),x1=Math.min(W-1,Math.ceil(x+r)),y0=Math.max(0,Math.floor(y-r)),y1=Math.min(H-1,Math.ceil(y+r));
  for(let yy=y0;yy<=y1;yy++){const dy=yy-y;for(let xx=x0;xx<=x1;xx++){const dx=xx-x;if(dx*dx+dy*dy<=r2)mask[yy*W+xx]=0;}}
  c.save();
  c.globalCompositeOperation='destination-out';c.beginPath();c.arc(x,y,r,0,7);c.fill();
  c.globalCompositeOperation='source-atop';
  const gr=c.createRadialGradient(x,y,r,x,y,r+9);gr.addColorStop(0,'rgba(25,15,8,0.75)');gr.addColorStop(1,'rgba(25,15,8,0)');
  c.fillStyle=gr;c.beginPath();c.arc(x,y,r+9,0,7);c.fill();
  c.restore();
}

let ac=null,noiseBuf=null;
function initAudio(){
  if(!ac){try{ac=new(window.AudioContext||window.webkitAudioContext)();const len=ac.sampleRate*2;noiseBuf=ac.createBuffer(1,len,ac.sampleRate);const d=noiseBuf.getChannelData(0);for(let i=0;i<len;i++)d[i]=Math.random()*2-1;}catch(e){ac=null;}}
  if(ac&&ac.state==='suspended')ac.resume();
}
document.addEventListener('visibilitychange',()=>{if(document.hidden){if(ac)ac.suspend();if(state!=='menu'&&state!=='map'&&state!=='over'&&state!=='brief')setPause(true);}else if(ac)ac.resume();});
function noise(dur,freq,type,vol,q,endFreq,delay){
  if(!ac||!S.sound)return;const t=ac.currentTime+(delay||0);
  const s=ac.createBufferSource();s.buffer=noiseBuf;
  const f=ac.createBiquadFilter();f.type=type;f.frequency.setValueAtTime(freq,t);f.Q.value=q||1;
  if(endFreq)f.frequency.exponentialRampToValueAtTime(endFreq,t+dur);
  const g=ac.createGain();g.gain.setValueAtTime(Math.min(vol,1),t);g.gain.exponentialRampToValueAtTime(0.001,t+dur);
  s.connect(f);f.connect(g);g.connect(ac.destination);s.start(t,Math.random());s.stop(t+dur+0.05);
}
function tone(f0,f1,dur,vol,type,delay){
  if(!ac||!S.sound)return;const t=ac.currentTime+(delay||0);
  const o=ac.createOscillator();o.type=type||'sine';o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(f1,t+dur);
  const g=ac.createGain();g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(Math.min(vol,1),t+0.01);g.gain.exponentialRampToValueAtTime(0.001,t+dur);
  o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+dur+0.05);
}

function nextTurn(){
  const pl=units.filter(u=>u.team===0&&!u.dead),en=units.filter(u=>u.team===1&&!u.dead);
  if(!en.length)return endGame(true);
  if(!pl.length)return endGame(false);
  wind=Math.round(rnd(-1,1)*LV.wind);turnTeam=1-turnTeam;manualCam=false;
  if(turnTeam===0){
    const list=units.filter(u=>u.team===0);
    do{pIdx=(pIdx+1)%list.length;}while(list[pIdx].dead);
    active=list[pIdx];aimPow=active.lastPow;state='aim';
    if(ammo[weapon]<=0)weapon='gulle';
    banner('SENİN SIRAN',active.name);
    if(LV.n===1&&shots===0)setHint('Topunun önüne dokun ve hedefe doğru <b>sürükle</b>.<br>Sonra <b>ATEŞ!</b> düğmesine bas.');
  }else{
    const list=units.filter(u=>u.team===1);

    active=list[eIdx];aiPlan=planShot(active);thinkT=1.1;state='think';

}

function macEnd(win,stars){

// ================= YAPAY ZEKÂ =================
function sim(x,y,vx,vy,wm,tx,ty){
  const dt=1/60;let best=1e12;
  for(let i=0;i<500;i++){
    vx+=wind*wm*dt;vy+=G*dt;x+=vx*dt;y+=vy*dt;
    const dx=x-tx,dy=y-ty,d=dx*dx+dy*dy;if(d<best)best=d;
    if(y>=WATER&&!solid(x,WATER))break;
    if(solid(x,y)||x<-150||x>W+150)break;
  }
  return best;
}
function planShot(u,errOverride){
  const foes=units.filter(t=>t.team!==u.team&&!t.dead);
  const t=u.team===0&&window.__botFront?foes.reduce((a,b)=>b.x<a.x?b:a):foes[Math.floor(Math.random()*foes.length)];
  let vmax,wm,a0,a1,kind;
  if(u.team===1){const E=ETYPE[u.type];kind=E.shot;vmax=E.vmax;wm=KIND[kind].wm;
    if(E.high){a0=95;a1=140;}else{a0=92;a1=205;}}
  else{kind=weapon;vmax=PV;wm=KIND[kind].wm;a0=-5;a1=85;}
  let best=1e12,ba=(a0+a1)/2,bp=0.7;
  for(let ang=a0;ang<=a1;ang+=1.5){
    const a=ang*Math.PI/180,dx=Math.cos(a),dy=-Math.sin(a),mx=u.x+dx*24*US,my=u.y-16*US+dy*24*US;
    for(let p=0.3;p<=1.001;p+=0.025){
      const d=sim(mx,my,dx*vmax*p,dy*vmax*p,wm,t.x,t.y-13*US);
      if(d<best){best=d;ba=ang;bp=p;}
    }
  }
  const err=errOverride!=null?errOverride:Math.max(LV.errMin,LV.err0-enemyShots*0.12)+(MAC?(MAC.up-5)*0.18:0);
  ba+=rnd(-err,err);bp*=1+rnd(-err,err)*0.008;
  return{ang:ba,pow:clamp(bp,0.2,1),kind};
}

// ================= ATIŞ & PATLAMA =================
function fire(u,ang,pow,kind){
  const a=ang*Math.PI/180,dx=Math.cos(a),dy=-Math.sin(a);
  const mx=u.x+dx*24*US,my=u.y-16*US+dy*24*US;
  const vmax=u.team===1?ETYPE[u.type].vmax:PV,v=vmax*pow;
  if(u.team===0)u.lastPath=[];
  const mk=(da,dv,rec)=>{const aa=a+da;projs.push({x:mx,y:my,vx:Math.cos(aa)*v*dv,vy:-Math.sin(aa)*v*dv,kind,owner:u,t:0,trail:[],rec});};
  if(kind==='sacma'){mk(0,1,u.lastPath);for(let k=0;k<4;k++)mk(rnd(-0.06,0.06),rnd(0.93,1.05));}else mk(0,1,u.lastPath);
  u.recoil=1;u.aim=ang;
  if(kind==='ok')sndBow();
  else if(kind==='kursun'){sndShot();for(let i=0;i<5;i++)parts.push({type:'smoke',x:mx,y:my,vx:dx*rnd(10,40),vy:dy*rnd(10,40)-10,life:rnd(0.6,1.1),max:1.1,size:rnd(3,6),g:-15});}
  else{
    parts.push({type:'flash',x:mx,y:my,vx:0,vy:0,life:0.12,max:0.12,size:26});
    for(let i=0;i<10;i++)parts.push({type:'smoke',x:mx,y:my,vx:dx*rnd(20,90)+rnd(-20,20),vy:dy*rnd(20,90)-rnd(5,25),life:rnd(0.8,1.6),max:1.6,size:rnd(6,12),g:-15});
    shake+=kind==='balyemez'?7:4;sndFire();
  }
  state='fly';manualCam=false;
}

function updateProjs(dt){
  const steps=4,sd=dt/steps;
  for(let i=projs.length-1;i>=0;i--){
    const p=projs[i],K=KIND[p.kind];p.t+=dt;let done=false;
    for(let s=0;s<steps&&!done;s++){
      p.vx+=wind*K.wm*sd;p.vy+=G*sd;p.x+=p.vx*sd;p.y+=p.vy*sd;
      if(p.y>=WATER&&!solid(p.x,WATER)){splashAt(p.x,K.size);done=true;break;}
      if(p.x<-200||p.x>W+200||p.y>H+50){done=true;break;}
      if(solid(p.x,p.y)){impact(p,null);done=true;break;}
      for(const u of units){
        if(u.dead||u.gone||(u===p.owner&&p.t<0.25))continue;
        const dx=p.x-u.x,dy=p.y-(u.y-13*US);
        if(dx*dx+dy*dy<(15*US)*(15*US)){impact(p,u);done=true;break;}
      }
    }
    if(p.rec)p.rec.push({x:p.x,y:p.y});
    if(K.r>0){p.trail.push({x:p.x,y:p.y});if(p.trail.length>18)p.trail.shift();}
    if((p.kind==='humbara'||p.kind==='ehavan')&&Math.random()<0.6)parts.push({type:'spark',x:p.x,y:p.y-6,vx:rnd(-40,40),vy:rnd(-60,0),life:0.3,max:0.3,size:2,g:200});
    if(done)projs.splice(i,1);
  }
}

function impact(p,hit){
  const K=KIND[p.kind],dm=p.owner.team===1?LV.dmgM:1;
  if(K.r===0){
    if(hit)damage(hit,Math.round(K.dmg*dm));
    else{
      if(p.kind==='ok')arrows.push({x:p.x,y:p.y,a:Math.atan2(p.vy,p.vx)});
      for(const u of units){if(!u.dead&&!u.gone&&Math.hypot(u.x-p.x,u.y-13*US-p.y)<18*US)damage(u,Math.round(K.dmg*0.5*dm));}
      for(let i=0;i<4;i++)parts.push({type:'debris',x:p.x,y:p.y,vx:rnd(-50,50),vy:rnd(-90,-20),life:0.5,max:0.5,size:2,g:500,c:'#7a5634'});
    }
    sndThud();return;
  }
  explode(p.x,p.y,K.r,Math.round(K.dmg*dm),K.sm);
}

function explode(x,y,r,dmg,sm){
  const i=(clamp(y|0,0,H-1))*W+clamp(x|0,0,W-1),wasStone=stone[i]===1;
  carve(earth,ectx,x,y,r);carve(stone,sctx,x,y,r*(sm||0.72));
  parts.push({type:'flash',x,y,vx:0,vy:0,life:0.2,max:0.2,size:r*1.7});
  for(let k=0;k<12;k++)parts.push({type:'spark',x,y,vx:rnd(-250,250),vy:rnd(-300,50),life:rnd(0.3,0.6),max:0.6,size:2.5,g:500});
  for(let k=0;k<10+r/4;k++)parts.push({type:'smoke',x:x+rnd(-r/2,r/2),y:y+rnd(-r/2,r/3),vx:rnd(-30,30),vy:rnd(-60,-10),life:rnd(1,2.2),max:2.2,size:rnd(r*0.3,r*0.6),g:-10});
  const cols=wasStone?['#9a907e','#7d7466','#b3a990']:['#7a5634','#5e3f22','#8b6a3f'];
  for(let k=0;k<14+r/3;k++)parts.push({type:'debris',x,y,vx:rnd(-280,280),vy:rnd(-420,-80),life:rnd(0.8,1.6),max:1.6,size:rnd(2,6),g:900,c:cols[k%3]});
  for(const u of units){
    if(u.gone)continue;
    const dx=u.x-x,dy=(u.y-13*US)-y,d=Math.hypot(dx,dy),R=r+20*US;
    if(d<R){
      const f=1-d/R;if(!u.dead)damage(u,Math.round(dmg*(0.45+0.55*f)));
      const m=u.type==='top'||u.type==='havan'?0.6:1,nx=dx/(d||1),ny=dy/(d||1);
      u.vx+=nx*f*260*m;u.vy+=(Math.min(ny,0)*f*260-f*180)*m;u.air=true;
    }
  }
  shake+=r*0.3;sndBoom(r/30);
}

function splashAt(x,size){
  for(let k=0;k<16;k++)parts.push({type:'water',x:x+rnd(-6,6),y:WATER,vx:rnd(-90,90),vy:rnd(-320,-80),life:rnd(0.6,1.1),max:1.1,size:rnd(2,4)+size*0.25,g:800});
  sndSplash();
}

function damage(u,amt){
  if(u.dead||amt<=0)return;
  u.hp-=amt;u.flash=0.3;
  texts.push({x:u.x,y:u.y-62*US,t:'-'+amt,life:1.3,c:u.team===0?'#ff8a7a':'#ffe08a'});
  if(u.hp<=0){
    u.hp=0;u.dead=true;
    for(let k=0;k<12;k++)parts.push({type:'smoke',x:u.x+rnd(-10,10),y:u.y-12*US,vx:rnd(-20,20),vy:rnd(-50,-10),life:rnd(1,2),max:2,size:rnd(6,12),g:-10});
    toast(u.team===1?`${u.name} susturuldu!`:`${u.name} düştü!`);
  }
}

// ================= BİRİM FİZİĞİ =================
function updateUnits(dt){
  for(const u of units){
    if(u.gone)continue;
    u.recoil=Math.max(0,u.recoil-dt*3);u.flash=Math.max(0,u.flash-dt);
    if(!u.air&&!solid(u.x,u.y+1))u.air=true;
    if(u.air){
      u.vy+=G*dt;
      let nx=u.x+u.vx*dt;if(solid(nx,u.y-10*US)){u.vx*=-0.3;nx=u.x;}u.x=clamp(nx,2,W-2);
      let ny=u.y+u.vy*dt;
      if(u.vy>0&&solid(u.x,ny)){
        let k=0;while(solid(u.x,ny)&&k<80){ny--;k++;}
        if(u.vy>380&&!u.dead)damage(u,Math.round((u.vy-380)*0.08));
        u.y=ny;u.vy=0;u.vx=0;u.air=false;
      }else if(u.vy<0&&solid(u.x,ny-24*US)){u.vy=0;}
      else u.y=ny;
    }
    if(u.y>WATER+4&&!solid(u.x,WATER)){
      if(!u.dead)damage(u,u.hp);
      splashAt(u.x,6);u.gone=true;u.air=false;
    }
    if(u.y>H+40)u.gone=true;
  }
  smokeT-=dt;
  if(smokeT<=0){smokeT=0.18;for(const u of units)if(u.dead&&!u.gone&&(u.type==='top'||u.type==='havan')&&Math.random()<0.6)
    parts.push({type:'smoke',x:u.x+rnd(-4,4),y:u.y-14*US,vx:wind*0.3,vy:-30,life:1.6,max:1.6,size:rnd(4,8),g:-5});}
}

// ================= GÜNCELLEME =================
const keys={},hold={ang:0,pow:0};
function update(dt){
  time+=dt;
  for(const c of clouds){c.x+=(wind*0.35+8)*dt;if(c.x>W+400)c.x=-400;if(c.x<-400)c.x=W+400;}
  if(paused){updateCam(dt);return;}
  for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.vy+=(p.g||0)*dt;if(p.type==='smoke')p.vx+=wind*0.25*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt;if(p.type==='smoke')p.size+=dt*8;if(p.type==='water'&&p.y>WATER+4&&p.vy>0)p.life=0;if(p.life<=0)parts.splice(i,1);}
  for(let i=texts.length-1;i>=0;i--){const t=texts[i];t.y-=28*dt;t.life-=dt;if(t.life<=0)texts.splice(i,1);}
  for(let i=arrows.length-1;i>=0;i--){const a=arrows[i];if(!solid(a.x+Math.cos(a.a)*2,a.y+Math.sin(a.a)*2))arrows.splice(i,1);}
  if(state!=='menu'&&state!=='map')updateUnits(dt);

  if(state==='aim'&&active){
    let ch=false;const fine=keys.Shift?0.25:1;
    const da=(keys.ArrowUp?1:0)-(keys.ArrowDown?1:0)+hold.ang,dp=(keys.ArrowRight?1:0)-(keys.ArrowLeft?1:0)+hold.pow;
    if(da){active.aim=clamp(active.aim+da*25*fine*dt,-5,85);ch=true;}
    if(dp){aimPow=clamp(aimPow+dp*0.35*fine*dt,0.05,1);ch=true;}
    if(ch){manualCam=false;updateAimHUD();}
  }
  if(state==='think'&&active){
    thinkT-=dt;active.aim+=(aiPlan.ang-active.aim)*Math.min(1,dt*4);
    if(thinkT<=0){fire(active,aiPlan.ang,aiPlan.pow,aiPlan.kind);enemyShots++;updateHUD();}
  }
  if(state==='fly'){updateProjs(dt);if(!projs.length){state='settle';settleT=0;}}
  if(state==='settle'){
    if(units.every(u=>u.gone||!u.air))settleT+=dt;else settleT=0;
    if(settleT>0.7)nextTurn();
  }
  shake=Math.max(0,shake-dt*28);
  updateCam(dt);
}

function clampCam(x){return viewW>=W?(W-viewW)/2:clamp(x,0,W-viewW);}
function updateCam(dt){
  let tx=camX;
  if(!manualCam){
    if(state==='menu'||state==='map'||state==='over')tx=(Math.sin(time*0.12)*0.5+0.5)*(W-viewW);
    else if(state==='brief')tx=W-viewW;
    else if(state==='aim'&&active){const mx=Math.min(...units.filter(u=>u.team===0&&!u.dead).map(u=>u.x)),pad=(70*DPR)/scale+60;tx=Math.min(mx-pad,Math.max(active.x-viewW*0.15,LV.cx+220-viewW));}
    else if(state==='think'&&active)tx=active.x-viewW*0.72;
    else if(state==='fly'&&projs.length)tx=projs[0].x-viewW*0.5;
  }
  tx=clampCam(tx);
  camX+=(tx-camX)*Math.min(1,dt*(state==='fly'?4:2));
  camX=clampCam(camX);
}

// ================= ÇİZİM =================
function ridge(f,base,amp,freq,color){
  ctx.fillStyle=color;ctx.beginPath();ctx.moveTo(0,cv.height);
  for(let sx=0;sx<=cv.width+8;sx+=8){
    const wx=sx/scale+camX*f;
    const wy=base+Math.sin(wx*freq)*amp+Math.sin(wx*freq*2.7+1.3)*amp*0.4;
    ctx.lineTo(sx,(wy-camY)*scale);
  }
  ctx.lineTo(cv.width,cv.height);ctx.fill();
}
function drawSky(){
  const SF=SEFER[LV?LV.sefer:0];
  ctx.setTransform(1,0,0,1,0,0);
  const g=ctx.createLinearGradient(0,0,0,cv.height);
  g.addColorStop(0,SF.sky[0]);g.addColorStop(0.55,SF.sky[1]);g.addColorStop(0.85,SF.sky[2]);
  ctx.fillStyle=g;ctx.fillRect(0,0,cv.width,cv.height);
  const sx=cv.width*0.72-camX*scale*0.05,sy=(250-camY)*scale,sr=46*scale;
  const sg=ctx.createRadialGradient(sx,sy,sr*0.6,sx,sy,sr*4);sg.addColorStop(0,'rgba(255,236,190,0.7)');sg.addColorStop(1,'rgba(255,236,190,0)');
  ctx.fillStyle=sg;ctx.fillRect(sx-sr*4,sy-sr*4,sr*8,sr*8);
  ctx.fillStyle='#fff1cf';ctx.beginPath();ctx.arc(sx,sy,sr,0,7);ctx.fill();
  for(const c of clouds){
    const cx=(c.x-camX*0.5)*scale,cy=(c.y-camY)*scale,s=c.s*scale;
    ctx.fillStyle='rgba(255,246,230,0.75)';
    ctx.beginPath();ctx.ellipse(cx,cy,60*s,18*s,0,0,7);ctx.ellipse(cx-30*s,cy+4*s,34*s,14*s,0,0,7);ctx.ellipse(cx+28*s,cy-6*s,38*s,20*s,0,0,7);ctx.fill();
  }
  ridge(0.15,520,60,0.004,SF.r1);
  ridge(0.35,610,45,0.007,SF.r2);
}
function drawWater(){
  const g=ctx.createLinearGradient(0,WATER,0,H);g.addColorStop(0,LV&&LV.ter==='deniz'?'#2f7a9a':'#3f7896');g.addColorStop(1,'#1a3447');
  ctx.fillStyle=g;ctx.beginPath();ctx.moveTo(camX-20,H+60);
  for(let x=camX-20;x<=camX+viewW+20;x+=10)ctx.lineTo(x,WATER+Math.sin(x*0.03+time*2)*2);
  ctx.lineTo(camX+viewW+20,H+60);ctx.fill();
  ctx.strokeStyle='rgba(220,240,255,0.5)';ctx.lineWidth=2;ctx.beginPath();
  for(let x=camX-20;x<=camX+viewW+20;x+=10){const y=WATER+Math.sin(x*0.03+time*2)*2;x===camX-20?ctx.moveTo(x,y):ctx.lineTo(x,y);}
  ctx.stroke();
}
function drawTent(x){

}
function drawFlag(x,baseY,crescent){

function drawSoldier(team,dead,gear,aim){

function drawArrowShape(x,y,a,len){

function drawProjs(){
  for(const p of projs){
    const K=KIND[p.kind];

    if(p.kind==='kursun'){const a=Math.atan2(p.vy,p.vx);ctx.strokeStyle='rgba(255,240,200,0.5)';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(p.x-Math.cos(a)*14,p.y-Math.sin(a)*14);ctx.lineTo(p.x,p.y);ctx.stroke();ctx.fillStyle='#333';ctx.beginPath();ctx.arc(p.x,p.y,2.5,0,7);ctx.fill();continue;}
    for(let i=0;i<p.trail.length;i++){const t=p.trail[i];ctx.fillStyle=`rgba(230,225,215,${(i/p.trail.length)*0.3})`;ctx.beginPath();ctx.arc(t.x,t.y,K.size*0.9,0,7);ctx.fill();}
    ctx.fillStyle=p.kind==='balyemez'?'#3b3026':'#1d1d1d';ctx.beginPath();ctx.arc(p.x,p.y,K.size,0,7);ctx.fill();
    ctx.fillStyle='#777';ctx.beginPath();ctx.arc(p.x-K.size*0.35,p.y-K.size*0.35,K.size*0.3,0,7);ctx.fill();
    if(p.kind==='humbara'||p.kind==='ehavan'){ctx.fillStyle=Math.random()<0.5?'#ffd25a':'#ff7a2a';ctx.beginPath();ctx.arc(p.x+2,p.y-K.size-2,2.5,0,7);ctx.fill();}

function drawParts(){
  for(const p of parts){

    else if(p.type==='flash'){const g=ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,p.size);g.addColorStop(0,`rgba(255,250,210,${a})`);g.addColorStop(0.4,`rgba(255,170,60,${a*0.8})`);g.addColorStop(1,'rgba(255,90,20,0)');ctx.fillStyle=g;ctx.beginPath();ctx.arc(p.x,p.y,p.size,0,7);ctx.fill();}
    else if(p.type==='spark'){ctx.fillStyle=`rgba(255,${180+Math.random()*60|0},80,${a})`;ctx.fillRect(p.x-1,p.y-1,p.size,p.size);}
    else if(p.type==='debris'){ctx.globalAlpha=Math.min(1,a*2);ctx.fillStyle=p.c;ctx.fillRect(p.x-p.size/2,p.y-p.size/2,p.size,p.size);ctx.globalAlpha=1;}
    else if(p.type==='water'){ctx.fillStyle=`rgba(200,230,250,${a*0.9})`;ctx.beginPath();ctx.arc(p.x,p.y,p.size,0,7);ctx.fill();}
  }
}
function drawAimGuide(){
  if(state!=='aim'||!active||paused)return;
  const a=active.aim*Math.PI/180,v=PV*aimPow;
  if(active.lastPath&&active.lastPath.length>1){
    ctx.fillStyle='rgba(255,255,255,0.38)';
    for(let i=0;i<active.lastPath.length;i+=4){const q=active.lastPath[i];ctx.beginPath();ctx.arc(q.x,q.y,2.6,0,7);ctx.fill();}
  }
  let x=active.x+Math.cos(a)*24*US,y=active.y-16*US-Math.sin(a)*24*US,vx=Math.cos(a)*v,vy=-Math.sin(a)*v;const dt=1/60,N=75;
  ctx.fillStyle='#fff8e6';
  for(let i=1;i<=N;i++){vy+=G*dt;x+=vx*dt;y+=vy*dt;if(solid(x,y))break;if(i%3===0){ctx.globalAlpha=(1-i/N)*0.95;ctx.beginPath();ctx.arc(x,y,3.6,0,7);ctx.fill();}}
  ctx.globalAlpha=1;
  const px=active.x,py=active.y-14*US,L=40+aimPow*(AIM_LEN-40),ex=px+Math.cos(a)*L,ey=py-Math.sin(a)*L;
  ctx.strokeStyle='rgba(0,0,0,0.45)';ctx.lineWidth=10;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(px,py);ctx.lineTo(ex,ey);ctx.stroke();
  const pc=aimPow<0.5?'#e0b04a':aimPow<0.8?'#f08a2a':'#e0442a';
  ctx.strokeStyle=pc;ctx.lineWidth=6;ctx.beginPath();ctx.moveTo(px,py);ctx.lineTo(ex,ey);ctx.stroke();
  ctx.save();ctx.translate(ex,ey);ctx.rotate(-a);ctx.fillStyle=pc;ctx.beginPath();ctx.moveTo(16,0);ctx.lineTo(-4,-10);ctx.lineTo(-4,10);ctx.closePath();ctx.fill();ctx.restore();
  ctx.lineCap='butt';
  if(aiming&&dragPt){ctx.fillStyle='rgba(255,240,200,0.6)';ctx.beginPath();ctx.arc(dragPt.x,dragPt.y,8,0,7);ctx.fill();}
}
function draw(){
  drawSky();

  const sx=(Math.random()-0.5)*shake*scale,sy=(Math.random()-0.5)*shake*scale;
  ctx.setTransform(scale,0,0,scale,-camX*scale+sx,-camY*scale+sy);
  drawWater();
  ctx.drawImage(earthC,0,0);ctx.drawImage(stoneC,0,0);
  drawTent(48);drawFlag(102,surfaceY(102),true);
  if(flagSpot){const fy=surfaceY(flagSpot.x);if(fy<flagSpot.top+20)drawFlag(flagSpot.x,fy,false);}

  ctx.globalAlpha=1;
  // ekranın üstüne çıkan gülle için işaret
  ctx.setTransform(1,0,0,1,0,0);
  for(const p of projs){if(p.y>=camY-10)continue;const x=(p.x-camX)*scale;if(x<0||x>cv.width)continue;
    const k=DPR,a=clamp(1-(camY-p.y)/1400,0.35,1);ctx.globalAlpha=a;ctx.fillStyle='#e0b04a';ctx.strokeStyle='#3a240c';ctx.lineWidth=2*k;
    ctx.beginPath();ctx.moveTo(x,6*k);ctx.lineTo(x-9*k,22*k);ctx.lineTo(x+9*k,22*k);ctx.closePath();ctx.fill();ctx.stroke();}
  ctx.globalAlpha=1;
}

function playerFire(){
  if(paused||state!=='aim'||!active||aimPow<0.05||ammo[weapon]<=0)return;
  ammo[weapon]--;shots++;active.lastPow=aimPow;setHint(null);
  fire(active,active.aim,aimPow,weapon);
  if(ammo[weapon]<=0)weapon='gulle';
  updateHUD();
}

let mapSef=0;
function openMap(sf){
  state='map';paused=false;if(sf==null)sf=Math.min(3,Math.floor((S.open-1)/5));mapSef=sf;

function renderMap(){
  const SF=SEFER[mapSef];
  $('sfNo').textContent=SF.no;$('sfName').textContent=SF.name;$('sfSub').textContent=SF.sub;
  const tot=S.stars.reduce((a,b)=>a+(b||0),0);$('totStars').textContent=`★ ${tot} / ${LEVELS.length*3}`;
  $('sfPrev').disabled=mapSef===0;$('sfNext').disabled=mapSef===3||S.open<=(mapSef+1)*5;
  // dekor
  let svg='';
  const sea=mapSef===2;
  for(let k=0;k<14;k++){const x=(hash(k,mapSef*7+1)*92+4).toFixed(1),y=(hash(k,mapSef*7+2)*80+10).toFixed(1);
    svg+=sea?`<path d="M${x-3} ${y} q1.5 -1.4 3 0 t3 0" stroke="#4a6e86" stroke-width=".35" fill="none" opacity=".6"/>`:`<path d="M${x-2.4} ${+y+1.6} L${x} ${y-1.8} L${+x+2.4} ${+y+1.6}" fill="#8a6a3c" opacity=".35"/>`;}
  if(!sea)svg+=`<path d="M0 ${80-mapSef*6} C 25 70, 40 92, 60 78 S 90 70, 100 ${86-mapSef*3}" stroke="#4a7a96" stroke-width="1.2" fill="none" opacity=".5"/>`;
  const P=NODEPOS;
  svg+=`<path d="M${P[0][0]} ${P[0][1]} `+P.slice(1).map((p,k)=>`Q ${(P[k][0]+p[0])/2} ${(k%2?Math.max(P[k][1],p[1])+12:Math.min(P[k][1],p[1])-10)} ${p[0]} ${p[1]}`).join(' ')+`" stroke="#9e1b1b" stroke-width=".7" stroke-dasharray="1.6 1.4" fill="none" opacity=".75" vector-effect="non-scaling-stroke" style="stroke-width:3px"/>`;
  svg+=`<g transform="translate(92 14)" opacity=".55"><circle r="5" fill="none" stroke="#5a3a10" stroke-width=".4"/><path d="M0 -6 L1 0 L0 6 L-1 0Z M-6 0 L0 1 L6 0 L0 -1Z" fill="#5a3a10"/></g>`;
  $('mapSvg').innerHTML=svg;
  const nodes=$('nodes');nodes.innerHTML='';
  for(let k=0;k<5;k++){
    const i=mapSef*5+k,L=LEVELS[i],st=S.stars[i]||0,locked=i>=S.open,next=!locked&&!st;
    const b=document.createElement('button');
    b.className='node'+(locked?' locked':'')+(next?' next':'');
    b.style.left=P[k][0]+'%';b.style.top=P[k][1]+'%';

// ================= GİRDİ =================
const lX=e=>ROT?e.clientY:e.clientX,lY=e=>ROT?innerWidth-e.clientX:e.clientY;
function toWorld(e){return{x:lX(e)*DPR/scale+camX,y:lY(e)*DPR/scale+camY};}
cv.addEventListener('pointerdown',e=>{
  if(state==='menu'||state==='map'||paused)return;
  initAudio();try{cv.setPointerCapture(e.pointerId);}catch(_){}
  const w=toWorld(e);
  if(state==='aim'&&active&&Math.hypot(w.x-active.x,w.y-(active.y-14*US))<AIM_LEN+140){aiming=true;dragPt=w;aimFrom(w);}
  else{panning=true;lastPanX=lX(e);}
});
cv.addEventListener('pointermove',e=>{
  if(aiming&&state==='aim'){const w=toWorld(e);dragPt=w;aimFrom(w);}
  else if(panning){camX=clampCam(camX-(lX(e)-lastPanX)*DPR/scale);lastPanX=lX(e);manualCam=true;}
});
function endPointer(){aiming=false;dragPt=null;panning=false;}
cv.addEventListener('pointerup',endPointer);cv.addEventListener('pointercancel',endPointer);
function aimFrom(w){
  const dx=w.x-active.x,dy=w.y-(active.y-14*US);
  active.aim=clamp(Math.atan2(-dy,dx)*180/Math.PI,-5,85);
  aimPow=clamp((Math.hypot(dx,dy)-40)/(AIM_LEN-40),0.05,1);manualCam=false;updateAimHUD();
  if(hintOn&&LV.n===1)setHint('Güzel! Şimdi <b>ATEŞ!</b> düğmesine bas.<br>Oku uzatırsan güç artar.');
}
cv.addEventListener('wheel',e=>{e.preventDefault();if(state==='menu'||state==='map')return;camX=clampCam(camX+(e.deltaX+e.deltaY)/scale);manualCam=true;},{passive:false});
addEventListener('keydown',e=>{
  keys[e.key]=true;
  if(e.key===' '){e.preventDefault();initAudio();playerFire();}
  if(e.key==='Escape'||e.key==='p'||e.key==='P')setPause(!paused);
  if(state==='aim'){const m={'1':'gulle','2':'sacma','3':'humbara','4':'balyemez'}[e.key];if(m&&ammo[m]>0){weapon=m;updateHUD();}}
  if(e.key.startsWith('Arrow'))e.preventDefault();
});
addEventListener('keyup',e=>{keys[e.key]=false;});
addEventListener('blur',()=>{for(const k in keys)keys[k]=false;hold.ang=hold.pow=0;});
document.querySelectorAll('.wbtn').forEach(b=>b.onclick=()=>{if(state==='aim'&&ammo[b.dataset.w]>0){weapon=b.dataset.w;sndClick();updateHUD();}});
document.querySelectorAll('.sbtn').forEach(b=>{
  const on=e=>{e.preventDefault();hold[b.dataset.k]=+b.dataset.d;};const off=()=>{hold[b.dataset.k]=0;};
  b.addEventListener('pointerdown',on);b.addEventListener('pointerup',off);b.addEventListener('pointerleave',off);b.addEventListener('pointercancel',off);
});
$('fireBtn').onclick=()=>{initAudio();playerFire();};
$('pauseBtn').onclick=()=>{sndClick();setPause(!paused);};

// ================= BAŞLANGIÇ =================
if(MAC){resize();startLevel(MAC.lv);}else{setup(Math.min(S.open-1,LEVELS.length-1));goMenu();}
let last=performance.now();
function loop(now){const dt=Math.min(0.033,(now-last)/1000);last=now;update(dt);draw();requestAnimationFrame(loop);}
requestAnimationFrame(loop);
</script>
</body>
