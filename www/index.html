function toolHtml(inMatch){
  const dd=(k,cls='')=>{const m=MENUS[k];return `<div class="dd ${k==='me'?'r':''}"><button class="tb ${cls}" data-act="menu" data-v="${k}" ${inMatch||!G?'disabled':''}>${m[0]} ▾</button>${UI.menu===k?`<div class="ddm">${m[1].filter(i=>!(i[0]==='yayin'&&NATIVE)).map(i=>i[0]==='yayin'&&AUTO?['exitAuto','','⏹ Yayından çık']:i).map(i=>`<button data-act="${i[0]}" data-v="${i[1]}">${i[2]}</button>`).join('')}</div>`:''}</div>`};
  return `<div class="tool"><button class="tb" data-act="back" ${UI.hist.length&&!inMatch&&G?'':'disabled'}>◀ Geri</button><button class="tb" data-act="fwd" ${UI.fwdS.length&&!inMatch&&G?'':'disabled'}>İleri ▶</button><button class="tb" data-act="nav" data-v="home" ${inMatch||!G?'disabled':''} aria-label="Ana sayfa">🏠</button>
   ${dd('kulup')}${dd('lig')}${dd('mac')}${dd('haber')}<button class="tb" data-act="sound" aria-label="Ses aç/kapat">${SES.vol()?'🔊':'🔇'}</button><button class="tb" data-act="help">?</button>
   <label class="search">🔍<input id="q" type="text" placeholder="Kulüp ara" value="${esc(UI.q||'')}" ${inMatch||!G?'disabled':''}></label>${dd('me','or')}</div>`;
}
function heroHtml(inMatch){
  const unread=G?G.inbox.filter(x=>!x.read).length:0;
  const tabs=G?[['home','🏠 Genel Bakış'],['inbox','📰 Haberler',unread],['squad','👕 Kadro'],['tech','🧑‍💼 Teknik Ekip'],['fix','📅 Fikstür'],['table','🏆 Puan Durumu'],['stats','👑 İstatistik'],['board','🏛️ Yönetim'],['clubs','🛡️ Kulüpler']]:[['new','👔 Yeni Kariyer']];
  const cur=UI.screen==='post'?'home':UI.screen==='club'?'clubs':inMatch?'match':UI.screen;
  const tabHtml=inMatch?`<button class="on">⚽ Maç Günü</button>`+tabs.map(t=>`<button>${t[1]}</button>`).join(''):tabs.map(t=>`<button class="${cur===t[0]||!G?'on':''}" data-act="nav" data-v="${t[0]}">${t[1]}${t[2]?` <span class="pill">${t[2]}</span>`:''}</button>`).join('');
  const sub=G?`${G.week<=NW()?'Menajer Merkezi · '+dLong(wDate(G.week)):'Menajer Merkezi · Sezon sonu'}`:'Menajer Merkezi · '+dLong(new Date());
  return `<div class="hero">${MASCOT}<div class="ttl"><h1>Champion <em>Battle</em></h1><span class="sub">${sub}</span></div>
   <div class="hero-r"><div class="music"><span class="nt">♫</span><span class="eq"><b></b><b></b><b></b><b></b></span><span class="sig">${IMZA.html()}</span></div><span class="live"><i></i>CANLI</span><b class="bigclk">${hhmm()}</b></div>
   <nav class="tabs">${tabHtml}</nav></div>`;
}
function subHtml(inMatch){
  let pills='';
  const meta=G?`${G.teamId?esc(me().name)+' · ':''}${seasonLabel()} · <b>${Math.min(G.week,NW())}. hafta</b> / ${NW()}`:'Kayıt bu tarayıcıda tutulur';
  if(!G)pills=`<span class="sp on">Kulüp seçimi</span>`;
  else if(inMatch){const md=M&&M.mode?({mlz:'🏹 Malazgirt',hsr:'🏰 Hisar',top:'💣 Topçular',kfa:'⚽ Kafa Topu',rtl:'🕹️ Kaptan Mecit',quick:'⚽ Hızlı Maç'}[M.mode]||'Mod seçimi'):'Mod seçimi';pills=`<span class="sp on">${md}</span><span class="sp">Odak ${M?M.focus:'—'}</span>`}
  else if(UI.screen==='inbox')pills=[['all','Gelen Kutusu'],['yon','Yönetim'],['asi','Asistan'],['bas','Basın'],['mac','Maç Merkezi']].map(x=>`<button class="sp ${(UI.inTab||'all')===x[0]?'on':''}" data-act="navI" data-v="${x[0]}">${x[1]}</button>`).join('');
  else if(UI.screen==='table')pills=[['lig','🏆 Lig tablosu'],['tek','📊 Tek tablo'],['derbi','⚔️ Derbiler'],['res','📋 Haftanın sonuçları']].map(x=>`<button class="sp ${UI.tableTab===x[0]?'on':''}" data-act="navT" data-v="${x[0]}">${x[1]}</button>`).join('');
  else if(UI.screen==='squad'){const nx=nextMatchOf(G.teamId),op=nx&&team(nx.m.h===G.teamId?nx.m.a:nx.m.h),cur=UI.sqTeam||G.teamId;pills=`<button class="sp ${cur===G.teamId?'on':''}" data-act="sqTeam" data-v="${G.teamId}">👕 Kadrom</button>`+(op?`<button class="sp ${cur===op.id?'on':''}" data-act="sqTeam" data-v="${op.id}">🔍 Rakip: ${esc(op.name)}</button>`:'')+(cur!==G.teamId&&(!op||cur!==op.id)?`<span class="sp on">${esc(team(cur).name)}</span>`:'')+`<button class="sp" data-act="nav" data-v="clubs">🛡️ Başka kulüp</button>`}
  else pills=[['inbox','Gelen Kutusu'],['fix','📅 Fikstür'],['table','🏆 Puan Durumu'],['board','🏛️ Vizyon']].map(x=>`<button class="sp ${UI.screen===x[0]?'on':''}" data-act="nav" data-v="${x[0]}">${x[1]}</button>`).join('');
  return `<div class="subbar">${pills}<span class="meta">${meta}</span></div>`;
}
function tickerHtml(){
  let items='',next='';
  if(!G){items=TEAMS0.map(t=>`<span class="ti">${tchip({c1:t[3],c2:t[4],name:t[1]})} <span class="ms">Güç ${t[5]*2}</span></span>`).join('')}
  else{
    const lw=Math.min(G.phase==='pre'?G.week-1:G.week,NW());
    const src=lw>=1?weekMatches(lw):weekMatches(Math.min(G.week,NW()));
    items=src.map(x=>`<span class="ti"><span class="ms">${x.hs!==null?'MS':'Hf '+(lw>=1?lw:G.week)}</span>${esc(team(x.h).name)} <span class="scr" style="font-size:18px;min-width:44px">${x.hs!==null?x.hs+'-'+x.as:'-'}</span> ${esc(team(x.a).name)}</span>`).join('');
    const um=G.week<=NW()&&G.phase==='pre'?userMatch(G.week):(G.week<NW()&&G.phase==='post'?userMatch(G.week+1):null);
    if(um)next=`<span class="tnext">Sıradaki <span>${esc(team(um.h).short)} – ${esc(team(um.a).short)}</span></span>`;
  }
  if(G&&G.flash&&G.flash.length&&G.phase==='post')items=G.flash.map(f=>`<span class="ti"><span class="ms" style="background:var(--red-bg);color:#fff">FLAŞ</span>${esc(f.t)}</span>`).join('')+items;
  return `<div class="ticker"><span class="tlab"><i></i>${G?'CANLI SKORLAR':'SÜPER LİG'}</span><div class="tmq"><div class="tmv">${items}${items}</div></div>${next}</div>`;
}

/* ===================== RENDER ===================== */
let FRESH=true,LASTSC='';
function render(){
  const app=$('#app');
  const sc=UI.screen+'|'+UI.tableTab+'|'+UI.sqTeam;FRESH=sc!==LASTSC;LASTSC=sc;
  if(KATMAN){app.innerHTML=katmanHtml();const mv=app.querySelector('.tmv');if(mv)mv.style.animationDuration=Math.max(20,mv.scrollWidth/2/75)+'s';return}
  const inMatch=!!G&&(UI.screen==='match'||UI.screen==='modes');
  let body;
  if(!G)body=scrNew();
  else switch(UI.screen){
    case'inbox':body=scrInbox();break;case'fix':body=scrFixtures();break;case'table':body=scrTable();break;
    case'board':body=scrBoard();break;case'clubs':body=scrClubs();break;case'club':body=scrClub();break;case'squad':body=scrSquad();break;case'tech':body=scrTech();break;case'stats':body=scrStats();break;case'post':body=scrPost();break;
    case'end':body=scrEnd();break;case'sacked':body=scrSacked();break;case'modes':body=scrModes();break;
    case'match':body=scrQuick();break;
    default:body=scrHome();
  }
  app.innerHTML=`<div class="frame${inMatch?' in-match':''}${NATIVE?' native':''}${AUTO?' auto':''}">${stripeHtml(inMatch)}${toolHtml(inMatch)}${heroHtml(inMatch)}${subHtml(inMatch)}<main class="content">${body}</main>${tickerHtml()}</div>`;
  if(PANO_ON&&G){const tl=app.querySelector('.tool');if(tl)tl.replaceWith(PANO.node())}
  if(G&&UI.screen==='inbox')save();
  const mv=app.querySelector('.tmv');if(mv){const w=mv.scrollWidth/2;mv.style.animationDuration=Math.max(20,w/75)+'s'}
}
function openModal(html){if(KATMAN)return;const o=$('#ov');o.innerHTML=`<div class="modal" role="dialog" aria-modal="true">${html}</div>`;o.hidden=false}
function closeModal(){const o=$('#ov');o.hidden=true;o.innerHTML=''}
function helpModal(){
  openModal(`<div class="cap">❓ Nasıl oynanır</div><div class="bd">
   <div class="kv"><div><span>1. Devam</span><b>Sağ üstteki Devam ile haftayı ilerletin</b></div><div><span>2. Konuşma</span><b>Maç önü tonunuz odağı belirler</b></div><div><span>3. Mod</span><b>Malazgirt, Hisar, Topçular ya da Kafa Topu</b></div><div><span>4. Basın</span><b>Cevaplarınız moral ve güveni oynatır</b></div></div>
   <p style="margin:0"><b>Lig:</b> Yeni kariyerde Türkiye ya da beş büyük Avrupa liginden birini seçin; Avrupa kulüpleri kurmaca adlarla (ör. Manchester Mavi, Madrid Beyaz) yer alır.</p>
   <p style="margin:0"><b>Malazgirt modu:</b> Parmağınızı kaydırın. Artı ve çarpı kapılarından geçip ordunuzu büyütün, blokları okla kırın, sondaki rakip birliği ya da devi dağıtın.</p>
   <p style="margin:0"><b>Hisar modu:</b> Telefonu yan çevirin. Erzakla alttaki birlik kartlarına dokunun, ◀ ▶ ile Alp Er'i yürütün, ocak dolunca Ateş Yağmuru'nu kullanın. Rakip kuleyi yıkın.</p>
   <p style="margin:0"><b>Topçular modu:</b> Telefonu yan çevirin. Topunuzun önüne dokunup hedefe sürükleyin, ATEŞ! ile atın. Rüzgârı hesaba katın, kaledeki bütün savunucuları susturun.</p>
   <p style="margin:0"><b>Kafa Topu modu:</b> Telefonu yan çevirin. ◀ ▶ ile koşun, ZIPLA ve VUR ile topa vurun, bar dolunca SÜPER şutu kullanın. 60 saniyede kaç gol attıysanız skor odur.</p>
   <p style="margin:0"><b>Skor:</b> Zafer ★★★ 3-0, ★★ 2-1, ★ 1-0. Yenilgide sona %80'den fazla yaklaştıysanız 1-1, %50–80 arası 1-2, daha azı 0-3.</p>
   <div class="row" style="justify-content:flex-end"><button class="btn pri" data-act="close">Tamam</button></div></div>`);
}

/* ===================== OLAYLAR ===================== */
function goScreen(s){if(UI.screen!==s){UI.hist.push(UI.screen);if(UI.hist.length>30)UI.hist.shift();UI.fwdS=[]}UI.screen=s}
const ACT={
  nav:v=>{if(!G)return;if(G.sacked&&v!=='board'){UI.screen='sacked'}else goScreen(v);render()},
  navT:v=>{UI.tableTab=v;goScreen('table');render()},
  navI:v=>{UI.inTab=v;goScreen('inbox');render()},
  back:()=>{if(!UI.hist.length)return;UI.fwdS.push(UI.screen);UI.screen=UI.hist.pop();render()},
  fwd:()=>{if(!UI.fwdS.length)return;UI.hist.push(UI.screen);UI.screen=UI.fwdS.pop();render()},
  fx:v=>{UI.fx=+v;render()},
  club:v=>{UI.club=v;goScreen('club');render()},
  sqTeam:v=>{UI.sqTeam=v;goScreen('squad');render()},
  sound:()=>{SES.setVol(SES.vol()?0:.7);if(SES.vol())SES.zil();render()},
  yayin:()=>startAuto(),
  exitAuto:()=>{try{history.replaceState(null,'',location.pathname+location.search.replace(/[?&]yayin=1/,''))}catch(e){}location.reload()},
  gizlilik:()=>{location.href='gizlilik.html'},
  kurgu:v=>{UI.newName=($('#mgr')||{}).value||UI.newName;UI.newKurgu=v==='1';render()},
  menu:v=>{UI.menu=UI.menu===v?null:v;render()},
  help:()=>helpModal(),
  go:()=>advance(),
  openMail:v=>{UI.mail=+v;goScreen('inbox');render()},
  tab:v=>{UI.tableTab=v;render()},
  talk:v=>doTalk(v),
  toModes:()=>{closeModal();UI.screen='modes';render()},
  play:v=>{MOTOR[v]?startEngine(v):startQuick()},
  resign:()=>openModal(`<div class="cap">Maçı bırak</div><div class="bd"><p style="margin:0">Maç 0-3 mağlubiyet olarak kaydedilecek. Emin misiniz?</p><div class="row" style="justify-content:flex-end"><button class="btn" data-act="close">Vazgeç</button><button class="btn warn" data-act="resignYes">Evet, bırak</button></div></div>`),
  resignYes:()=>{closeModal();const{isH}=matchCtx();const l=3;M.over=true;M.running=false;finishUserMatch(isH?0:l,isH?l:0,M.mode,'Maç bırakıldı.')},
  qStart:()=>{M.running=true;SES.duduk(1);render();setTimeout(quickTick,M.speed)},
  qShout:v=>{M.shout=v||null;M.running=true;M.feed.unshift({m:46,t:v==='att'?'İkinci yarı başladı. Takım öne çıkıyor!':v==='def'?'İkinci yarı başladı. Takım geri çekildi, kontra arıyor.':'İkinci yarı başladı.'});render();setTimeout(quickTick,M.speed)},
  qFast:()=>{M.speed=0},
  press:()=>pressConf(),pressAns:v=>pressAns(+v),close:()=>{closeModal();render()},
  askNew:()=>openModal(`<div class="cap">Yeni kariyer</div><div class="bd"><p style="margin:0">Mevcut kariyeriniz silinecek. Devam edilsin mi?</p><div class="row" style="justify-content:flex-end"><button class="btn" data-act="close">Vazgeç</button><button class="btn warn" data-act="newCareer">Sil ve yeniden başla</button></div></div>`),
  newCareer:()=>{closeModal();wipeSave();UI.newLg=LGC;G=null;M=null;UI.screen='home';UI.newTeam=null;UI.hist=[];UI.fwdS=[];render()},
  loadCareer:()=>{G=loadSave();setLeague(G.lg||'tr');ensureSquads();UI.screen=G.phase==='post'?'post':G.phase==='end'?'end':'home';render()},
  lg:v=>{UI.newName=($('#mgr')||{}).value||UI.newName;UI.newLg=v;UI.newTeam=null;setLeague(v);render()},
  pickTeam:v=>{UI.newName=($('#mgr')||{}).value||UI.newName;UI.newTeam=v;render()},
  phil:v=>{UI.newName=($('#mgr')||{}).value||UI.newName;UI.newPhil=v;render()},
  start:()=>{if(!UI.newTeam)return;const n=(($('#mgr')||{}).value||UI.newName||'').trim()||'Teknik Direktör';newCareer(n,UI.newTeam,UI.newPhil,UI.newKurgu,UI.newLg||'tr');UI.hist=[];render()},
};
UI.hist=[];UI.fwdS=[];
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');
  if(UI.menu&&(!el||el.dataset.act!=='menu')){UI.menu=null;if(!el){render();return}}
  if(!el||el.disabled)return;
  if(AUTO&&!['sound','exitAuto','menu','help','close','gizlilik'].includes(el.dataset.act))return;
  const f=ACT[el.dataset.act];if(f)f(el.dataset.v);
});
document.addEventListener('keydown',e=>{
  if(AUTO){if(e.key==='ArrowRight'&&Y.skip)Y.skip();if(e.key==='g'&&G){const t=me();Y.goal={t,sp:squadOf(t.id)[20],min:90};SES.gol();paintOverlay();setTimeout(()=>{Y.goal=null;paintOverlay()},4000)}if(e.key==='d')SES.duduk(3);if(e.key==='f'){Y.flash={k:'surpriz',t:'⚡ SÜRPRİZ · prova flaşı'};SES.flas();paintOverlay();setTimeout(()=>{Y.flash=null;paintOverlay()},7000)}}
  if(e.key==='Enter'&&e.target.matches('[role=button]'))e.target.click();
  if(e.key==='Enter'&&e.target.id==='q'&&G){UI.q=e.target.value.trim();goScreen('clubs');render()}
  if(e.key==='Escape'&&UI.menu){UI.menu=null;render()}
});
document.addEventListener('input',e=>{if(e.target.id==='mgr')UI.newName=e.target.value});
if(KATMAN)document.documentElement.classList.add(KATMAN==='dikey'?'kat-dikey':'kat-seffaf');
if(AUTO)autoLoop();else render();
</script>
