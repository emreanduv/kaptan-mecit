<!doctype html>
<html lang="tr">
<head><script src="ses-kurtarici.js"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1f3b3c">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="manifest" href="manifest.webmanifest">
<title>Champion Battle Manager</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Nunito:wght@600;700;800;900&family=Pacifico&display=swap">
<style>
/* Layout: "Akış" çizgisi — krem tarih şeridi + Devam bloğu, koyu yeşil araç çubuğu, maskotlu başlık ve sekmeler, krem içerik, altta kayan skor bandı */
:root{
  color-scheme:light;
  --outer:#16302f; --teal:#1f3b3c; --teal-2:#183233; --teal-3:#2a4a4a;
  --cream:#f6efe1; --cream-2:#efe6d3; --paper:#fbf7ee; --beige:#e7dbc3; --line:#dccfb5;
  --ink:#1d2b38; --ink-dim:#6d6a62; --ink-faint:#9a9384;
  --green:#3e9a4c; --green-l:#86d36e; --green-bg:#2f7d3d; --mint:#dcefe5;
  --orange:#ee7b30; --red:#d33a2e; --red-bg:#a7342b; --navy:#2a4f8a; --gold:#e9b949; --yellow:#f3d35a;
  --wood-a:#7b4a2a; --wood-b:#d8b98a; --felt:#2a4e3c; --felt-edge:#4a2c18;
  --sq-l:#f1e7d3; --sq-d:#6f9a80;
  --f-ui:'Nunito','Trebuchet MS','Segoe UI',sans-serif;
  --f-num:'Barlow Condensed','Arial Narrow',sans-serif;
  --f-sig:'Pacifico','Brush Script MT',cursive;
}
[hidden]{display:none!important}
#arena{position:fixed;inset:0;z-index:95;background:#0c1c34}#arena iframe{position:absolute;inset:0;width:100%;height:100%;border:0;display:block}html.arena-on,html.arena-on body{overflow:hidden}
.lgseg{flex-wrap:wrap}
html,body{height:100%}
body{background:radial-gradient(1200px 600px at 10% 0%,#1d3b3a,var(--outer));color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.4;padding-inline:16px;padding-block:0}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--orange);outline-offset:2px}
.frame{max-width:1720px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;background:var(--cream);box-shadow:0 0 60px #0008}

/* ÜST ŞERİT */
.stripe{display:flex;align-items:stretch;background:var(--cream-2);border-bottom:1px solid var(--line);min-height:62px}
.stripe .cell{display:flex;flex-direction:column;justify-content:center;gap:2px;padding:6px 16px;border-right:1px solid var(--line);min-width:0;flex:1}
.stripe .cell small{font-size:12px;color:var(--ink-dim);font-weight:700;white-space:nowrap}
.stripe .cell .ln{display:flex;align-items:center;gap:6px;white-space:nowrap}
.stripe .now{flex:0 0 auto;flex-direction:row;align-items:center;gap:12px;background:linear-gradient(180deg,#f3e7cf,#eadbbd)}
.stripe .now .d{font-size:22px;font-weight:800;display:flex;align-items:center;gap:8px;white-space:nowrap}
.stat{font-size:12px;font-weight:900;letter-spacing:.03em;padding:4px 10px;border-radius:12px;color:#fff;background:var(--ink-faint);white-space:nowrap;text-transform:uppercase}
.stat.go{background:var(--orange)} .stat.ok{background:var(--green)} .stat.bad{background:var(--red)}
.clk{font-size:22px;font-weight:900;font-variant-numeric:tabular-nums}
.stripe .p{font-family:var(--f-num);font-size:22px;font-weight:700}
.stripe .dots{flex:0 0 auto;flex-direction:row;align-items:center;gap:10px;color:var(--ink-dim)}
.devam{flex:0 0 330px;position:relative;display:flex;align-items:center;justify-content:center;gap:12px;border:0;background:linear-gradient(180deg,#f8f1e3,#eee2c9);font-size:32px;font-weight:900;color:var(--ink);cursor:pointer;border-left:1px solid var(--line);clip-path:polygon(4% 0,100% 0,100% 100%,0 100%)}
.devam .ar{color:var(--green);font-size:34px}
.devam .pr{position:absolute;left:4%;bottom:0;height:4px;background:var(--orange)}
.devam:hover{filter:brightness(1.04)} .devam:disabled{color:var(--ink-faint);cursor:not-allowed}.devam:disabled .ar{color:var(--ink-faint)}

/* ARAÇ ÇUBUĞU */
.tool{display:flex;align-items:center;gap:8px;background:var(--teal);padding:8px 16px;flex-wrap:wrap;position:relative;z-index:30}
.tb{background:linear-gradient(180deg,#fffaf0,#eee2cb);border:1px solid #c9b894;border-radius:7px;padding:6px 14px;font-weight:800;font-size:17px;color:var(--ink);cursor:pointer;box-shadow:0 2px 0 #0004;white-space:nowrap}
.tb:hover{filter:brightness(1.05)} .tb:disabled{background:#8d9690;border-color:#7a837d;color:#e9ecea;cursor:default;box-shadow:none}
.tb.or{background:linear-gradient(180deg,#f59a55,#e2702a);border-color:#c45e1f;color:#fff;font-style:italic}
.dd{position:relative}
.ddm{position:absolute;top:calc(100% + 6px);left:0;min-width:220px;background:var(--paper);border:1px solid var(--line);border-radius:8px;box-shadow:0 10px 30px #0006;padding:6px;display:flex;flex-direction:column;z-index:40}
.dd.r .ddm{left:auto;right:0}
.ddm button{text-align:left;background:none;border:0;padding:8px 10px;border-radius:6px;font-weight:700;cursor:pointer}
.ddm button:hover{background:var(--mint)}
.ddm .h{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-faint);padding:6px 10px 2px;font-weight:800}
.search{margin-left:auto;display:flex;align-items:center;gap:6px;background:#fff;border-radius:18px;padding:5px 14px;min-width:min(260px,100%);border:1px solid #c9b894}
.search input[type=text]{border:0;outline:0;padding:0;border-radius:0;font:inherit;font-size:17px;font-weight:700;width:100%;background:transparent;color:var(--ink)}

/* BAŞLIK */
.hero{background:linear-gradient(180deg,var(--teal),var(--teal-2));color:#fff;padding:12px 16px 0 30px;display:grid;grid-template-columns:auto minmax(0,1fr) auto;column-gap:22px;align-items:center}
.mascot{grid-row:span 2;width:124px;height:124px;align-self:start;margin-top:4px}
.hero .ttl{display:flex;align-items:baseline;gap:16px;flex-wrap:wrap;min-width:0}
.hero h1{margin:0;font-size:46px;font-weight:900;letter-spacing:-.01em;line-height:1.1}
.hero h1 em{font-style:normal;color:var(--green-l)}
.hero .sub{font-size:22px;font-weight:600;color:#e6eee9}
.hero-r{display:flex;align-items:center;gap:22px}
.music{display:flex;align-items:center;gap:12px;border:2px solid #d8b35a;border-radius:22px;padding:4px 16px;background:#0002}
.music .nt{color:var(--gold);font-size:24px}
.eq{display:flex;gap:3px;align-items:flex-end;height:22px}
.eq b{width:5px;background:var(--orange);border-radius:1px;animation:eq 1s infinite ease-in-out}
.eq b:nth-child(2){animation-delay:.2s;background:#f0a040}.eq b:nth-child(3){animation-delay:.4s;background:var(--gold)}.eq b:nth-child(4){animation-delay:.6s;background:var(--gold)}
@keyframes eq{0%,100%{height:30%}50%{height:100%}}
.music .sig{font-family:var(--f-sig);font-size:24px;color:#fff;border-left:1px solid #ffffff40;padding-left:12px}
.live{font-size:22px;font-weight:900;color:#f5a07a;letter-spacing:.06em;display:flex;align-items:center;gap:8px}
.live i{width:12px;height:12px;border-radius:50%;background:var(--red);box-shadow:0 0 8px var(--red)}
.bigclk{font-size:46px;font-weight:900;font-variant-numeric:tabular-nums}
.tabs{grid-column:2 / -1;display:flex;gap:6px;overflow-x:auto;margin-top:10px;scrollbar-width:none}
.tabs button{background:linear-gradient(180deg,#2f4f50,#284647);border:0;border-radius:8px 8px 0 0;padding:10px 22px;font-size:19px;font-weight:800;color:#e6ece9;cursor:pointer;white-space:nowrap;display:flex;align-items:center;gap:8px}
.tabs button:hover{background:#355758}
.tabs button.on{background:var(--cream);color:var(--ink)}
.tabs .pill{font-size:12px;background:var(--orange);color:#fff;border-radius:10px;padding:0 7px;font-weight:900}
.in-match .tabs button:not(.on){opacity:.45;pointer-events:none}

/* ALT SEKME */
.subbar{display:flex;align-items:center;gap:8px;padding:10px 20px;background:var(--cream);border-bottom:1px solid var(--line);flex-wrap:wrap}
.sp{background:#fffdf8;border:1px solid var(--line);border-radius:18px;padding:5px 16px;font-size:17px;font-weight:700;cursor:pointer;white-space:nowrap}
.sp:hover{border-color:var(--green)}
.sp.on{border:2px solid var(--green);color:var(--green-bg);padding:4px 15px;background:#f3faf3}
.subbar .meta{margin-left:auto;font-size:15px;font-weight:700;color:var(--ink-dim)}
.subbar .meta b{color:var(--red-bg)}

/* İÇERİK */
.content{flex:1;padding:16px 20px 24px;min-width:0}
.ph{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:2px 0 12px 10px}
.ph h2{margin:0;font-size:30px;font-weight:900;text-wrap:balance}
.ph h2 g{color:var(--green)} .ph h2 o{color:var(--orange)}
.ph .r{font-size:15px;font-weight:700;color:var(--ink-dim)}
.dim{color:var(--ink-dim)} .faint{color:var(--ink-faint)} .num{font-variant-numeric:tabular-nums}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,380px),1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr))}
.span2{grid-column:span 2}
@media (max-width:1100px){.span2{grid-column:auto}}
.pnl{background:var(--paper);border:1px solid var(--line);border-radius:10px;min-width:0;display:flex;flex-direction:column;overflow:hidden}
.cap{background:linear-gradient(180deg,#ece1cb,#e3d5b9);padding:8px 14px;font-weight:900;font-size:17px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.cap span{font-size:13px;font-weight:700;color:var(--ink-dim);text-align:right}
.bd{padding:12px 14px;display:flex;flex-direction:column;gap:10px}

/* TABLOLAR */
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th{font-size:14px;color:var(--ink-dim);font-weight:800;text-align:left;padding:7px 10px;white-space:nowrap;background:var(--beige)}
td{padding:6px 10px;border-bottom:1px solid #e9dfcb;white-space:nowrap;font-size:16px}
tbody tr:nth-child(even){background:#f7f0e2}
tr.me td{background:var(--mint)!important;font-weight:800}
tr.me td:first-child{box-shadow:inset 5px 0 var(--green)}
tr.click{cursor:pointer} tr.click:hover td{background:#eef6ef}
tr.unread td{font-weight:800}
td.r,th.r{text-align:right} td.c,th.c{text-align:center}
.lt td{font-size:17px;padding:7px 10px}
.lt .pos{font-size:19px;color:var(--ink-dim);font-weight:700;width:36px}
.lt .pts{font-family:var(--f-num);font-size:22px}
tr.z-champ td:first-child{box-shadow:inset 4px 0 var(--green)}
tr.z-cl td:first-child,tr.z-eu td:first-child{box-shadow:inset 4px 0 #6f9fc7}
tr.z-rel td:first-child{box-shadow:inset 4px 0 var(--red)}
.tchip{display:inline-block;font-weight:900;font-size:14px;padding:2px 8px;border-radius:4px;box-shadow:inset 0 -3px 0 color-mix(in srgb,var(--c2) 70%,transparent),0 1px 2px #0003;white-space:nowrap;line-height:1.35}
.tchip.lg{font-size:20px;padding:5px 12px;border-radius:6px}
.form{display:inline-flex;gap:3px}
.fm{width:20px;height:20px;display:inline-grid;place-items:center;font-size:12px;font-weight:900;border-radius:4px;color:#fff;font-style:normal}
.fm.G{background:var(--green)} .fm.B{background:#9aa09a} .fm.M{background:var(--red)}
.scr{display:inline-block;background:var(--yellow);color:#1b1b1b;font-family:var(--f-num);font-weight:700;font-size:20px;padding:0 10px;border-radius:4px;min-width:60px;text-align:center}
.tag{display:inline-block;font-size:13px;font-weight:800;font-style:italic;padding:2px 9px;border-radius:4px;color:#fff;white-space:nowrap}
.tag.yon{background:var(--navy)} .tag.asi{background:var(--green)} .tag.bas{background:var(--orange)} .tag.mac{background:var(--red)}
.rt{font-family:var(--f-num);font-weight:700;font-size:20px;display:inline-block;min-width:24px;text-align:center}
.r1{color:#9a9384} .r2{color:var(--ink)} .r3{color:var(--green)} .r4{color:var(--orange)}
.dark{background:var(--teal);border-radius:12px;padding:16px}
.dark .inner{background:#fffdf7;border-radius:10px;padding:14px}
.split{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,520px),1fr));gap:16px}
.sec{color:#fff;font-weight:900;font-size:19px;padding:8px 14px;border-radius:8px 8px 0 0}
.sec.up{background:var(--green-bg)} .sec.down{background:var(--red-bg)}
.legend{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.lg{font-size:13px;font-weight:700;padding:3px 10px;border-radius:12px;background:#fff;border:1px solid var(--line);display:flex;align-items:center;gap:6px}
.lg i{width:10px;height:10px;border-radius:2px}

/* BAR */
.meter{display:grid;grid-template-columns:130px minmax(0,1fr) auto;align-items:center;gap:10px;font-weight:700}
.meter .trk{height:10px;background:#e7dcc6;border-radius:6px;overflow:hidden}
.meter .trk i{display:block;height:100%;border-radius:6px}
.meter b{min-width:96px;text-align:right}
.kv{display:flex;flex-direction:column}
.kv>div{display:flex;justify-content:space-between;gap:10px;padding:5px 8px;font-size:16px;font-weight:700}
.kv>div:nth-child(odd){background:#f1e8d6}
.kv b{color:var(--green);text-align:right}

/* BUTON */
.btn{background:linear-gradient(180deg,#fffaf0,#eee2cb);border:1px solid #c9b894;border-radius:8px;padding:8px 16px;cursor:pointer;font-weight:800;color:var(--ink);box-shadow:0 2px 0 #c2b08a}
.btn:hover{filter:brightness(1.04)} .btn:disabled{opacity:.45;cursor:not-allowed;filter:none}
.btn.pri{background:linear-gradient(180deg,#4fb15c,#378a43);border-color:#2f7539;color:#fff;box-shadow:0 2px 0 #276331}
.btn.gold{background:linear-gradient(180deg,#f59a55,#e2702a);border-color:#c45e1f;color:#fff;box-shadow:0 2px 0 #a8501b}
.btn.warn{background:linear-gradient(180deg,#e05b4f,#bb3a2f);border-color:#9f2f26;color:#fff;box-shadow:0 2px 0 #852820}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-size:14px;font-weight:700;padding:3px 10px;border:1px solid var(--line);border-radius:14px;background:#fffdf8;color:var(--ink-dim)}
.chip b{color:var(--ink)}
.badge{width:34px;height:34px;flex:none;border-radius:8px;display:grid;place-items:center;font-weight:900;font-size:11px;border:2px solid #f6efe1;box-shadow:0 1px 3px #0005}
.badge.lg{width:64px;height:64px;font-size:17px;border-width:3px;border-radius:14px}

/* MAÇ KARTI */
.fixcard{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:10px;padding:16px 12px}
.fixcard .side{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;min-width:0}
.fixcard .vs{font-size:26px;font-weight:900;color:var(--ink-faint)}
.score{font-family:var(--f-num);font-size:56px;font-weight:700;line-height:1}

/* GELEN KUTUSU */
.article{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,400px);gap:24px;margin-top:16px;padding:0 10px}
.article h3{font-size:40px;font-weight:900;margin:0 0 8px;line-height:1.1;text-wrap:balance}
.article .body{font-size:19px;max-width:65ch;line-height:1.5}
.article .body p{margin:.5em 0}
.side-i{border-left:1px solid var(--line);padding-left:22px;display:flex;flex-direction:column;gap:10px}
.side-i h4{margin:0;font-size:28px;font-weight:900}
.banner{height:72px;border-radius:10px;display:grid;place-items:center;font-size:38px;background:linear-gradient(90deg,#3f63c9,#e8c25a 50%,#3f63c9);box-shadow:inset 0 -5px 0 #0002}
.side-i .word{font-size:26px;font-weight:900;color:var(--orange)}

/* MODAL */
.ov{position:fixed;inset:0;background:#0d1e1ecc;display:grid;place-items:center;padding:16px;z-index:60}
.modal{width:min(580px,100%);max-height:calc(100% - 32px);overflow:auto;background:var(--paper);border:1px solid var(--line);border-radius:12px;box-shadow:0 20px 60px #000a}
.opt{display:block;width:100%;text-align:left;background:#fffdf8;border:1px solid var(--line);border-radius:8px;padding:10px 14px;cursor:pointer}
.opt:hover{border-color:var(--green);background:#f3faf3}
.opt b{display:block;font-size:17px} .opt span{font-size:14px;color:var(--ink-dim)}

/* MOD SEÇİMİ */
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:14px}
.mode{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:18px;cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:6px;box-shadow:0 2px 0 #d8c9ab}
.mode:hover{border-color:var(--green);background:#f6fbf5}
.mode .ic{font-size:44px;line-height:1}
.mode b{font-size:24px;font-weight:900}
.mode span{font-size:15px;color:var(--ink-dim)}

/* MAÇ ŞERİDİ */
.strip{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:10px;background:linear-gradient(180deg,var(--teal-3),var(--teal));color:#fff;border-radius:10px;padding:10px 14px;margin-bottom:14px}
.strip .t{display:flex;align-items:center;gap:10px;min-width:0}
.strip .t.r{justify-content:flex-end;text-align:right}
.strip .t b{font-size:22px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.strip .t small{display:block;color:#cfdcd6;font-size:13px;font-weight:700}
.strip .sc{text-align:center;line-height:1}
.strip .sc .scr{font-size:30px;padding:2px 14px}
.strip .sc small{display:block;font-size:12px;color:#cfdcd6;font-weight:800;letter-spacing:.06em;margin-top:4px}
.msg{background:#fffdf8;border:1px solid var(--line);border-left:5px solid var(--green);border-radius:8px;padding:9px 12px;font-weight:800;min-height:42px}
.thinking{color:var(--orange)}

/* SATRANÇ */
.chesswrap{display:grid;grid-template-columns:minmax(0,580px) minmax(0,1fr);gap:16px;align-items:start}
.cb{width:100%;aspect-ratio:1;display:grid;grid-template-columns:repeat(8,minmax(0,1fr));grid-template-rows:repeat(8,minmax(0,1fr));border:8px solid var(--teal);border-radius:8px;box-shadow:0 6px 20px #0004;user-select:none;-webkit-user-select:none;overflow:hidden}
.sq{position:relative;display:grid;place-items:center;cursor:pointer;font-size:clamp(22px,7.6vw,54px);line-height:1}
.sq.l{background:var(--sq-l)} .sq.d{background:var(--sq-d)}
.sq.last::before{content:"";position:absolute;inset:0;background:#f3d35a77}
.sq.sel::before{content:"";position:absolute;inset:0;background:#ee7b3088}
.sq.hint::before{content:"";position:absolute;inset:0;background:#3e9a4c77}
.sq.chk::before{content:"";position:absolute;inset:0;background:radial-gradient(circle,#d33a2ecc,#d33a2e00 70%)}
.sq.tg::after{content:"";position:absolute;width:30%;height:30%;border-radius:50%;background:#1d2b3855}
.sq.tg.cap::after{width:86%;height:86%;background:none;border:4px solid #1d2b3855}
.pc{position:relative;z-index:1}
.pc.w{color:#fffdf6;text-shadow:0 0 1px #000,0 0 1px #000,0 1px 2px #000a,1px 0 0 #222,-1px 0 0 #222,0 -1px 0 #222}
.pc.b{color:#17202a;text-shadow:0 1px 0 #ffffff50}
.coord{position:absolute;font-size:11px;font-weight:900;opacity:.75;z-index:1}
.coord.f{right:3px;bottom:1px} .coord.rk{left:3px;top:1px}
.sq.l .coord{color:var(--sq-d)} .sq.d .coord{color:var(--sq-l)}
.moves{font-variant-numeric:tabular-nums;display:grid;grid-template-columns:36px 1fr 1fr;gap:3px 6px;max-height:260px;overflow:auto;font-size:16px;font-weight:700}
.moves .n{color:var(--ink-faint)}
.evalbar{height:12px;background:#1d2b38;position:relative;overflow:hidden;border-radius:6px}
.evalbar i{position:absolute;left:0;top:0;bottom:0;background:#f6efe1;transition:width .4s}

/* TAVLA */
.bgwrap{display:grid;grid-template-columns:minmax(0,780px) minmax(0,1fr);gap:16px;align-items:start}
.bgb{width:100%;aspect-ratio:14.2/10.6;display:grid;grid-template-columns:repeat(6,minmax(0,1fr)) minmax(0,1.05fr) repeat(6,minmax(0,1fr)) minmax(0,1.15fr);grid-template-rows:minmax(0,1fr) 9% minmax(0,1fr);overflow:hidden;background:var(--felt);border:10px solid var(--felt-edge);border-radius:8px;box-shadow:inset 0 0 30px #0008,0 6px 20px #0005;user-select:none;-webkit-user-select:none}
.pt{position:relative;display:flex;flex-direction:column;align-items:center;cursor:pointer;min-width:0;min-height:0;overflow:hidden}
.pt.bot{flex-direction:column-reverse}
.pt .tri{position:absolute;inset:0 6%;clip-path:polygon(0 0,100% 0,50% 92%)}
.pt.bot .tri{clip-path:polygon(50% 8%,0 100%,100% 100%)}
.pt.odd .tri{background:linear-gradient(180deg,var(--wood-a),color-mix(in srgb,var(--wood-a) 70%,#000))}
.pt.even .tri{background:linear-gradient(180deg,var(--wood-b),color-mix(in srgb,var(--wood-b) 80%,#000))}
.pt.bot.odd .tri{background:linear-gradient(0deg,var(--wood-a),color-mix(in srgb,var(--wood-a) 70%,#000))}
.pt.bot.even .tri{background:linear-gradient(0deg,var(--wood-b),color-mix(in srgb,var(--wood-b) 80%,#000))}
.pt .lbl{position:absolute;font-size:10px;font-weight:800;color:#ffffff80;z-index:2}
.pt.top .lbl{top:-1px} .pt.bot .lbl{bottom:-1px}
.stack{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;width:100%;padding-top:9%}
.pt.bot .stack{flex-direction:column-reverse;padding-top:0;padding-bottom:9%}
.ck{width:84%;aspect-ratio:1;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:900;flex:none}
.ck.w{background:radial-gradient(circle at 35% 30%,#fffdf6,#d9d2c1 70%);border:3px solid var(--wc,#c33);color:#222;box-shadow:0 2px 3px #0008}
.ck.k{background:radial-gradient(circle at 35% 30%,#4a4f57,#16191d 70%);border:3px solid var(--kc,#36c);color:#eee;box-shadow:0 2px 3px #0008}
.pt.src .tri{filter:brightness(1.25) saturate(1.2)}
.pt.src::after{content:"";position:absolute;left:28%;right:28%;height:4px;border-radius:2px;background:var(--yellow);z-index:3}
.pt.top.src::after{top:1px} .pt.bot.src::after{bottom:1px}
.pt.sel .tri{filter:brightness(1.45)}
.pt.sel .stack .ck:first-child{outline:3px solid var(--yellow);outline-offset:1px}
.pt.tgt::before{content:"";position:absolute;z-index:3;width:38%;aspect-ratio:1;border-radius:50%;background:#86d36edd;box-shadow:0 0 12px #86d36e;left:31%}
.pt.top.tgt::before{bottom:14%} .pt.bot.tgt::before{top:14%}
.pt.lastf .tri{box-shadow:inset 0 0 0 2px var(--orange)}
.pt.lastt .tri{filter:brightness(1.3) hue-rotate(-15deg)}
.barc{background:linear-gradient(90deg,#2a170c,#4a2a17,#2a170c);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;position:relative;min-width:0}
.barc .ck{width:78%}
.barc.src{box-shadow:inset 0 0 0 3px var(--yellow)}
.barc.sel{box-shadow:inset 0 0 0 3px var(--yellow),inset 0 0 18px var(--yellow)}
.barc .tg2,.tray .tg2{font-size:9px;font-weight:800;letter-spacing:.08em;color:#ffffff90;text-transform:uppercase}
.bgmid{grid-column:1 / -1;display:flex;align-items:center;justify-content:center;gap:10px;background:#0002}
.die{width:32px;height:32px;background:#fffdf6;color:#111;border-radius:6px;display:grid;place-items:center;font-weight:900;font-size:19px;box-shadow:0 2px 4px #000a}
.die.used{opacity:.3}
.die.ai{background:#22262b;color:#eee;border:1px solid #555}
.tray{background:linear-gradient(180deg,#2a170c,#3b2213);display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:6%;gap:1px;min-width:0;position:relative}
.tray.bot{justify-content:flex-end;padding-top:0;padding-bottom:6%;cursor:pointer}
.tray .slab{width:78%;height:4.2%;border-radius:2px}
.tray .slab.w{background:#e9e3d4;border:1px solid var(--wc)}
.tray .slab.k{background:#22262b;border:1px solid var(--kc)}
.tray.tgt{box-shadow:inset 0 0 0 3px var(--green-l),inset 0 0 18px var(--green-l)}
.log{font-size:15px;max-height:240px;overflow:auto;display:flex;flex-direction:column;gap:3px;font-weight:600}
.log div{padding:3px 8px;border-left:3px solid var(--line)}
.log .u{border-color:var(--orange)} .log .a{border-color:var(--navy)} .log .x{border-color:var(--red)}

/* HIZLI MAÇ */
.feed{display:flex;flex-direction:column;gap:4px;max-height:420px;overflow:auto}
.ev{display:grid;grid-template-columns:42px minmax(0,1fr);gap:8px;padding:6px 10px;border-left:4px solid transparent;font-size:16px;font-weight:600}
.ev .m{font-family:var(--f-num);font-weight:700;font-size:18px;color:var(--ink-dim)}
.ev.goal{border-color:var(--green);background:#e8f4e8;font-weight:800}
.ev.ht{border-color:var(--orange);background:#fbeedd}
.clock{height:8px;background:#e7dcc6;border-radius:4px;overflow:hidden}
.clock i{display:block;height:100%;background:var(--green);transition:width .2s linear}

/* YENİ OYUN */
.teams{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,210px),1fr));gap:8px}
.tcard{display:flex;justify-content:space-between;align-items:center;gap:8px;background:#fffdf8;border:1px solid var(--line);border-radius:8px;padding:8px 10px;cursor:pointer;text-align:left}
.tcard:hover{border-color:var(--green)}
.tcard.on{border:2px solid var(--green);padding:7px 9px;background:#f3faf3}
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:13px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-dim)}
input[type=text]{background:#fff;border:1px solid #c9b894;border-radius:8px;padding:9px 12px;color:var(--ink);font:inherit;font-size:17px;font-weight:700;width:100%}
.seg{display:flex;flex-wrap:wrap;gap:6px}

/* ALT BANT */
.ticker{display:flex;align-items:stretch;background:var(--teal);color:#fff;font-weight:800;font-size:19px;min-height:52px;border-top:4px solid var(--orange)}
.tlab{background:linear-gradient(90deg,#e8602c,#ee7b30);padding:0 20px;display:flex;align-items:center;gap:10px;white-space:nowrap;letter-spacing:.04em;clip-path:polygon(0 0,100% 0,94% 100%,0 100%);padding-right:34px}
.tlab i{width:10px;height:10px;border-radius:50%;background:#fff}
.tmq{flex:1;overflow:hidden;display:flex;align-items:center;min-width:0}
.tmv{display:flex;gap:34px;white-space:nowrap;animation:mq 60s linear infinite;padding-left:20px}
@keyframes mq{from{transform:translateX(0)}to{transform:translateX(-50%)}}
.ti{display:flex;align-items:center;gap:8px}
.ti .ms{font-size:13px;background:#3b5a5a;border-radius:4px;padding:1px 6px;color:#d6e4df}
.tnext{background:var(--teal-2);padding:0 18px;display:flex;align-items:center;gap:8px;white-space:nowrap;color:var(--yellow)}
.tnext span{color:#fff}


/* FM2010 ek ekranlar (10.10 · Futbol/Borsa/Fırsat Akışı ile aynı çizgi) */
.coach{display:flex;align-items:center;gap:14px;margin:14px 0 4px}
.coach .face{width:64px;height:64px;flex:none;filter:drop-shadow(0 3px 0 #1d2b3833)}
.coach .face svg{width:100%;height:100%}
.bubble{position:relative;background:#fff;border:3px solid var(--ink);border-radius:18px;padding:8px 18px;font-weight:800;font-size:18px;box-shadow:0 5px 0 var(--ink);max-width:70ch}
.bubble b{color:var(--green-bg)}
.bubble::after{content:'';position:absolute;left:-11px;top:50%;margin-top:-8px;width:16px;height:16px;background:#fff;border-left:3px solid var(--ink);border-bottom:3px solid var(--ink);transform:rotate(45deg)}
.kick{display:flex;align-items:center;gap:8px;font-weight:700;color:var(--ink-dim);margin-bottom:6px}
.kitsvg{display:inline-block;width:46px;height:42px;filter:drop-shadow(0 3px 3px #0005)}
.kitsvg.lg{width:64px;height:58px}
.kitsvg svg{width:100%;height:100%}
.ccard{border-left:1px solid var(--line);padding-left:22px;display:flex;flex-direction:column;gap:6px;min-width:0}
.cname{display:flex;align-items:baseline;gap:10px;font-size:28px;font-weight:900;white-space:nowrap;overflow:hidden}
.cname small{font-size:17px;color:var(--ink-dim)}
.cart{position:relative;height:66px;border-radius:14px;overflow:hidden;background:linear-gradient(120deg,var(--a) 0 62%,var(--b) 62% 70%,var(--a) 70%);box-shadow:inset 0 -6px 0 #0003}
.cart .tick{position:absolute;left:16px;top:10px;font:700 44px/1 var(--f-num);letter-spacing:1px;text-shadow:0 2px 4px #0005}
.cart .kitsvg{position:absolute;right:86px;top:4px;width:64px;height:58px}
.cart .secb{position:absolute;right:10px;top:10px;font-size:15px;font-weight:900;padding:3px 8px;border-radius:6px;background:#0000004d;color:#fff}
.cbig{display:flex;align-items:center;gap:12px}
.cbig strong{font:700 44px/1 var(--f-num)}
.ccard dl{display:grid;grid-template-columns:150px minmax(0,1fr);margin:0;font-size:17px}
.ccard dt,.ccard dd{margin:0;padding:4px 8px;background:#f1eadc;border-bottom:1px solid #fbf7ef;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ccard dt{font-weight:700;color:#4e6356}.ccard dd{text-align:right;color:var(--green-bg);font-weight:800}
.ccard dd small{color:var(--ink-dim)}
.ccard dt:nth-of-type(even),.ccard dd:nth-of-type(even){background:#e9e0cf}
.split .ccard{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:14px}
.tn .tn-r{display:grid;grid-template-columns:64px 200px minmax(0,1fr);align-items:center;gap:10px;min-height:42px;padding:4px 14px;border-top:1px solid #ede4d2;font-size:16px}
.tn-s{font-weight:900}.tn-s i{font-style:normal;margin-right:8px}
.tn-x{font-weight:700;color:#3d5157;white-space:normal}
.tn-r.k-adv .tn-s i{color:var(--green)}.tn-r.k-dis .tn-s i{color:var(--red)}.tn-r.k-man{background:#fff6d6}
.techwrap{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr);gap:14px}
.cmp .cr{display:grid;grid-template-columns:96px minmax(0,1fr) 96px;align-items:center;gap:10px;font-size:17px}
.cmp .cr b:last-child{text-align:right}
.cb2{position:relative;display:flex;height:26px;border-radius:6px;overflow:hidden;background:#e7dcc6}
.cb2 i{display:block;height:100%}
.cb2 .lbl{position:absolute;inset:0;display:grid;place-items:center;font-size:13px;font-weight:900;color:#fff;text-shadow:0 1px 2px #000a;letter-spacing:.04em}
.proc{display:flex;align-items:center;gap:14px;background:#fffdf8;border:1px solid var(--line);border-radius:10px;padding:8px 16px;margin-bottom:12px;font-weight:900;font-size:18px}
.proc i{flex:1;height:10px;border-radius:5px;background:#e7dcc6;overflow:hidden}
.proc i b{display:block;height:100%;width:100%;background:linear-gradient(90deg,var(--green),var(--navy));transform-origin:left;animation:procFill 1.6s ease-out both}
.proc em{font-style:normal;color:var(--ink-dim)}
@keyframes procFill{from{transform:scaleX(.05)}to{transform:scaleX(1)}}
.sqsub{font-size:17px;color:var(--ink-dim);font-weight:700;margin-left:6px}
table.sqt td{font-size:16px;padding:5px 9px}
table.sqt .no{font:700 20px/1 var(--f-num);color:#5d7266}
table.sqt .pos{font-size:13px;font-weight:900;padding:2px 8px;border-radius:5px;color:#fff;background:#8a9a90;white-space:nowrap}
tr.p-G .pos{background:#b8860b}tr.p-D .pos{background:#2b6cb0}tr.p-M .pos{background:#1d8a4a}tr.p-F .pos{background:#c3271c}
.st11{font-size:11px;font-weight:900;color:var(--green-bg);background:#e3f2e6;border-radius:4px;padding:1px 5px;vertical-align:2px}
b.big{font:700 24px/1 var(--f-num)}
table.kr tbody tr:first-child b.big{color:#e8601c}
.fxwrap{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(0,1fr);gap:14px;align-items:start}
.fxd dl{display:grid;grid-template-columns:100px minmax(0,1fr);margin:0;font-size:16px}
.fxd dt,.fxd dd{margin:0;padding:9px 14px;border-top:1px solid #ede4d2}.fxd dt{font-weight:800;color:var(--ink-dim)}.fxd dd{font-weight:800;color:var(--navy)}
.znote{font-size:11px;font-weight:800;color:var(--ink-dim);margin-left:4px}
tr.big td{font-weight:800}
.clubwrap{display:grid;grid-template-columns:minmax(0,470px) minmax(0,1fr);gap:16px;align-items:start}
.goalb{position:fixed;left:50%;top:42%;transform:translate(-50%,-50%);z-index:70;width:min(1100px,calc(100% - 32px));padding:20px 30px 24px;border-radius:24px;background:linear-gradient(120deg,var(--a) 0 70%,var(--b) 70% 74%,var(--a) 74%);box-shadow:0 0 0 6px #fff,0 0 0 10px #0b1e16,0 30px 80px #000c;text-align:center;pointer-events:none;animation:glIn .7s cubic-bezier(.3,1.6,.5,1) both}
.goalb b{display:block;font:900 clamp(56px,11vw,130px)/1 var(--f-ui);letter-spacing:.04em;text-shadow:0 6px 0 #0004}
.goalb span{display:block;font-size:clamp(20px,3vw,32px);font-weight:900}
.goalb em{display:block;font-style:normal;font-size:clamp(17px,2.4vw,26px);font-weight:800;opacity:.9}
@keyframes glIn{from{transform:translate(-50%,-50%) scale(.4);opacity:0}to{transform:translate(-50%,-50%) scale(1);opacity:1}}
.grid .tn .tn-r{grid-template-columns:56px minmax(0,1fr);gap:2px 10px;padding:6px 12px}.grid .tn .tn-x{grid-column:2;font-size:14px}
@media (max-width:900px){.techwrap,.fxwrap,.clubwrap{grid-template-columns:minmax(0,1fr)}.ccard{border-left:0;padding-left:0}.tn .tn-r{grid-template-columns:56px minmax(0,1fr)}.tn-x{grid-column:2}}


/* 11.10 · flaş bantları, yayın geri sayımı, katmanlar */
.flashes{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.flash,.yflash{color:#fff;font-weight:900;font-size:19px;padding:9px 16px;border-radius:8px;background:var(--red-bg);box-shadow:0 3px 0 #0003;animation:flIn .5s calc(var(--i,0)*.15s) both}
.f-zirve{background:var(--green-bg)}.f-derbi{background:var(--navy)}.f-surpriz{background:var(--orange)}.f-fark{background:var(--red-bg)}
@keyframes flIn{from{transform:translateX(-30px);opacity:0}to{transform:none;opacity:1}}
#yov .yflash{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);z-index:80;font-size:clamp(20px,3vw,38px);padding:14px 30px;border:4px solid #fff;animation:none;white-space:nowrap;max-width:calc(100% - 32px);overflow:hidden;text-overflow:ellipsis}
.bigcd{position:fixed;right:40px;top:120px;z-index:80;background:var(--teal);color:#fff;border:4px solid var(--orange);border-radius:18px;padding:10px 28px;font:700 90px/1 var(--f-num);text-align:center;box-shadow:0 10px 30px #0008}
.bigcd small{display:block;font:900 18px/1 var(--f-ui);color:var(--yellow);letter-spacing:.1em;margin-bottom:4px}
.proc.still i b{animation:none}
.native .music{display:none}
html.kat-seffaf,html.kat-seffaf body{background:transparent!important}
html.kat-seffaf body,html.kat-dikey body{padding:0}
.kat .ticker{position:fixed;left:0;right:0;bottom:0}
.ksk{position:fixed;left:30px;top:30px;width:580px;background:linear-gradient(180deg,var(--teal-3),var(--teal));color:#fff;border-radius:14px;padding:12px 16px;box-shadow:0 10px 30px #0008;border-bottom:5px solid var(--orange)}
.ksk-h{font-weight:900;font-size:18px;display:flex;justify-content:space-between;color:#d6e4df}
.kmin{color:#ff9a7a}
.ksk-r{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:8px 0}
.ksk-r .scr{font-size:34px}
.ksk-r .tchip{font-size:20px;padding:4px 10px}
.ksk-f{font-size:16px;font-weight:700;color:#e6ece9;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ksk-f b{color:var(--yellow)}
.vert{width:1080px;min-height:1920px;margin:0 auto;background:var(--cream);display:flex;flex-direction:column;gap:18px}
.vert .ksk{position:static;width:auto;margin:0 24px}
.vhero{display:flex;gap:20px;align-items:center;background:linear-gradient(180deg,var(--teal),var(--teal-2));color:#fff;padding:16px 24px}
.vhero .mascot{width:110px;height:110px;margin:0}
.vhero h1{margin:0;font-size:56px;font-weight:900}.vhero h1 em{font-style:normal;color:var(--green-l)}
.vhero span{font-size:22px;font-weight:700;color:#d6e4df}
.vert>.pnl{margin:0 24px}.vert .lt td{font-size:22px}
.vert .ticker{margin-top:auto}
.vert .stripe .cell.info,.vert .stripe .dots{display:none}
.vfeed .ev{font-size:20px}


/* 12.10 · platform imzası ve stadyum LED panosu (Birleşik yayın çizgisi) */
.music .sig-p{display:inline-block;font:900 .72em/1 var(--f-ui);color:var(--pc);letter-spacing:.3px;text-shadow:0 0 10px color-mix(in srgb,var(--pc) 55%,transparent),0 2px 0 #0007;vertical-align:.18em}
.music .sig-s{margin:0 .22em;color:#ffffff88;font:400 .8em/1 var(--f-ui);vertical-align:.12em}
.music .sig-p.sw{animation:sigIn .6s cubic-bezier(.3,1.5,.5,1) both}
@keyframes sigIn{from{transform:translateY(-12px) scale(.8);opacity:0}to{transform:none;opacity:1}}
.bk-pano{position:relative;height:62px;display:flex;align-items:stretch;gap:6px;padding:5px 8px;background:#05100e;box-shadow:inset 0 3px 0 #0b1e22,inset 0 -3px 0 #0b1e22;overflow:hidden}
.bk-pano:after{content:'';position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle,transparent 0 1.3px,#05100e33 1.6px) 0 0/4px 4px,linear-gradient(#ffffff10,transparent 45%,#0002)}
.bp-own{flex:0 0 190px;display:flex;align-items:center;gap:10px;padding:0 10px;border-radius:6px;background:linear-gradient(#173b40,#0b1e22);box-shadow:inset 0 0 0 2px var(--orange);color:#fff;font:900 16px/1.05 var(--f-ui);letter-spacing:1px}
.bp-face{width:44px;height:44px;flex:0 0 44px}.bp-face svg{width:100%;height:100%}
.bp-slot{flex:1 1 0;min-width:0;perspective:600px}
.bp-card{height:100%;transform-origin:50% 50% -26px}
.bp-card.flip{animation:bpFlip .7s cubic-bezier(.3,.9,.4,1) both}
@keyframes bpFlip{from{transform:rotateX(-90deg);filter:brightness(2)}to{transform:rotateX(0);filter:none}}
.bp-b{height:100%;display:flex;align-items:center;gap:12px;padding:0 14px;border-radius:6px;background:linear-gradient(90deg,var(--c) 0 6px,#0b1e22 6px);white-space:nowrap;overflow:hidden}
.bp-br{flex:0 0 auto;max-width:48%;overflow:hidden;text-overflow:ellipsis;padding:5px 10px;border-radius:5px;background:var(--c);color:#fff;font:900 19px/1 var(--f-ui);letter-spacing:.3px}
.bp-of{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;font:700 27px/1 var(--f-num);color:var(--gold);letter-spacing:.5px;text-shadow:0 0 10px #ffd23f99,0 0 2px #ffd23f}
.bp-b em{flex:0 0 auto;font:900 13px/1 var(--f-ui);font-style:normal;letter-spacing:1px;padding:5px 8px;border-radius:5px;color:#fff;animation:blink 1.2s infinite}
.bp-b em.new{background:#2fa45f}.bp-b em.hot{background:#e3262c}
@keyframes blink{50%{opacity:.35}}
.bp-note{flex:0 0 auto;display:flex;align-items:center;padding:0 8px;color:#9fb3b5;font:800 15px/1 var(--f-ui);white-space:nowrap}

@media (max-width:1180px){.stripe .cell.info:nth-of-type(n+4){display:none}.music{display:none}}
@media (max-width:900px){
  .chesswrap,.bgwrap,.article{grid-template-columns:minmax(0,1fr)}
  .side-i{border-left:0;padding-left:0}
  .stripe .cell.info,.stripe .dots{display:none}
  .devam{flex:1 1 auto;font-size:24px}
  .hero{grid-template-columns:auto minmax(0,1fr);padding-left:16px}
  .hero-r{display:none}
  .mascot{width:72px;height:72px;grid-row:auto}
  .hero h1{font-size:30px} .hero .sub{font-size:15px}
  .tabs{grid-column:1 / -1}
  .tabs button{font-size:15px;padding:8px 14px}
}
@media (max-width:600px){
  body{padding-inline:0}
  .stripe{flex-wrap:wrap}
  .stripe .now{flex:1 1 100%;justify-content:space-between}
  .devam{flex:1 1 100%;clip-path:none;border-left:0;border-top:1px solid var(--line);padding:8px}
  .search{margin-left:0;flex:1 1 100%}
  .tb{font-size:15px;padding:5px 10px}
  .content{padding:12px 16px 20px}
  .ph h2{font-size:22px}
  .article h3{font-size:28px}.article .body{font-size:17px}
  .meter{grid-template-columns:100px minmax(0,1fr) auto}
  .score{font-size:42px}

<div class="app" id="app"></div>

<script>
'use strict';
/* ===================== YARDIMCILAR ===================== */
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const rnd=(a,b)=>a+Math.random()*(b-a);
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
function poisson(l){let L=Math.exp(-l),k=0,p=1;do{k++;p*=Math.random()}while(p>L);return k-1}
function inkFor(hex){const n=parseInt(hex.slice(1),16),r=n>>16&255,g=n>>8&255,b=n&255;return (r*299+g*587+b*114)/1000>150?'#14171b':'#ffffff'}
const SAVE_KEY='ccm2010-save-v1';
const skey=()=>AUTO?'ccm-yayin-v1':SAVE_KEY;
function save(){try{localStorage.setItem(skey(),JSON.stringify(G))}catch(e){}}
function loadSave(){try{const s=localStorage.getItem(skey());return s?JSON.parse(s):null}catch(e){return null}}
function wipeSave(){try{localStorage.removeItem(skey())}catch(e){}}

/* ===================== VERİ ===================== */
const TR_TEAMS=[
 ['gs','Galatasaray','GS','#A90432','#FDB912',9],['fb','Fenerbahçe','FB','#0B2A6B','#FFE100',9],
 ['bjk','Beşiktaş','BJK','#141414','#F2F2F2',8],['ts','Trabzonspor','TS','#7A1F3D','#5BA8DF',8],
 ['ibfk','Başakşehir','İBFK','#E35205','#1B2A4A',7],['kon','Konyaspor','KON','#0B7A3B','#F2F2F2',7],
 ['aly','Alanyaspor','ALY','#F28C00','#0B8A3E',7],['svs','Sivasspor','SVS','#D71920','#F2F2F2',6],
 ['ant','Antalyaspor','ANT','#E30613','#F2F2F2',6],['ads','Adana Demirspor','ADS','#0057A8','#7CC4F0',6],
 ['ksp','Kasımpaşa','KSP','#1A2D6D','#F2F2F2',5],['gfk','Gaziantep FK','GFK','#C8102E','#141414',5],
 ['kay','Kayserispor','KAY','#FFD100','#C8102E',5],['sam','Samsunspor','SAM','#E30613','#F2F2F2',5],
 ['hty','Hatayspor','HTY','#8B1A2B','#F2F2F2',4],['riz','Rizespor','RİZ','#00843D','#2B6CB0',4],
 ['fkg','Fatih Karagümrük','FKG','#B01030','#141414',4],['pen','Pendikspor','PEN','#C8102E','#F2F2F2',4],
 ['goz','Göztepe','GÖZ','#FFD100','#C8102E',5],['eyp','Eyüpspor','EYP','#5B2C83','#FFD100',5]];
let TEAMS0=TR_TEAMS;
let MGRS=['Levent Aksoy','Murat Erdem','Selim Karaca','Tarık Uysal','Kerem Doğan','Orhan Baysal','Cengiz Arıkan','Volkan Sezer','Hüseyin Taşkın','Bülent Oral','Serdar Yücel','İlker Durmaz','Nihat Coşkun','Ferhat Ilgaz','Ramazan Kuzu','Erkan Gündüz','Okan Tekin','Yusuf Akın','Cem Aydemir','Hakan Yazıcı'];
let BIG4=['gs','fb','bjk','ts'];
const PHIL={hucum:{n:'Hücumcu',d:'Daha çok gol atarsın, daha çok yersin. Taraftar sever.',f:.28,a:.16},denge:{n:'Dengeli',d:'Riskleri ölçülü, sonuçları istikrarlı.',f:0,a:0},prag:{n:'Pragmatik',d:'Önce kalen. Az gol, sıkı maçlar.',f:-.16,a:-.28}};

let G=null;          // kariyer durumu
let UI={screen:'home',mail:null,tableTab:'lig',newTeam:null,newPhil:'denge'};
let M=null;          // aktif maç (kaydedilmez)

const team=id=>G.teams.find(t=>t.id===id);
const me=()=>team(G.teamId);
const ratingOf=t=>clamp(Math.round(t.str*2),1,20);
const rcls=v=>v<=7?'r1':v<=12?'r2':v<=16?'r3':'r4';
const badge=(t,lg)=>`<div class="badge${lg?' lg':''}" style="background:linear-gradient(135deg,${t.c1} 0 55%,${t.c2} 55%);color:${inkFor(t.c1)}"><span style="transform:translateY(-3px)">${esc(t.short)}</span></div>`;
const sw=t=>`<i class="sw" style="background:linear-gradient(90deg,${t.c1} 60%,${t.c2} 60%)"></i>`;
function moraleLabel(m){return m>=88?'Mükemmel':m>=76?'Çok İyi':m>=64?'İyi':m>=50?'Normal':m>=38?'Kötü':m>=26?'Çok Kötü':'Berbat'}
function boardLabel(b){return b>=85?'Çok memnun':b>=68?'Memnun':b>=50?'Tatmin olmuş':b>=35?'Kaygılı':b>=20?'Hayal kırıklığında':'Sabırları tükeniyor'}
function fanLabel(f){return f>=85?'Coşkulu':f>=68?'Destekçi':f>=50?'Sabırlı':f>=35?'Huzursuz':'Öfkeli'}
function weekDate(w){const d=new Date(G.year,7,15+(w-1)*7);return d.toLocaleDateString('tr-TR',{weekday:'short',day:'numeric',month:'short',year:'numeric'})}
const NW=()=>G&&G.fixtures?G.fixtures.length:38,NT=()=>G&&G.teams?G.teams.length:20;
const seasonLabel=()=>`${G.year}/${String((G.year+1)%100).padStart(2,'0')}`;

/* ===================== KARİYER ===================== */
function makeFixtures(ids){
  const arr=shuffle(ids.slice()),n=arr.length,weeks=[];
  for(let r=0;r<n-1;r++){
    const wk=[];
    for(let i=0;i<n/2;i++){
      let h=arr[i],a=arr[n-1-i];
      if(i===0?r%2===1:i%2===1)[h,a]=[a,h];
      wk.push({h,a,hs:null,as:null,t:null});
    }
    weeks.push(wk);arr.splice(1,0,arr.pop());
  }
  return weeks.concat(weeks.map(wk=>wk.map(m=>({h:m.a,a:m.h,hs:null,as:null,t:null}))));
}
function targetFor(id){
  const order=G.teams.slice().sort((a,b)=>b.str-a.str||TEAMS0.findIndex(x=>x[0]===a.id)-TEAMS0.findIndex(x=>x[0]===b.id));
  const r=order.findIndex(t=>t.id===id)+1;
  if(r<=2)return{pos:1,txt:'Şampiyonluk'};
  if(r<=4)return{pos:3,txt:'İlk 3 — Avrupa kupaları'};
  if(r<=7)return{pos:6,txt:'İlk 6 — Avrupa yarışı'};
  if(r<=12)return{pos:10,txt:'Orta sıra — ilk 10'};
  return{pos:NT()-3,txt:'Ligde kalmak'};
}
function newCareer(name,teamId,phil,kurgu,lg){
  setLeague(lg||'tr');kurgu=!!(kurgu||NATIVE||LGC!=='tr');
  const mg=shuffle(MGRS.slice());
  G={v:2,lg:LGC,manager:name,teamId,phil,year:2026,week:1,phase:'pre',board:62,fans:60,
     kurgu,teams:TEAMS0.map((t,i)=>({id:t[0],name:kurgu&&LGC==='tr'?FICT[t[0]][0]:t[1],short:kurgu&&LGC==='tr'?FICT[t[0]][1]:t[2],c1:t[3],c2:t[4],str:t[5],mgr:mg[i],morale:Math.round(rnd(55,68))})),
     fixtures:null,inbox:[],mailSeq:0,history:[],last:null,sacked:false,lossStreak:0,derbyPts:0,derbyMax:0,maxLossStreak:0};
  G.fixtures=makeFixtures(G.teams.map(t=>t.id));ensureSquads();
  seasonMails();preWeekMail();
  UI.screen='inbox';UI.mail=G.inbox[0].id;save();
}
function mail(from,subj,body,tm){G.inbox.unshift({id:++G.mailSeq,week:G.week,from,subj,body,read:false,team:tm||null});if(G.inbox.length>60)G.inbox.length=60}
function seasonMails(){
  const t=me(),tg=targetFor(t.id);
  const pred=G.teams.slice().sort((a,b)=>(b.str+rnd(-.8,.8))-(a.str+rnd(-.8,.8)));
  const myPred=pred.findIndex(x=>x.id===t.id)+1;
  mail('Yönetim Kurulu',`${seasonLabel()} sezonu beklentileri`,
   `<p>Sayın ${esc(G.manager)},</p><p>${esc(t.name)} yönetim kurulu olarak bu sezon sizden beklentimiz: <b>${tg.txt}</b>.</p><p>Kulübün vizyonu yalnızca puan değil; seçtiğiniz <b>${PHIL[G.phil].n}</b> oyun felsefesinin sahada görünmesini, derbilerde dik durmayı ve kötü serilere izin vermemenizi istiyoruz.</p><p>Güvenimiz şu an <b>${boardLabel(G.board).toLowerCase()}</b> düzeyinde. Başarılar dileriz.</p>`);
  mail('Spor Basını',`Medya tahmini: ${esc(t.short)} ${myPred}. sırada`,
   `<p>Yazarlarımızın sezon öncesi tahmininde ${esc(t.name)} <b>${myPred}.</b> sırada.</p><p>Şampiyonluk favorisi: <b>${esc(pred[0].name)}</b>. Düşme hattı adayları: ${pred.slice(-3).map(x=>esc(x.name)).join(', ')}.</p>`);
  mail('Yardımcı Antrenör','Maç günü nasıl işliyor?',
   `<p>Hocam, her hafta maç önü <b>takım konuşması</b> yapacaksınız. Konuşmanın tonu oyuncuların <b>odağını</b> belirler; odak arttıkça rakip zayıflar ve ben size maç içinde daha çok <b>taktik ipucu</b> verebilirim.</p><p>Maçı dört yoldan oynayabilirsiniz: <b>Malazgirt modu</b> (akıncılarla rakip kaleye sefer), <b>Hisar modu</b> (hisarını savun, rakip kuleyi yık), <b>Topçular modu</b> (topçularla kale kuşatması) ya da <b>Kafa Topu modu</b> (Keloğlan efsanelere karşı; skor sahadaki gibi yazılır). Zafer yıldızına göre 3-0, 2-1 ya da 1-0; yenilgide sona ne kadar yaklaştığına göre 1-1, 1-2 ya da 0-3 yazılır.</p><p>Maç sonrası basın toplantısında söyledikleriniz moral, taraftar ve yönetim güvenini etkiler.</p>`);
}
const weekMatches=w=>G.fixtures[w-1];
const userMatch=w=>weekMatches(w).find(m=>m.h===G.teamId||m.a===G.teamId);
function formOf(id,n=5){
  const out=[];
  for(let w=0;w<G.fixtures.length;w++)for(const m of G.fixtures[w]){
    if(m.hs===null||(m.h!==id&&m.a!==id))continue;
    const f=m.h===id?m.hs:m.as,a=m.h===id?m.as:m.hs;out.push(f>a?'G':f<a?'M':'B');
  }
  return out.slice(-n);
}
const formHtml=f=>`<span class="form">${f.map(x=>`<i class="fm ${x}">${x}</i>`).join('')||'<span class="faint">—</span>'}</span>`;
function table(){
  const rows={};G.teams.forEach(t=>rows[t.id]={id:t.id,o:0,g:0,b:0,m:0,a:0,y:0,p:0});
  for(const wk of G.fixtures)for(const m of wk){if(m.hs===null)continue;
    const H=rows[m.h],A=rows[m.a];H.o++;A.o++;H.a+=m.hs;H.y+=m.as;A.a+=m.as;A.y+=m.hs;
    if(m.hs>m.as){H.g++;A.m++;H.p+=3}else if(m.hs<m.as){A.g++;H.m++;A.p+=3}else{H.b++;A.b++;H.p++;A.p++}}
  return Object.values(rows).sort((x,y)=>y.p-x.p||(y.a-y.y)-(x.a-x.y)||y.a-x.a||team(x.id).name.localeCompare(team(y.id).name,'tr'));
}
const posOf=id=>table().findIndex(r=>r.id===id)+1;

/* ===================== SİMÜLASYON ===================== */
function lambdas(m,opt={}){
  const H=team(m.h),A=team(m.a);
  let lh=1.32+(H.str-A.str)*.17+(H.morale-60)/150,la=1.02+(A.str-H.str)*.17+(A.morale-60)/150;
  if(opt.user){const isH=m.h===G.teamId,fb=(opt.focus-55)/110,p=PHIL[G.phil];
    if(isH){lh+=fb+p.f;la+=-fb*.6+p.a}else{la+=fb+p.f;lh+=-fb*.6+p.a}
    if(opt.shout==='att'){if(isH){lh+=.35;la+=.25}else{la+=.35;lh+=.25}}
    if(opt.shout==='def'){if(isH){lh-=.25;la-=.35}else{la-=.25;lh-=.35}}}
  return[clamp(lh,.2,3.6),clamp(la,.15,3.4)];
}
function moraleShift(t,f,a,opp){const diff=opp.str-t.str;let d=f>a?7+diff*1.6:f<a?-7+diff*1.2:1+diff*1.1;t.morale=clamp(Math.round(t.morale+d+rnd(-2,2)),15,96)}
function simWeek(w){
  for(const m of weekMatches(w)){if(m.hs!==null)continue;const[l1,l2]=lambdas(m);m.hs=Math.min(poisson(l1),6);m.as=Math.min(poisson(l2),6);m.t='sim';creditMatch(m)}
  for(const m of weekMatches(w)){const H=team(m.h),A=team(m.a);moraleShift(H,m.hs,m.as,A);moraleShift(A,m.as,m.hs,H)}
}

/* ===================== HAFTA AKIŞI ===================== */
function preWeekMail(){
  const m=userMatch(G.week);if(!m)return;
  const opp=team(m.h===G.teamId?m.a:m.h),home=m.h===G.teamId;
  const fav=me().str+(home?.5:-.5)-opp.str;
  const tip=fav>=1.5?'Kazanmamız bekleniyor; oyunculara beklentiyi net söylemek işe yarayabilir. Ama rehavete dikkat.':fav<=-1.5?'Kâğıt üstünde zayıfız. Baskıyı üzerimizden almak ya da kalpleri ateşlemek mantıklı olabilir.':'Dengeli bir maç. Sakin ve odaklı bir yaklaşım çoğu zaman en güvenlisidir.';
  mail('Yardımcı Antrenör',`Rakip analizi: ${esc(opp.name)} (${home?'İç saha':'Deplasman'})`,
   `<p>${G.week}. hafta rakibimiz <b>${esc(opp.name)}</b>, teknik direktör ${esc(opp.mgr)}.</p><p>Güç: <b class="rt ${rcls(ratingOf(opp))}">${ratingOf(opp)}</b> · Moral: <b>${moraleLabel(opp.morale)}</b> · Lig sırası: <b>${posOf(opp.id)}.</b> · Form: ${formHtml(formOf(opp.id))}</p><p>${tip}</p>`,opp.id);
}
function finishUserMatch(hs,as,type,note){
  const prevLeader=table()[0].id;
  const m=userMatch(G.week);m.hs=hs;m.as=as;m.t=type;creditMatch(m,M&&M.mode==='quick'&&M.scorers&&M.scorers.length===hs+as?M.scorers:null);
  const isH=m.h===G.teamId,f=isH?hs:as,a=isH?as:hs,opp=team(isH?m.a:m.h);
  simWeek(G.week);G.flash=weekFlashes(G.week,prevLeader);
  const res=f>a?'G':f<a?'M':'B',pos=posOf(G.teamId),tg=targetFor(G.teamId);
  const derby=BIG4.includes(opp.id);
  G.board=clamp(G.board+clamp((tg.pos-pos)*.45,-3,3)+(res==='G'?2.2:res==='B'?0:-2.6)+(derby&&res==='G'?2:0),0,100);
  G.fans=clamp(G.fans+(res==='G'?3:res==='B'?-.5:-3.5)*(derby?1.8:1)+(G.phil==='hucum'&&f>=3?1.5:0),0,100);
  G.lossStreak=res==='M'?G.lossStreak+1:0;G.maxLossStreak=Math.max(G.maxLossStreak,G.lossStreak);
  if(derby){G.derbyMax+=3;G.derbyPts+=res==='G'?3:res==='B'?1:0}
  if(G.lossStreak>=3)G.board=clamp(G.board-3,0,100);
  const typeTxt=typeName(type);
  mail('Maç Merkezi',`${esc(team(m.h).short)} ${hs}-${as} ${esc(team(m.a).short)} · ${typeTxt}`,
   `<p>${G.week}. hafta: <b>${esc(team(m.h).name)} ${hs}-${as} ${esc(team(m.a).name)}</b> (${typeTxt}). ${note?esc(note):''}</p><p>Lig sıramız: <b>${pos}.</b> Yönetim: ${boardLabel(G.board).toLowerCase()}, taraftar: ${fanLabel(G.fans).toLowerCase()}.</p>`,opp.id);
  if(G.week%4===0)mail('Yönetim Kurulu',`${G.week}. hafta değerlendirmesi`,`<p>Ligde ${pos}. sıradasınız; hedefimiz ${tg.txt.toLowerCase()} (${tg.pos}. sıra). Güvenimiz: <b>${boardLabel(G.board)}</b>.</p>${G.board<35?'<p>Gidişat bizi rahatsız ediyor. Kısa sürede toparlanma görmek istiyoruz.</p>':G.board>75?'<p>Takımın gelişiminden memnunuz. Böyle devam.</p>':''}`);
  G.last={hs,as,type,res,opp:opp.id,isH,press:false,note:note||''};
  G.phase='post';
  if(G.week>=8&&G.board<12)G.sacked=true;
  M=null;UI.screen='post';save();render();
  setTimeout(()=>{res==='G'?SES.galibiyet():res==='M'?SES.maglubiyet():SES.gong();if(G.flash&&G.flash.length&&!AUTO)setTimeout(SES.flas,1400)},300);
}
function advance(){
  if(G.sacked){UI.screen='sacked';render();return}
  if(G.phase==='pre'){startPreMatch();return}
  if(G.phase==='post'){
    G.week++;G.phase='pre';
    if(G.week>NW()){G.phase='end';UI.screen='end';save();render();return}
    preWeekMail();UI.screen='home';save();render();return;
  }
  if(G.phase==='end'){newSeason();}
}
function newSeason(){
  const pos=posOf(G.teamId),tg=targetFor(G.teamId),t=me();
  G.history.push({year:seasonLabel(),pos,target:tg.pos,pts:table()[pos-1].p,champ:team(table()[0].id).name});
  let up='';
  if(pos<=tg.pos-2&&t.str<10){t.str++;up=`Hedefi aştığınız için yönetim bütçeyi artırdı: takım gücü ${ratingOf(t)} oldu.`}
  else if(pos>=tg.pos+4&&t.str>3){t.str--;up=`Hedefin çok gerisinde kalındı; bazı oyuncular ayrıldı: takım gücü ${ratingOf(t)}.`}
  G.teams.forEach(x=>{if(x.id!==t.id&&Math.random()<.25)x.str=clamp(x.str+pick([-1,1]),3,9);x.morale=Math.round(rnd(55,68))});
  G.year++;G.week=1;G.phase='pre';G.fixtures=makeFixtures(G.teams.map(x=>x.id));
  G.board=clamp(Math.round(G.board*.5+32),30,80);G.lossStreak=0;G.derbyPts=0;G.derbyMax=0;G.maxLossStreak=0;
  G.ps={};Object.values(G.squads||{}).forEach(sq=>sq.forEach(p=>p.age++));ensureSquads();
  seasonMails();if(up)mail('Yönetim Kurulu','Kadro ve bütçe kararı',`<p>${up}</p>`);preWeekMail();
  UI.screen='inbox';UI.mail=G.inbox[0].id;save();render();
}

/* ===================== MAÇ ÖNÜ ===================== */
function matchCtx(){const m=userMatch(G.week),isH=m.h===G.teamId,opp=team(isH?m.a:m.h);return{m,isH,opp,fav:me().str+(isH?.5:-.5)-opp.str}}
function startPreMatch(){
  const{opp,isH,fav}=matchCtx();
  const favTxt=fav>=1.5?'Favori sizsiniz.':fav<=-1.5?'Rakip kâğıt üstünde daha güçlü.':'Güç dengesi yakın.';
  openModal(`<div class="cap">Takım konuşması <span>${G.week}. hafta · ${isH?'İç saha':'Deplasman'}</span></div>

const MOTOR={
  mlz:{ad:'Malazgirt',dosya:'malazgirt.html',nl:50,sf:4,ic:'🏹'},
  hsr:{ad:'Hisar',dosya:'hisar.html',nl:40,ic:'🏰'},
  top:{ad:'Topçular',dosya:'topcular.html',nl:20,ic:'💣'},
  kfa:{ad:'Kafa Topu',dosya:'legendheads.html',nl:8,ic:'⚽'},
  rtl:{ad:'Kaptan Mecit',dosya:'kaptanmecit.html',nl:10,ic:'🕹️'}
};
const typeName=t=>({mlz:'Malazgirt',hsr:'Hisar',top:'Topçular',kfa:'Kafa Topu',rtl:'Kaptan Mecit',quick:'Hızlı Maç',chess:'Satranç',bg:'Tavla'}[t]||'');
function engineLevel(mode){const e=effOpp(),n=MOTOR[mode].nl;
  if(mode==='top')return clamp(Math.round((e-1)*1.9),0,17); // 20 kale: güçlü rakip, daha zorlu kuşatma
  if(mode==='kfa')return (Math.max(1,G.week)-1)%8; // her hafta başka efsane: Zeus, Herkül, Poseidon...
  const b=clamp(Math.round((e-1)*(mode==='mlz'?4.3:3.6)),0,n-5);
  return mode==='mlz'?((Math.max(1,G.week)-1)%MOTOR.mlz.sf)*50+b:b} // Malazgirt: her hafta başka sefer (Malazgirt, Anadolu, Haçlı, Miryokefalon)
function engineDelta(){const t=me();return (t.str-6)*.55+(M.focus-55)/22+(t.morale-60)/40}
function engineUp(lv){return clamp(Math.round(Math.min(10,(lv%50)*.2)+engineDelta()),0,10)}
function engineScore(r){ // r:{win,stars,prog} · kafa topunda gerçek skor: gf/ga
  if(r.gf!=null&&r.ga!=null)return[clamp(r.gf,0,9),clamp(r.ga,0,9)];
  if(r.win)return r.stars>=3?[3,0]:r.stars===2?[2,1]:[1,0];
  return r.prog>=.8?[1,1]:r.prog>=.5?[1,2]:[0,3];
}
function startEngine(mode){
  const{m,isH,opp}=matchCtx(),t=me(),lv=engineLevel(mode),u=engineUp(lv);
  const p=new URLSearchParams({mac:'1',lv:String(lv),up:String(u),ud:engineDelta().toFixed(2),ben:t.name,bk:t.short,b1:t.c1,b2:t.c2,rakip:opp.name,rk:opp.short,r1:opp.c1,r2:opp.c2,
    zor:(clamp((effOpp()-1.5)/8,0,1)).toFixed(2),lig:LIG(),hafta:String(G.week),saha:isH?'ic':'dep',ses:SES.vol()?'1':'0'});
  Object.assign(M,{mode,lv,running:true});
  const a=$('#arena');a.innerHTML=`<iframe title="${esc(MOTOR[mode].ad)} maçı" src="${MOTOR[mode].dosya}?${p.toString()}" allow="autoplay; fullscreen"></iframe>`;a.hidden=false;
  document.documentElement.classList.add('arena-on');SES.duduk(1);
}
function engineDone(r){
  if(!M||!M.running||!MOTOR[M.mode])return;M.running=false;
  const a=$('#arena');a.hidden=true;a.innerHTML='';document.documentElement.classList.remove('arena-on');
  const{isH}=matchCtx(),[f,ag]=engineScore(r),mode=M.mode;
  const how=r.quit?'Maçtan çekilindi.':r.gf!=null?(mode==='kfa'?`${MOTOR[mode].ad}: Keloğlan sahada, maç ${r.gf}-${r.ga} bitti.`:`${MOTOR[mode].ad}: maç ${r.gf}-${r.ga} bitti.`):r.win?`${MOTOR[mode].ad}: zafer, ${r.stars} yıldız.`:`${MOTOR[mode].ad}: yenilgi, sona %${Math.round(r.prog*100)} yaklaşıldı.`;
  finishUserMatch(isH?f:ag,isH?ag:f,mode,how);
}
window.addEventListener('message',e=>{const d=e.data;if(d&&d.ccm==='sonuc')engineDone({win:!!d.win,stars:+d.stars||0,prog:clamp(+d.prog||0,0,1),quit:!!d.quit,gf:d.gf!=null?+d.gf:null,ga:d.ga!=null?+d.ga:null})});

const LINES={
  goal:['ceza sahası dışından sert bir şutla','köşe vuruşunda iyi yükselen stoperle','hızlı bir kontra atakta','soldan kesilen ortaya kafayı vuran forvetle','penaltıdan','araya atılan topu kaleciden aşırtarak','uzak direğe kıvrılan bir vuruşla'],

  calm:['orta sahada oyunu kurmaya çalışıyor','topu ayağında tutuyor, sabırlı','kenardan bindiriyor ama orta yok','faul sonrası serbest vuruş kullanıyor']};
function quickTick(){
  if(!M||M.mode!=='quick'||!M.running)return;
  const{m}=matchCtx();
  M.min++;
  const[lh,la]=lambdas(m,{user:true,focus:M.focus,shout:M.shout});
  const H=team(m.h),A=team(m.a);
  if(Math.random()<lh/90){M.hs++;qGoal(H)}
  else if(Math.random()<la/90){M.as++;qGoal(A)}
  else if(Math.random()<.07){const t=Math.random()<lh/(lh+la)?H:A;M.feed.unshift({m:M.min,t:`${t.name} ${pick(LINES.chance)}.`})}
  else if(Math.random()<.04){const t=Math.random()<.5?H:A;M.feed.unshift({m:M.min,t:`${t.name} ${pick(LINES.calm)}.`})}
  if(M.goal){M.running=false;render();setTimeout(()=>{if(!M||M.mode!=='quick')return;M.goal=null;M.running=true;quickAfter()},M.speed===0?1600:4000);return}
  quickAfter();
}
function qGoal(t){
  const e=goalEvent(t.id);if(e)(M.scorers=M.scorers||[]).push(e);
  const sp=e&&playerById(e.s),ap=e&&e.a&&playerById(e.a);
  M.feed.unshift({m:M.min,t:`GOL! ${t.name}${sp?` · ${sp.no} ${sp.n}`:''} ${pick(LINES.goal)} ağları buldu${ap?` (asist: ${ap.n})`:''}. ${M.hs}-${M.as}`,c:'goal'});
  M.goal={t,sp,min:M.min};SES.gol();
}
function quickAfter(){
  if(!M||M.mode!=='quick')return;
  const{m}=matchCtx(),H=team(m.h),A=team(m.a);
  if(M.min>=45&&!M.ht){M.ht=true;M.running=false;SES.duduk(2);M.feed.unshift({m:45,t:`Devre arası: ${H.short} ${M.hs}-${M.as} ${A.short}. Soyunma odasında tavrınızı belirleyin.`,c:'ht'});render();return}
  if(M.min>=90){M.running=false;M.done=true;SES.duduk(3);M.feed.unshift({m:90,t:`Maç sona erdi: ${H.name} ${M.hs}-${M.as} ${A.name}.`,c:'ht'});render();
    setTimeout(()=>finishUserMatch(M.hs,M.as,'quick',M.shout==='att'?'İkinci yarı hücuma kalkıldı.':M.shout==='def'?'İkinci yarı sonuç korundu.':''),1500);return}
  render();setTimeout(quickTick,M.speed);
}

  const rows=[['O · G · B · M',`${row.o} · ${row.g} · ${row.b} · ${row.m}`],['Gol (A:Y)',`${row.a}:${row.y} <small>(${row.a-row.y>0?'+':''}${row.a-row.y})</small>`],
    ['Son maç',ls?`${esc(team(ls.m.h).short)} ${ls.m.hs}-${ls.m.as} ${esc(team(ls.m.a).short)}`:'—'],
    ['Sıradaki',nx?`${dShort(kickoff(nx.w,nx.m).d)} · ${esc(team(nx.m.h===t.id?nx.m.a:nx.m.h).short)} <small>(${nx.m.h===t.id?'İ':'D'})</small>`:'—'],

   <div class="cbig"><strong>${i+1}.</strong><span class="chip">${row.p} puan</span></div>

function techNotes(m){
  const out=[],tb=table();
  const side=id=>{const t=team(id),r=tb.find(x=>x.id===id),pos=tb.indexOf(r)+1,f=formOf(id);return{t,r,pos,f}};
  const H=side(m.h),A=side(m.a);
  for(const[X,Y]of[[H,A],[A,H]]){
    const w=X.f.filter(x=>x==='G').length,l=X.f.filter(x=>x==='M').length;
    if(X.f.length>=4&&w>=3)out.push([X.t,'adv','Form avantajı',`Son ${X.f.length} maçta ${w} galibiyet`]);
    else if(X.f.length>=4&&l>=3)out.push([X.t,'dis','Form dezavantajı',`Son ${X.f.length} maçta ${l} yenilgi`]);
    if(X.r.o&&Y.r.o){
      const ga=X.r.a/X.r.o,gb=Y.r.a/Y.r.o,ya=X.r.y/X.r.o;
      if(ga>=1.6&&ga>gb*1.3)out.push([X.t,'adv','Hücum avantajı',`Maç başına ${one(ga)} gol atıyor (rakip ${one(gb)})`]);
      if(ya<=.8&&X.r.o>=3)out.push([X.t,'adv','Savunma avantajı',`Maç başına ${one(ya)} gol yiyor`]);
      if(ya>=1.8)out.push([X.t,'dis','Savunma zaafı',`Maç başına ${one(ya)} gol yiyor`]);
      if(Y.pos-X.pos>=5)out.push([X.t,'adv','Sıralama avantajı',`Puan tablosunda ${Y.pos-X.pos} sıra yukarıda (${X.pos}. ve ${Y.pos}.)`]);
      out.push([X.t,'info','Puan ortalaması',`Maç başına ${one(X.r.p/X.r.o)} puan · ${X.pos}. sırada`]);
    }
    if(X.t.morale>=76)out.push([X.t,'adv','Moral avantajı',`Takım morali ${moraleLabel(X.t.morale).toLowerCase()}`]);
    else if(X.t.morale<38)out.push([X.t,'dis','Moral sorunu',`Takım morali ${moraleLabel(X.t.morale).toLowerCase()}`]);
    if(X.t.str-Y.t.str>=2)out.push([X.t,'adv','Kadro üstünlüğü',`Güç ${ratingOf(X.t)}, rakip ${ratingOf(Y.t)}`]);
    const ts=topScorerOf(X.t.id);if(ts)out.push([X.t,'man','Tehlikeli oyuncu',`${ts.p.n}: ${ts.g} gol${ts.a?`, ${ts.a} asist`:''} (${appsOf(ts.p)} maç)`]);
  }
  out.push([H.t,'info','İç saha',`${H.t.name} maça kendi sahasında çıkıyor`]);
  const rank={man:0,adv:1,dis:2,info:3};
  return out.sort((a,b)=>rank[a[1]]-rank[b[1]]);
}

/* ===================== SES (11.10 · Futbol/Borsa/Fırsat Akışı ile aynı yaklaşım) =====================
   Bütün sesler tarayıcıda anında üretilir (kayıt yok → telif sorunu yok).
   Düzey: ?ses=0..100 (0 kapalı, varsayılan 70) ya da araç çubuğundaki 🔊 düğmesi.
   OBS: tarayıcı kaynağında "Sesi OBS üzerinden kontrol et" işaretli olsun; ses miksere ayrı kanal gelir. */
const SES=(()=>{
  const qs=new URLSearchParams(location.search);
  let vol=qs.has('ses')?clamp(+qs.get('ses')||0,0,100)/100:(()=>{try{const v=localStorage.getItem('ccm-ses');return v==null?.7:+v}catch(e){return .7}})();
  let ctx=null,master=null,gn=null;
  function ac(){
    if(!vol)return null;
    if(!ctx){try{ctx=new(window.AudioContext||window.webkitAudioContext)();master=ctx.createDynamicsCompressor();gn=ctx.createGain();gn.gain.value=vol;master.connect(gn);gn.connect(ctx.destination)}catch(e){return null}}
    if(ctx.state==='suspended')ctx.resume().catch(()=>{});
    return ctx;
  }
  window.SesKurtarici&&SesKurtarici.yenidenKur(()=>{ctx=null});
  ['click','keydown','touchstart'].forEach(ev=>addEventListener(ev,()=>ac(),{passive:true}));
  if(window.obsstudio)setTimeout(ac,300);
  function env(g,t,a,peak,hold,rel){g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(peak,t+a);g.gain.setValueAtTime(peak,t+a+hold);g.gain.exponentialRampToValueAtTime(.0001,t+a+hold+rel)}
  function tone(c,t,f,len,p,type){const o=c.createOscillator(),g=c.createGain();o.type=type||'triangle';o.frequency.value=f;o.connect(g);g.connect(master);env(g,t,.01,p,len,.2);o.start(t);o.stop(t+len+.3)}
  function noise(c,t,len,p,freq,q,att){
    const b=c.createBuffer(1,Math.max(1,Math.floor(c.sampleRate*(len+.3))),c.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
    const s=c.createBufferSource(),f=c.createBiquadFilter(),g=c.createGain();s.buffer=b;f.type='bandpass';f.frequency.value=freq;f.Q.value=q||1;
    s.connect(f);f.connect(g);g.connect(master);env(g,t,att||.005,p,len*.4,len*.6);s.start(t);s.stop(t+len+.3)}
  function whistle(c,t,len){
    const lfo=c.createOscillator(),lg=c.createGain();lfo.frequency.value=28;lg.gain.value=90;lfo.connect(lg);
    [2850,3020].forEach((f,i)=>{const o=c.createOscillator(),g=c.createGain();o.type='sine';o.frequency.value=f;lg.connect(o.frequency);o.connect(g);g.connect(master);env(g,t,.015,i?.07:.11,len,.06);o.start(t);o.stop(t+len+.15)});
    lfo.start(t);lfo.stop(t+len+.15);noise(c,t,len,.03,3000,2)}
  function bell(c,t,f0,len){[[1,.26],[2,.13],[2.4,.1],[3,.06],[4.2,.04]].forEach(([r,p],i)=>{const o=c.createOscillator(),g=c.createGain();o.type='sine';o.frequency.value=f0*r;o.connect(g);g.connect(master);env(g,t,.004,p,.02,len*(1-i*.12));o.start(t);o.stop(t+len+.1)})}
  const last={};const calm=(k,ms)=>{const n=Date.now();if(last[k]&&n-last[k]<ms)return false;last[k]=n;return true};
  const play=(k,ms,fn)=>{const c=ac();if(!c||!calm(k,ms))return;fn(c,c.currentTime+.04)};
  return{
    duduk:n=>play('duduk',600,(c,t)=>{for(let i=0;i<n;i++)whistle(c,t+i*.42,i===n-1?.55:.2)}),
    gol:()=>play('gol',1500,(c,t)=>{[[220,.16],[277,.13],[330,.11]].forEach(([f,p])=>{const o=c.createOscillator(),lp=c.createBiquadFilter(),g=c.createGain();o.type='sawtooth';o.frequency.value=f;lp.type='lowpass';lp.frequency.value=1400;o.connect(lp);lp.connect(g);g.connect(master);env(g,t,.05,p,1.1,.4);o.start(t);o.stop(t+1.7)});noise(c,t+.1,2.8,.22,700,.6,.6)}),
    gong:()=>play('gong',500,(c,t)=>[[196,.2],[294,.1],[392,.05]].forEach(([f,p])=>tone(c,t,f,.05,p,'sine'))),
    zil:()=>play('zil',800,(c,t)=>{bell(c,t,880,1.1)}),
    acilis:()=>play('acilis',2000,(c,t)=>{for(let i=0;i<3;i++)bell(c,t+i*.38,523,1.4)}),
    hamle:()=>play('hamle',60,(c,t)=>{noise(c,t,.05,.35,1800,1.4);tone(c,t,620,.02,.05,'sine')}),
    tas:()=>play('tas',60,(c,t)=>{noise(c,t,.09,.5,900,.9);tone(c,t,180,.05,.12,'sine')}),
    sah:()=>play('sah',300,(c,t)=>{tone(c,t,988,.08,.08,'square');tone(c,t+.13,988,.08,.08,'square')}),
    zar:()=>play('zar',300,(c,t)=>{for(let i=0;i<7;i++)noise(c,t+i*.055+Math.random()*.03,.04,.4,1200+Math.random()*1500,2)}),
    flas:()=>play('flas',2500,(c,t)=>{tone(c,t,784,.12,.12,'square');tone(c,t+.18,1047,.16,.12,'square')}),
    galibiyet:()=>play('sonuc',2000,(c,t)=>[523,659,784,1047].forEach((f,i)=>tone(c,t+i*.13,f,i===3?.4:.1,.14))),
    maglubiyet:()=>play('sonuc',2000,(c,t)=>[392,330,262].forEach((f,i)=>tone(c,t+i*.2,f,i===2?.5:.15,.12,'sine'))),
    vol:()=>vol,
    setVol:v=>{vol=v;try{localStorage.setItem('ccm-ses',String(v))}catch(e){}if(gn)gn.gain.value=v;if(v)ac()},
  };
})();

  for(const f of list){Y.flash=f;SES.flas();paintOverlay();await sleep(7000);}
  Y.flash=null;paintOverlay();
}
function autoTalk(){const{fav}=matchCtx();return fav<=-1.5?'fire':fav>=1.5?'demand':'calm'}
async function autoLoop(){
  const kurgu=QS.get('kurgu')==='1';
  G=loadSave();if(G)setLeague(G.lg||'tr');
  if(!G||G.sacked){newCareer('Mr. Anduv',TEAMS0.some(t=>t[0]===QS.get('takim'))?QS.get('takim'):'fb',['hucum','denge','prag'].includes(QS.get('felsefe'))?QS.get('felsefe'):'denge',kurgu)}
  ensureSquads();
  let wk=0;
  for(;;){
    if(Date.now()-BOOT>6*3600e3){save();location.reload();return}   // OBS'de bellek şişmesin: 6 saatte bir sakin anda tazele
    if(G.phase==='end'){await hold('end',SECS*2);newSeason();continue}
    if(G.phase==='post'){advance();continue}
    if(G.sacked){wipeSave();G=null;newCareer('Mr. Anduv','fb','denge',kurgu);continue}
    wk++;
    const pre=SECS+SECS*1.5+(wk%2?SECS*1.5:0);
    Y.kick=Date.now()+pre*1000+4500;
    await hold('home',SECS);
    await hold('tech',SECS*1.5);
    if(wk%2){UI.sqTeam=pick(BIG4.concat(G.teamId));await hold('squad',SECS*1.5)}
    doTalk(autoTalk());await sleep(4500);closeModal();
    Y.kick=0;startQuick();M.speed=330;await sleep(1200);ACT.qStart();
    await waitFor(()=>{if(M&&M.mode==='quick'&&!M.running&&M.min===45&&!M.done&&!M.goal){ACT.qShout(pick(['att','','def']))}return G.phase==='post'});
    await hold('post',SECS*1.5);
    if(!G.last.press){pressConf();await sleep(3000);pressAns(Math.floor(Math.random()*3));await sleep(3500);closeModal()}
    if(G.flash&&G.flash.length)await showFlashes(G.flash);
    UI.tableTab=wk%3===0?'tek':(G.flash||[]).some(f=>f.k==='derbi')?'derbi':'lig';
    await hold('table',SECS*1.5);
    await hold('stats',SECS*1.5);
    if(wk%3===2){UI.fx=null;await hold('fix',SECS)}
    UI.inTab='all';UI.mail=G.inbox[0]&&G.inbox[0].id;await hold('inbox',SECS);
    advance();SES.zil();
  }
}
function startAuto(){
  if(NATIVE)return;
  if(G)save();
  AUTO=true;M=null;closeModal();
  try{history.replaceState(null,'','#yayin')}catch(e){}
  autoLoop();
}

const IMZA=(()=>{
  const ALL=[['spotify','Spotify','#1ed760'],['youtube','YouTube','#ff3b3b'],['ytmusic','YouTube Music','#ff5a5a'],['apple','Apple Music','#fc5c74'],['amazon','Amazon Music','#25d1da'],['tiktok','TikTok','#25f4ee'],['twitch','Twitch','#b18cff'],['kick','Kick','#53fc18']];
  const pin=(QS.get('platform')||'').toLowerCase(),P=ALL.filter(p=>!pin||p[0]===pin).length?ALL.filter(p=>!pin||p[0]===pin):ALL;
  let i=0,fresh=false,driven=false;
  const html=()=>{const[,n,c]=P[i%P.length];const sw=fresh;fresh=false;return `<span class="sig-p${sw?' sw':''}" style="--pc:${c}">${n}</span><span class="sig-s">/</span><span class="sig-n">Mr. Anduv!</span>`};
  const paint=()=>document.querySelectorAll('.music .sig').forEach(el=>{el.innerHTML=html()});
