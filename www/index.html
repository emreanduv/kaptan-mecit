<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0d2416">
<title>Kaptan Mecit</title>
<script>/* uygulama içinde ekran yönü: açılış ve Klasik dik */try{var so=window.Capacitor&&Capacitor.Plugins&&Capacitor.Plugins.ScreenOrientation;if(so)so.lock({orientation:'portrait'}).catch(function(){})}catch(e){}</script>
<style>
/* Kaptan Mecit — açılış: önce dil (Türkçe / English), sonra oyun (Klasik / Modern). Klasik: klasik/index.html, Modern: modern/ (Kaptan Mecit 3 web derlemesi). */
:root{--night:#0d2416;--grass:#2f7a34;--grass-2:#378a3b;--gold:#f0b232;--gold-d:#9a5f0e;--navy:#1d3f6e;--navy-d:#122a4b;--paper:#fff8ea;--ink:#16202e;
  --f:'Trebuchet MS','Arial Rounded MT Bold',system-ui,-apple-system,sans-serif;--safe-t:env(safe-area-inset-top,0px);--safe-b:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--night);color:#fff;font-family:var(--f);-webkit-user-select:none;user-select:none;overscroll-behavior:none}
main{min-height:100%;min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;
  padding:calc(24px + var(--safe-t)) 16px calc(24px + var(--safe-b));
  background:radial-gradient(ellipse at 50% 30%,rgba(255,255,255,.10),transparent 60%),repeating-linear-gradient(180deg,var(--grass) 0 56px,var(--grass-2) 56px 112px)}
.logo{text-align:center;margin-bottom:6px}
.logo h1{margin:0;font-size:clamp(38px,11vw,64px);line-height:.95;letter-spacing:2px;font-weight:900;color:var(--paper);
  text-shadow:0 4px 0 #0b2a12,0 8px 18px rgba(0,0,0,.45)}
.logo p{margin:10px 0 0;font-weight:800;font-size:15px;color:#e9f3e3;opacity:.9}
.stack{width:100%;max-width:440px;display:flex;flex-direction:column;gap:12px}
button{font-family:var(--f);color:inherit;cursor:pointer;border:0}
.dil{display:flex;align-items:center;justify-content:center;gap:12px;min-height:72px;border-radius:16px;font-size:24px;font-weight:900;letter-spacing:.5px;
  background:linear-gradient(180deg,#ffd15c,var(--gold));color:var(--ink);box-shadow:0 5px 0 var(--gold-d),0 10px 22px rgba(0,0,0,.3)}
.dil.ikinci{background:linear-gradient(180deg,#2e5c96,var(--navy));color:#fff;box-shadow:0 5px 0 var(--navy-d),0 10px 22px rgba(0,0,0,.3)}
.dil:active,.oyun:active{transform:translateY(3px)}
.bayrak{font-size:28px}
.oyun{display:block;text-align:left;width:100%;border-radius:18px;padding:18px 18px 16px;position:relative;overflow:hidden;
  box-shadow:0 5px 0 rgba(0,0,0,.35),0 12px 26px rgba(0,0,0,.3)}
.oyun b{display:block;font-size:13px;letter-spacing:2px;opacity:.85}
.oyun strong{display:block;font-size:28px;font-weight:900;line-height:1.1;margin-top:2px}
.oyun small{display:block;font-size:14px;font-weight:700;margin-top:6px;opacity:.92}
.oyun.klasik{background:linear-gradient(135deg,#ffd15c,var(--gold) 60%,#d98f17);color:var(--ink)}
.oyun.modern{background:linear-gradient(135deg,#3c78c2,var(--navy) 60%,#0f2442);color:#fff}
.oyun i{position:absolute;right:-8px;bottom:-18px;font-style:normal;font-size:96px;opacity:.18;pointer-events:none}
.oyun.son::after{content:'';position:absolute;inset:0;border:3px solid #fff;border-radius:18px;opacity:.75}
.alt{background:rgba(0,0,0,.28);color:#fff;border-radius:12px;min-height:46px;font-weight:800;font-size:15px}
.hata{margin:0;padding:12px 14px;border-radius:12px;background:rgba(125,26,33,.85);font-weight:800;font-size:14px;text-align:center}
.credit{margin:6px 0 0;text-align:center;font-size:13px;font-weight:700;color:#e9f3e3;opacity:.85}
.yukle{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:var(--night);font-weight:800;font-size:18px}
</style>
</head>
<body>
<main id="dilEkran">
  <div class="logo"><h1>KAPTAN<br>MECİT</h1><p>Dil seç · Choose your language</p></div>
  <div class="stack">
    <button class="dil" data-dil="tr"><span class="bayrak">🇹🇷</span>Türkçe</button>
    <button class="dil ikinci" data-dil="en"><span class="bayrak">🇬🇧</span>English</button>
  </div>
  <p class="credit">Bir Mr. Anduv! yapımıdır.</p>
</main>
<main id="oyunEkran" hidden>
  <div class="logo"><h1>KAPTAN<br>MECİT</h1><p data-m="sec"></p></div>
  <div class="stack">
    <p class="hata" id="hata" hidden></p>
    <button class="oyun klasik" data-oyun="klasik"><b data-m="kb"></b><strong data-m="ka"></strong><small data-m="ks"></small><i>⚽</i></button>
    <button class="oyun modern" data-oyun="modern"><b data-m="mb"></b><strong data-m="ma"></strong><small data-m="ms"></small><i>🏟️</i></button>
    <button class="alt" id="dilDon" data-m="dil"></button>
  </div>
  <p class="credit" data-m="credit"></p>
</main>
<div class="yukle" id="yukle" hidden></div>
<script>
'use strict';
const M={
  tr:{sec:'Hangi oyunu açalım?',kb:'KAPTAN MECİT',ka:'Klasik',ks:'Üstten bakış · 6 lig · 114 kulüp',mb:'KAPTAN MECİT',ma:'Modern',ms:'3B stadyum · lig modu',
    dil:'‹ Dil: Türkçe · Language',hata:'Modern bu cihazda açılamadı. Klasik ile devam edebilirsin.',credit:'Bir Mr. Anduv! yapımıdır.',yukle:'Yükleniyor…'},
  en:{sec:'Which game shall we open?',kb:'KAPTAN MECIT',ka:'Classic',ks:'Top-down · 6 leagues · 114 clubs',mb:'KAPTAN MECIT',ma:'Modern',ms:'3D stadium · league mode',
    dil:'‹ Language: English · Dil',hata:'Modern could not start on this device. You can play Classic.',credit:'Made by Mr. Anduv!',yukle:'Loading…'}
};
const oku=k=>{try{return localStorage.getItem(k)}catch(e){return null}},yaz=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};
const $=s=>document.querySelector(s);
let dil=oku('km.dil')||((navigator.language||'tr').toLowerCase().startsWith('tr')?'tr':'en');
function oyunEkrani(){
  const t=M[dil];document.documentElement.lang=dil;
  document.querySelectorAll('[data-m]').forEach(e=>e.textContent=t[e.dataset.m]);
  const son=oku('km.oyun');document.querySelectorAll('.oyun').forEach(b=>b.classList.toggle('son',b.dataset.oyun===son));
  const h=/[?&]hata=modern/.test(location.search);$('#hata').hidden=!h;if(h)$('#hata').textContent=t.hata;
  $('#dilEkran').hidden=true;$('#oyunEkran').hidden=false;
}
function dilEkrani(){$('#oyunEkran').hidden=true;$('#dilEkran').hidden=false;
  document.querySelectorAll('.dil').forEach(b=>b.style.outline=b.dataset.dil===oku('km.dil')?'3px solid #fff':'')}
document.querySelectorAll('.dil').forEach(b=>b.onclick=()=>{dil=b.dataset.dil;yaz('km.dil',dil);oyunEkrani()});
$('#dilDon').onclick=dilEkrani;
document.querySelectorAll('.oyun').forEach(b=>b.onclick=()=>{
  const o=b.dataset.oyun;yaz('km.oyun',o);
  $('#yukle').textContent=M[dil].yukle;$('#yukle').hidden=false;
  location.href=o==='klasik'?'klasik/index.html?dil='+dil:'modern/index.html?dil='+dil+'&kabuk=1';
});
if(/[?&]sec=1/.test(location.search)&&oku('km.dil'))oyunEkrani();else dilEkrani();
window.addEventListener('pageshow',()=>{$('#yukle').hidden=true});
</script>
</body>
</html>
