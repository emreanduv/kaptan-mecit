name: App Store sürümü hazırla (metin + derleme)
on:
  workflow_dispatch:
    inputs:
      bundle: { description: "Paket kimliği", default: "com.championchess.manager" }
      version: { description: "Sürüm (ör. 3.4.0)", required: true }
      build_number: { description: "Bağlanacak derleme", required: false, default: "" }
      not_tr: { description: "Yenilikler (TR)", required: false, default: "" }
      not_en: { description: "What's new (EN)", required: false, default: "" }
permissions:
  contents: write
env:
  ASC_KEY_ID: DJSHKK6T3P
  ASC_ISSUER_ID: f4943ef8-df6f-42c8-a561-58554097ea35
jobs:
  surum:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Anahtar
        env: { P8: "${{ secrets.ASC_KEY_P8 }}" }
        run: mkdir -p ~/private_keys && printf '%s' "$P8" > ~/private_keys/AuthKey_${ASC_KEY_ID}.p8
      - run: pip3 install --quiet pyjwt cryptography
      - name: Hazırla
        env: { BUNDLE: "${{ inputs.bundle }}", VERSION: "${{ inputs.version }}", BUILD_NO: "${{ inputs.build_number }}", NOT_TR: "${{ inputs.not_tr }}", NOT_EN: "${{ inputs.not_en }}" }
        run: python3 araclar/asc_surum.py
      - name: Durumu durum dalına yaz
        if: always()
        run: |
          mkdir -p /tmp/d && cp durum.json /tmp/d/ 2>/dev/null || echo '{}' > /tmp/d/durum.json; cd /tmp/d
          git init -q -b durum && git config user.name "github-actions" && git config user.email "actions@github.com"
          git add . && git commit -qm "ASC durum" && git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" durum
