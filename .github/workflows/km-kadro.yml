name: Kaptan Mecit güncel kadrolar
# Her pazartesi Champion Battle Manager'ın türetilmiş dünyası (emreanduv.github.io veri/cbm/v1/dunya.json, 04:41'de yenilenir)
# Kaptan Mecit'e aktarılır: Klasik (www/klasik), Modern ve VR (km3/veri). Kulüp kimliği ve sırası korunur, kayıtlar bozulmaz.
# Denemeler (Klasik 28 lig + Modern lig_dene) geçmezse hiçbir şey yazılmaz. Mağaza derlemeleri sonraki sürümde bu veriyi alır;
# web (Kaptan Mecit 3) emreanduv.github.io'daki km3-web iş akışıyla aynı gün yenilenir.
on:
  schedule:
    - cron: "17 8 * * 1"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: km-kadro
  cancel-in-progress: false
jobs:
  kadro:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - name: CBM dünyası (geçmişiyle)
        uses: actions/checkout@v4
        with:
          repository: emreanduv/emreanduv.github.io
          path: _pages
          fetch-depth: 0
          filter: blob:none
          sparse-checkout: veri
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Playwright
        run: npm i --no-save --no-package-lock playwright@1.48.2 && npx playwright install --with-deps chromium
      - name: Aktar
        id: g
        run: |
          bash araclar/cbm-veri/guncelle.sh _pages | tee /tmp/sonuc
          echo "durum=$(cut -d' ' -f1 /tmp/sonuc)" >> "$GITHUB_OUTPUT"
          echo "sonuc=$(cat /tmp/sonuc)" >> "$GITHUB_OUTPUT"
      - name: Klasik denemesi (28 lig)
        if: steps.g.outputs.durum == 'GUNCELLENDI'
        run: node araclar/cbm-veri/dene-lig28.js "$PWD/www/klasik/index.html"
      - name: Modern denemesi (bütün liglerde sezon)
        if: steps.g.outputs.durum == 'GUNCELLENDI'
        run: |
          curl -sSL -o /tmp/g.zip https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          unzip -q /tmp/g.zip -d /tmp/g && G=/tmp/g/Godot_v4.3-stable_linux.x86_64
          $G --headless --path km3 --import >/dev/null 2>&1 || true
          $G --headless --path km3 -s res://dene/lig_dene.gd 2>&1 | tee /tmp/lig.txt | tail -3
          grep -q "LİG DENEMESİ:  TAMAM\|LİG DENEMESİ: TAMAM" /tmp/lig.txt
      - name: Kaydet
        if: steps.g.outputs.durum == 'GUNCELLENDI'
        run: |
          git config user.name "Mr. Anduv! veri"; git config user.email "actions@users.noreply.github.com"
          git add km3/veri www/klasik araclar/cbm-veri/KAYNAK
          git commit -qm "Kadrolar güncellendi (Champion Battle Manager haftalık verisi: ${{ steps.g.outputs.sonuc }})"
          for i in 1 2 3; do git pull -q --rebase origin main && git push -q origin main && break; sleep 5; done
