name: Kaptan Mecit 2 (Meta Quest APK)
# km2/ Godot 4.3 projesini OpenXR + Meta yükleyicisiyle Quest için derler (gradle derlemesi).
# İmzasız APK + apksigner.jar yayınlanır; imza anahtarı depoya girmez, yerelde atılır.
on:
  workflow_dispatch:
    inputs:
      version_name: { description: "Sürüm adı", default: "1.0.0" }
      version_code: { description: "Sürüm kodu", default: "1" }
      package: { description: "Paket adı", default: "com.anduv.kaptanmecit2" }
permissions:
  contents: write
env:
  GODOT: "4.3"
  VENDORS: "3.1.2-stable"
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Godot ve dışa aktarma şablonları
        run: |
          set -e
          mkdir -p ~/godot && cd ~/godot
          curl -sSL -o g.zip https://github.com/godotengine/godot/releases/download/${GODOT}-stable/Godot_v${GODOT}-stable_linux.x86_64.zip
          unzip -q g.zip && mv Godot_v${GODOT}-stable_linux.x86_64 godot && chmod +x godot
          curl -sSL -o t.tpz https://github.com/godotengine/godot/releases/download/${GODOT}-stable/Godot_v${GODOT}-stable_export_templates.tpz
          D=~/.local/share/godot/export_templates/${GODOT}.stable; mkdir -p $D
          unzip -q -o t.tpz "templates/android_*" "templates/version.txt" -d x && mv x/templates/* $D/ && rm -rf x t.tpz
          ls -la $D
      - name: OpenXR satıcı eklentisi (Meta yükleyicisi)
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          set -e
          mkdir -p /tmp/v && cd /tmp/v
          gh release download "$VENDORS" -R GodotVR/godot_openxr_vendors -p "*.zip"
          ls -la; for z in *.zip; do unzip -q -o "$z"; done
          A=$(find . -type d -name godotopenxrvendors -path "*addons*" | head -1); echo "eklenti: $A"
          mkdir -p "$GITHUB_WORKSPACE/km2/addons" && cp -r "$A" "$GITHUB_WORKSPACE/km2/addons/"
          ls "$GITHUB_WORKSPACE/km2/addons/godotopenxrvendors"
      - name: Android derleme şablonu, düzenleyici ayarları, sürüm
        run: |
          set -e
          cd km2
          mkdir -p android/build
          unzip -q -o ~/.local/share/godot/export_templates/${GODOT}.stable/android_source.zip -d android/build
          echo "${GODOT}.stable" > android/.build_version
          touch android/build/.gdignore
          keytool -genkeypair -v -keystore ~/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US" >/dev/null
          mkdir -p ~/.config/godot
          cat > ~/.config/godot/editor_settings-${GODOT}.tres <<EOT
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$HOME/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOT
          sed -i 's/^version\/code=.*/version\/code=${{ inputs.version_code }}/; s/^version\/name=.*/version\/name="${{ inputs.version_name }}"/; s/^package\/unique_name="com.anduv.kaptanmecit2"/package\/unique_name="${{ inputs.package }}"/' export_presets.cfg
          grep -nE "^(version|package/unique_name)" export_presets.cfg
      - name: İçe aktar ve dışa aktar
        run: |
          set -o pipefail
          cd km2
          ~/godot/godot --headless --path . --import 2>&1 | tail -20 | tee /tmp/gunluk.txt || true
          ~/godot/godot --headless --path . --import 2>&1 | tail -5 | tee -a /tmp/gunluk.txt || true
          mkdir -p ../build
          ~/godot/godot --headless --path . --export-release "Quest" ../build/km2-quest.apk 2>&1 | tee -a /tmp/gunluk.txt || true
          ls -la ../build | tee -a /tmp/gunluk.txt
          find android/build/build/outputs -name "*.apk" 2>/dev/null | tee -a /tmp/gunluk.txt || true
          test -f ../build/km2-quest.apk
      - name: Günlüğü km2-gunluk dalına yaz
        if: always()
        run: |
          mkdir -p /tmp/g && cp /tmp/gunluk.txt /tmp/g/ 2>/dev/null || echo yok > /tmp/g/gunluk.txt; cd /tmp/g
          git init -q -b km2-gunluk && git config user.name gha && git config user.email gha@x && git add . && git commit -qm gunluk
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" km2-gunluk
      - name: Yayınla
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          T=km2-${{ inputs.version_name }}-${{ inputs.version_code }}-${{ github.run_number }}
          F="/tmp/kaptan-mecit-2-${{ inputs.version_name }}-${{ inputs.version_code }}-unsigned.apk"
          cp build/km2-quest.apk "$F"
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          gh release create "$T" -R "${{ github.repository }}" --title "Kaptan Mecit 2 Quest ${{ inputs.version_name }} (${{ inputs.version_code }}) imzasız" --notes "Meta Quest imzasız APK + apksigner.jar (yerelde imza için)" "$F" "$BT/lib/apksigner.jar"
