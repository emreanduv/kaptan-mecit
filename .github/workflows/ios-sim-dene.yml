name: iOS simülatör denemesi
# Uygulamayı iOS simülatöründe derleyip açar; konsol çıktısını (Capacitor JS hataları dahil) ve ekran görüntüsünü "ios-sim-dene" dalına yazar.
on:
  workflow_dispatch:
    inputs:
      ref: { description: "Denenecek commit/dal", default: "main" }
      runner: { description: "Makine", default: "macos-latest" }
permissions:
  contents: write
jobs:
  dene:
    runs-on: ${{ inputs.runner }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ inputs.ref }}" }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Xcode 26 seç
        run: |
          X=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$X" ]; then sudo xcode-select -s "$X"; fi
          xcodebuild -version
      - run: npm ci
      - name: Hata yakalayıcı ekle (yalnız deneme derlemesi)
        run: |
          python3 - <<'PY'
          p='www/index.html'; s=open(p,encoding='utf-8').read()
          js="""<script>(function(){function g(t){try{var d=document.getElementById('__hata');if(!d){d=document.createElement('pre');d.id='__hata';d.style.cssText='position:fixed;z-index:999999;left:0;right:0;top:0;bottom:0;margin:0;padding:60px 10px;background:#200;color:#fff;font:12px monospace;white-space:pre-wrap;overflow:auto';(document.body||document.documentElement).appendChild(d)}d.textContent+=t+'\\n\\n'}catch(e){}}
          window.addEventListener('error',function(e){g('HATA: '+e.message+' @'+e.lineno+':'+e.colno+'\\n'+(e.error&&e.error.stack||''))});
          window.addEventListener('unhandledrejection',function(e){g('PROMISE: '+(e.reason&&(e.reason.stack||e.reason.message)||e.reason))});
          setTimeout(function(){g('5sn: app='+((document.getElementById('app')||{}).innerHTML||'').length+' body='+document.body.innerHTML.length)},5000)})();</script>"""
          i=s.index('<head>')+6; s=s[:i]+js+s[i:]
          open(p,'w',encoding='utf-8').write(s)
          PY
          head -c 1500 www/index.html
      - run: npx cap sync ios
      - name: Simülatör için derle
        working-directory: ios/App
        run: |
          xcodebuild -project App.xcodeproj -scheme App -configuration Debug -sdk iphonesimulator \
            -derivedDataPath $RUNNER_TEMP/dd CODE_SIGNING_ALLOWED=NO build 2>&1 | tail -20
      - name: Aç ve izle
        run: |
          mkdir -p sonuc
          UDID=$(xcrun simctl list devices available -j | python3 -c "import json,sys;d=json.load(sys.stdin)['devices'];print([x['udid'] for k,v in d.items() if 'iOS' in k for x in v if 'iPhone' in x['name']][-1])")
          xcrun simctl boot $UDID; sleep 25
          APP=$(ls -d $RUNNER_TEMP/dd/Build/Products/Debug-iphonesimulator/*.app | head -1)
          xcrun simctl install $UDID "$APP"
          xcrun simctl launch --console-pty --terminate-running-process $UDID com.anduv.kaptanmecit > sonuc/konsol.txt 2>&1 &
          LP=$!
          sleep 25
          xcrun simctl io $UDID screenshot sonuc/ekran.png
          kill $LP 2>/dev/null || true
          xcrun simctl spawn $UDID log show --last 3m --predicate 'processImagePath CONTAINS "App.app" OR eventMessage CONTAINS "⚡️"' --style compact > sonuc/log.txt 2>&1 || true
          grep -i "⚡️\|error\|exception\|crash\|fault" sonuc/log.txt | head -120 > sonuc/log-ozet.txt || true
          ls ~/Library/Logs/DiagnosticReports/ 2>/dev/null | tail -5 > sonuc/cokme.txt || true
          cat sonuc/konsol.txt | head -100; echo ----; cat sonuc/log-ozet.txt
      - name: Dala yaz
        if: always()
        run: |
          git init -q d && cp -r sonuc/* d/ 2>/dev/null; cd d; git add -A
          git -c user.name=gha -c user.email=gha@x commit -qm dene
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" HEAD:ios-sim-dene
