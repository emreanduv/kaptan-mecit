const BALL=['0000011111100000','0001100000011000','0010011111100100','0100111111110010','0101111001111010','1001110000111001','1011110000111101','1011111001111101','1001111111111001','1000111111110001','1000011001100001','0100110000110010','0100110000110010','0011001111001100','0001100000011000','0000011111100000'];
// basit piksel top: 16x16 harita, 1=siyah çizgi/desen, beyaz dolgu daire
function ball(cx,cy,px){const W=[[5,1,6,1],[3,2,10,1],[2,3,12,10],[1,5,14,6],[3,13,10,1],[5,14,6,1]],D=[[6,5,4,4],[2,7,2,2],[12,7,2,2],[5,11,2,2],[9,11,2,2],[6,2,4,1]];
  const r=(a,col)=>{g.fillStyle=col;for(const[x,y,w,h]of a)g.fillRect(cx+(x-8)*px,cy+(y-8)*px,w*px,h*px)};
  g.fillStyle='rgba(0,0,0,.25)';for(const[x,y,w,h]of W)g.fillRect(cx+(x-8)*px+px*.6,cy+(y-8)*px+px*.6,w*px,h*px);r(W,'#ffffff');r(D,'#16202e')}
function stripes(w,h,n){for(let i=0;i<n;i++){g.fillStyle=i%2?'#378a3b':'#2f7a34';g.fillRect(0,Math.floor(i*h/n),w,Math.ceil(h/n)+1)}}
function armband(x,y,w,h){g.fillStyle='#16202e';g.fillRect(x-6,y-6,w+12,h+12);g.fillStyle='#f0b232';g.fillRect(x,y,w,h);g.fillStyle='#d8871a';g.fillRect(x,y+h-h*.18,w,h*.18);
  g.fillStyle='#16202e';g.font=`${Math.round(h*.62)}px PS2P`;g.textAlign='center';g.textBaseline='middle';g.fillText('C',x+w/2+h*.04,y+h/2+h*.05)}
function fixI(t){return t.replace(/İ/g,'I')}
function dots(t,cx,yy,size,col){const w=g.measureText(t).width;let x=cx-w/2;for(const ch of t){const cw=g.measureText(ch).width;if(ch==='İ'){g.fillStyle=col;g.fillRect(x+cw*.36,yy-size*.2,cw*.25,size*.14)}x+=cw}}
function title(cx,y,size,lines){g.textAlign='center';g.textBaseline='top';g.font=`${size}px PS2P`;lines.forEach((t,i)=>{const yy=y+i*size*1.32;
  g.fillStyle='#000';for(const[a,b]of[[-1,-1],[1,-1],[-1,1],[1,1]])g.fillText(fixI(t),cx+a*size*.06,yy+b*size*.06);g.fillStyle='#7d1a21';g.fillText(fixI(t),cx+size*.1,yy+size*.1);g.fillStyle='#000';g.fillText(fixI(t),cx+size*.06,yy+size*.06);const T=fixI(t);g.fillStyle='#f0b232';g.fillText(T,cx,yy);g.textAlign='left';dots(t,cx,yy,size,'#f0b232');g.textAlign='center'})}
function ribbon(cx,y,text,size){g.font=`${size}px PS2P`;const w=g.measureText(text).width+size*2.4,h=size*2.4;g.fillStyle='#9a5f0e';g.fillRect(cx-w/2,y+6,w,h);g.fillStyle='#f0b232';g.fillRect(cx-w/2-5,y-5,w+10,h+10);g.fillStyle='#d33a2e';g.fillRect(cx-w/2,y,w,h);g.fillStyle='#fff';g.textAlign='center';g.textBaseline='middle';g.fillText(fixI(text),cx,y+h/2+size*.08);g.textBaseline='middle';dots(text,cx,y+h/2+size*.08-size*.4,size,'#fff')}
document.fonts.load('40px PS2P','KAPTANMECİT').then(()=>{
 const[W,H]=S;
 if(tur==='ikon'||tur==='ikon-512'){const k=W/1024;stripes(W,H,8);
   g.fillStyle='rgba(255,255,255,.55)';g.fillRect(0,H*.78,W,6*k);// orta çizgi değil, saha çizgisi
   ball(W*.5,H*.46,Math.round(34*k));armband(W*.56,H*.62,W*.3,H*.17)}
 if(tur==='ikon-on'){const k=W/1024;ball(W*.5,H*.46,Math.round(24*k));armband(W*.55,H*.58,W*.22,H*.12)}
 if(tur==='splash'){g.fillStyle='#0d2416';g.fillRect(0,0,W,H);ball(W/2,H*.42,24);title(W/2,H*.53,110,['KAPTAN','MECİT'])}
 if(tur==='feature'){stripes(W,H,6);g.fillStyle='rgba(0,0,0,.22)';g.fillRect(0,0,W,H);ball(W*.17,H*.5,13);armband(W*.2,H*.62,W*.12,H*.17);title(W*.62,H*.16,62,['KAPTAN','MECİT']);ribbon(W*.62,H*.72,'NOSTALJİK FUTBOL',20)}
 document.title='hazir';
});
</script></body></html>
