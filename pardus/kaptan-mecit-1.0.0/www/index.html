/* Layout: Malazgirt çizgisinde sade oyun menüsü — ortada logo, altta büyük altın düğme ve iki yan düğme; alt ekranlarda üst bar + geri. Zemin çim şeritleri. */
:root{

  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--night);color:#fff;font-family:var(--f);font-size:15px;line-height:1.4;overscroll-behavior:none;-webkit-user-select:none;user-select:none}
button{font-family:var(--f);color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
#app{min-height:100%;background:repeating-linear-gradient(180deg,var(--grass) 0 56px,var(--grass-2) 56px 112px);}
.screen{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;align-items:center;padding:calc(14px + var(--safe-t)) max(16px,env(safe-area-inset-right,0px)) calc(18px + var(--safe-b)) max(16px,env(safe-area-inset-left,0px));gap:14px;max-width:620px;margin:0 auto}
.veil{background:radial-gradient(120% 70% at 50% 25%,rgba(0,0,0,0) 0,rgba(0,0,0,.35) 100%)}
/* logo */
.logo{text-align:center;display:flex;flex-direction:column;align-items:center;margin-top:5vh;gap:10px}
.logo .ball{width:64px;height:64px;image-rendering:pixelated;filter:drop-shadow(0 4px 0 rgba(0,0,0,.35))}
.logo h1{margin:0;font-family:var(--f-px);font-weight:400;font-size:clamp(30px,10vw,52px);line-height:1.05;color:var(--gold);letter-spacing:2px;
  text-shadow:4px 4px 0 var(--red-d),-2px -2px 0 #000,2px -2px 0 #000,-2px 2px 0 #000,2px 2px 0 #000}
.ribbon{background:linear-gradient(180deg,#e2463a,var(--red));border:3px solid var(--gold);border-radius:8px;padding:8px 16px 6px;font-family:var(--f-px);font-size:clamp(11px,3.4vw,14px);letter-spacing:.1em;box-shadow:0 4px 0 var(--gold-d)}
.idot{position:relative;display:inline-block}.idot::after{content:'';position:absolute;left:30%;top:-.2em;width:.3em;height:.15em;background:currentColor}
.logo h1 .idot::after{box-shadow:.08em .08em 0 #7d1a21}
.spacer{flex:1;min-height:20px}
.stack{width:100%;max-width:440px;display:flex;flex-direction:column;gap:14px}
.meta{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.pill{background:rgba(0,0,0,.35);border:2px solid rgba(255,255,255,.25);border-radius:999px;padding:4px 12px;font-weight:800;font-size:14px;display:flex;align-items:center;gap:6px}
.pill i{width:12px;height:12px;display:inline-block;border:1px solid #fff;border-radius:2px}
.big{border:0;border-radius:18px;padding:14px 22px 12px;font-family:var(--f-px);font-size:clamp(17px,5vw,22px);color:#fff;letter-spacing:.04em;line-height:1.2;
  background:linear-gradient(180deg,#ffcf55,var(--gold) 45%,#d8871a);box-shadow:0 7px 0 var(--gold-d),0 12px 20px rgba(0,0,0,.3);text-shadow:2px 2px 0 rgba(120,60,0,.7)}
.big small{display:block;font-family:var(--f);font-weight:800;font-size:13px;letter-spacing:.02em;margin-top:6px;text-shadow:none;opacity:.95}
.big:active{transform:translateY(5px);box-shadow:0 2px 0 var(--gold-d)}
.big:disabled{filter:grayscale(.8);opacity:.6}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.alt{border:0;border-radius:14px;padding:12px 12px 10px;font-family:var(--f-px);font-size:12px;line-height:1.4;color:#fff;background:linear-gradient(180deg,#e2463a,var(--red));box-shadow:0 5px 0 var(--red-d)}
.alt.dark{background:linear-gradient(180deg,#2c5590,var(--navy));box-shadow:0 5px 0 var(--navy-d)}
.alt.ghost{background:rgba(0,0,0,.3);box-shadow:0 4px 0 rgba(0,0,0,.35)}
.alt:active{transform:translateY(4px);box-shadow:0 1px 0 rgba(0,0,0,.4)}
.credit{font-size:13px;font-weight:700;opacity:.85;text-align:center;margin:2px 0 0}
/* üst bar */
.topbar{width:100%;display:flex;align-items:center;gap:10px}
.back{width:46px;height:46px;flex:none;border:0;border-radius:12px;background:rgba(0,0,0,.35);font-size:28px;font-weight:800;line-height:1;box-shadow:0 4px 0 rgba(0,0,0,.35)}
.topbar h2{flex:1;margin:0;font-family:var(--f-px);font-weight:400;font-size:15px;line-height:1.4;text-shadow:2px 2px 0 #000;min-width:0}
.topbar h2 small{display:block;font-family:var(--f);font-size:12px;font-weight:700;opacity:.85;text-shadow:none}
/* kâğıt kartlar */
.card{width:100%;background:var(--paper);color:var(--ink);border-radius:16px;box-shadow:0 5px 0 var(--paper-d);padding:14px;display:flex;flex-direction:column;gap:12px;min-width:0}
.card h3{margin:0;font-family:var(--f-px);font-weight:400;font-size:12px;color:var(--navy);line-height:1.4}
.card p{margin:0}
.dim{color:var(--muted)}
.vs{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;text-align:center}
.vs .side{display:flex;flex-direction:column;align-items:center;gap:6px;font-weight:800;font-size:15px;line-height:1.15;min-width:0}
.vs .side .kit{width:54px;height:48px}
.vs .side .tag{font-family:var(--f-px);font-size:9px;padding:4px 7px;border-radius:6px;color:#fff;background:var(--grass-d)}
.vs .side .tag.o{background:var(--red)}
.vs .mid{font-family:var(--f-px);font-size:16px;color:var(--muted)}
.vs .mid.sc{font-size:26px;color:var(--ink)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:2px solid var(--paper-d);background:#fff;color:var(--ink);border-radius:999px;padding:5px 12px;font-weight:800;font-size:13px}
.chip.on{background:var(--navy);border-color:var(--navy);color:#fff}
.seg2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg2 button{border:2px solid var(--paper-d);background:#fff;border-radius:12px;padding:8px;font-weight:800;color:var(--ink);display:flex;align-items:center;justify-content:center;gap:8px;min-width:0}
.seg2 button .kit{width:22px;height:20px;flex:none}
.seg2 button span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.seg2 button.on{border-color:var(--grass-d);background:#e7f5e3}
.seg2 button.on.o{border-color:var(--red);background:#fde9e6}
.teams{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:7px}
.tm{display:flex;align-items:center;gap:7px;background:#fff;border:2px solid #eadfc6;border-radius:10px;padding:6px 8px;text-align:left;min-width:0;color:var(--ink)}
.tm b{font-size:13px;font-weight:800;line-height:1.15;display:block}
.tm small{display:block;font-size:11px;color:var(--muted);font-weight:700}
.tm.on{border-color:var(--grass-d);background:#e7f5e3}
.tm.op{border-color:var(--red);background:#fde9e6}
.tm .kit{flex:0 0 auto;width:26px;height:24px}
.stars{color:#e0a020;letter-spacing:-1px;font-size:11px}
.sticky{position:sticky;bottom:calc(10px + var(--safe-b));width:100%;max-width:440px;z-index:5}
/* tablo */
.tw{overflow-x:auto;margin:0 -4px}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th{font-size:11px;color:var(--muted);font-weight:800;text-align:left;padding:4px 5px;white-space:nowrap;border-bottom:2px solid #eadfc6}
td{padding:4px 5px;border-bottom:1px solid #f0e6d0;white-space:nowrap;font-size:14px}
tr.me td{background:#e7f5e3;font-weight:900}
td.c,th.c{text-align:center}
.pos{color:var(--muted);font-weight:800;width:24px}
.pts{font-weight:900}
tr.z1 td:first-child{box-shadow:inset 4px 0 var(--gold)} tr.z4 td:first-child{box-shadow:inset 4px 0 var(--navy)} tr.zd td:first-child{box-shadow:inset 4px 0 var(--red)}
.tname{display:flex;align-items:center;gap:6px}
.tname .kit{width:18px;height:16px}
.form{display:inline-flex;gap:3px}
.form b{width:18px;height:18px;border-radius:4px;display:inline-flex;align-items:center;justify-content:center;font-size:11px;color:#fff;background:#9a9384}
.form b.G{background:var(--grass-d)} .form b.M{background:var(--red)}
.res{display:flex;flex-direction:column}
.res div{display:grid;grid-template-columns:1fr 44px 1fr;gap:6px;font-size:13px;padding:5px 2px;border-bottom:1px dashed #eadfc6}
.res div span:first-child{text-align:right}
.res div b{text-align:center;font-weight:900}
.res div.me{background:#e7f5e3;font-weight:800}
.kv{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.kv div{background:#fff;border:2px solid #eadfc6;border-radius:10px;padding:6px 4px}
.kv small{display:block;font-size:11px;color:var(--muted);font-weight:800}
.kv b{font-family:var(--f-px);font-size:14px}
.verdict{align-self:center;font-family:var(--f-px);font-size:12px;color:#fff;padding:7px 12px;border-radius:8px;background:#9a9384}
.verdict.w{background:var(--grass-d)} .verdict.l{background:var(--red)}
.howto ul{margin:0;padding-left:18px}.howto li{margin:6px 0}
.kbd{display:inline-block;font-family:var(--f-px);font-size:10px;background:var(--ink);color:#fff;border-radius:4px;padding:3px 5px;margin:0 1px}

/* MAÇ EKRANI */
#game{position:fixed;inset:0;background:#0b1a10;z-index:50;touch-action:none;user-select:none;-webkit-user-select:none;overflow:hidden}
#cv{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);image-rendering:pixelated;image-rendering:crisp-edges;display:block}

.sb > *{display:flex;align-items:center;padding:6px 7px}
.sb .tk{gap:5px}

.pause{position:absolute;right:calc(8px + env(safe-area-inset-right,0px));top:calc(6px + var(--safe-t));z-index:4;width:38px;height:34px;border:2px solid #fff;background:#000a;color:#fff;font-family:var(--f-px);font-size:11px;cursor:pointer}

.banner .s{font-family:var(--f-px);font-size:11px;color:#fff;background:var(--bc,#000c);border:2px solid #fff;padding:7px 10px;max-width:92vw;text-align:center;line-height:1.6}
.banner .t.sm{font-size:22px}
@keyframes pop{from{transform:scale(.3)}to{transform:scale(1)}}
.ctl{position:absolute;inset:0;z-index:2}
.joy{position:absolute;width:110px;height:110px;border-radius:50%;border:3px solid #ffffff55;background:#ffffff14;transform:translate(-50%,-50%);pointer-events:none}
.joy i{position:absolute;left:50%;top:50%;width:46px;height:46px;border-radius:50%;background:#ffffffaa;border:3px solid #fff;transform:translate(-50%,-50%)}
.btns{position:absolute;right:calc(14px + env(safe-area-inset-right,0px));bottom:calc(22px + var(--safe-b));display:flex;gap:14px;align-items:flex-end;z-index:3}

const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const rand=(a,b)=>a+Math.random()*(b-a);
function hashStr(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
function rng(seed){let a=seed>>>0;return()=>{a=(a+0x6D2B79F5)>>>0;let t=a;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296}}
function poisson(l){const L=Math.exp(-l);let k=0,p=1;do{k++;p*=Math.random()}while(p>L&&k<12);return k-1}
function hexRgb(h){h=h.replace('#','');return[parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)]}
function cdist(a,b){const A=hexRgb(a),B=hexRgb(b);return Math.hypot(A[0]-B[0],A[1]-B[1],A[2]-B[2])}
function shade(h,f){const[r,g,b]=hexRgb(h);const m=v=>clamp(Math.round(f<0?v*(1+f):v+(255-v)*f),0,255);return'#'+[m(r),m(g),m(b)].map(v=>v.toString(16).padStart(2,'0')).join('')}
const lum=h=>{const[r,g,b]=hexRgb(h);return(r*299+g*587+b*114)/1000};

function squad(t){
  const L=LEAGUES[t.lg],R=rng(hashStr(t.lg+t.id+'kadro')),used=new Set(),out=[];
  for(let i=0;i<11;i++){let n;do{n=L.fn[Math.floor(R()*L.fn.length)]+' '+L.ln[Math.floor(R()*L.ln.length)]}while(used.has(n));used.add(n);
    out.push({id:t.id+'-'+i,n,no:NUMS[i],pos:POS[i],skin:['#f1c9a5','#e0ac7e','#c68a5a','#8d5a3b','#f5d6b8'][Math.floor(R()*5)],hair:['#2a1a10','#4a2e1a','#1a1a1a','#7a4a20','#c8a050'][Math.floor(R()*5)]})}
  return out;
}

const SND={ctx:null,on:true,amb:null,
  init(){if(this.ctx)return;try{this.ctx=new(window.AudioContext||window.webkitAudioContext)();const n=this.ctx.sampleRate*2,b=this.ctx.createBuffer(1,n,this.ctx.sampleRate),d=b.getChannelData(0);for(let i=0;i<n;i++)d[i]=Math.random()*2-1;this.nb=b}catch(e){this.ctx=null}},
  ok(){if(!this.on)return false;this.init();if(!this.ctx)return false;if(this.ctx.state==='suspended')this.ctx.resume();return true},
  tone(f,d,type='square',v=.08,f2=null,at=0){if(!this.ok())return;const c=this.ctx,t=c.currentTime+at,o=c.createOscillator(),g=c.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g).connect(c.destination);o.start(t);o.stop(t+d+.02)},
  noise(d,v,ff,ftype='lowpass',at=0,attack=.005,q=1){if(!this.ok())return;const c=this.ctx,t=c.currentTime+at,s=c.createBufferSource(),f=c.createBiquadFilter(),g=c.createGain();s.buffer=this.nb;s.loop=true;f.type=ftype;f.frequency.value=ff;f.Q.value=q;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+attack);g.gain.exponentialRampToValueAtTime(.0001,t+d);s.connect(f).connect(g).connect(c.destination);s.start(t,Math.random());s.stop(t+d+.05)},
  whistle(n=1){if(!this.ok())return;const c=this.ctx;for(let i=0;i<n;i++){const long=i===n-1,d=long?.75:.28,t=c.currentTime+i*.42,o=c.createOscillator(),l=c.createOscillator(),lg=c.createGain(),g=c.createGain();o.type='sine';o.frequency.value=2850;l.frequency.value=34;lg.gain.value=120;l.connect(lg).connect(o.frequency);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.12,t+.02);g.gain.setValueAtTime(.12,t+d-.05);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g).connect(c.destination);o.start(t);l.start(t);o.stop(t+d+.02);l.stop(t+d+.02)}},
  kick(p=1){this.noise(.07,.25*p,1100);this.tone(140,.09,'sine',.25*p,55)},
  bounce(){this.tone(220,.04,'triangle',.06,160)},
  net(){this.noise(.45,.22,1800,'bandpass',0,.01,.8)},
  roar(){this.noise(2.8,.32,650,'bandpass',0,.35,.6);this.noise(2.2,.12,1400,'bandpass',.1,.4,.9)},
  ooh(){this.noise(1.1,.16,520,'bandpass',0,.2,.7)},
  jingle(){[523,659,784,1047,784,1047].forEach((f,i)=>this.tone(f,.13,'square',.06,null,i*.11))},
  sad(){[392,370,349,330].forEach((f,i)=>this.tone(f,.2,'square',.05,null,i*.18))},
  click(){this.tone(880,.04,'square',.04)},
  ambStart(){if(!this.ok()||this.amb)return;const c=this.ctx,s=c.createBufferSource(),f=c.createBiquadFilter(),g=c.createGain();s.buffer=this.nb;s.loop=true;f.type='bandpass';f.frequency.value=500;f.Q.value=.5;g.gain.value=.025;s.connect(f).connect(g).connect(c.destination);s.start();this.amb={s,g}},
  ambStop(){if(this.amb){try{this.amb.s.stop()}catch(e){}this.amb=null}}
};

function fixturesFor(ids){
  const n=ids.length,arr=ids.slice(),rounds=[];
  for(let r=0;r<n-1;r++){const w=[];for(let i=0;i<n/2;i++){const a=arr[i],b=arr[n-1-i];w.push(r%2===0?{h:a,a:b,hs:null,as:null}:{h:b,a:a,hs:null,as:null})}rounds.push(w);arr.splice(1,0,arr.pop())}
  const second=rounds.map(w=>w.map(m=>({h:m.a,a:m.h,hs:null,as:null})));
  return rounds.concat(second);
}
function newCareer(lg,id){
  const ids=LEAGUES[lg].t.map(r=>r[0]);
  const R=rng(Date.now()&0xffffffff);const sh=ids.slice();for(let i=sh.length-1;i>0;i--){const j=Math.floor(R()*(i+1));[sh[i],sh[j]]=[sh[j],sh[i]]}
  S.car={lg,id,year:(S.car&&S.car.lg===lg&&S.car.id===id)?S.car.year+1:2026,week:1,fx:fixturesFor(sh),goals:{},last:null,done:false,history:(S.car&&S.car.history)||[]};
  persist();
}
function table(c){
  c=c||S.car;const T={};LEAGUES[c.lg].t.forEach(r=>T[r[0]]={id:r[0],o:0,g:0,b:0,m:0,a:0,y:0,p:0,form:[]});
  c.fx.forEach(w=>w.forEach(m=>{if(m.hs===null)return;const H=T[m.h],A=T[m.a];H.o++;A.o++;H.a+=m.hs;H.y+=m.as;A.a+=m.as;A.y+=m.hs;
    if(m.hs>m.as){H.g++;A.m++;H.p+=3;H.form.push('G');A.form.push('M')}else if(m.hs<m.as){A.g++;H.m++;A.p+=3;A.form.push('G');H.form.push('M')}else{H.b++;A.b++;H.p++;A.p++;H.form.push('B');A.form.push('B')}}));
  return Object.values(T).sort((x,y)=>y.p-x.p||(y.a-y.y)-(x.a-x.y)||y.a-x.a||team(c.lg,x.id).name.localeCompare(team(c.lg,y.id).name,'tr'));
}
function simScore(h,a){const lh=clamp(1.4+(h.str-a.str)*.16+.15,.25,4),la=clamp(1.1+(a.str-h.str)*.16,.2,4);return[poisson(lh),poisson(la)]}
function addGoals(c,tm,n){if(!n)return;const sq=squad(tm);const w={K:0,D:1,O:3,F:6};for(let i=0;i<n;i++){const tot=sq.reduce((s,p)=>s+w[p.pos],0);let r=Math.random()*tot;let pick=sq[10];for(const p of sq){r-=w[p.pos];if(r<=0){pick=p;break}}c.goals[pick.id]=(c.goals[pick.id]||0)+1}}
function myMatch(c){c=c||S.car;if(!c||c.week>c.fx.length)return null;return c.fx[c.week-1].find(m=>m.h===c.id||m.a===c.id)}
function finishWeek(myH,myA,scorers){
  const c=S.car,w=c.fx[c.week-1];
  for(const m of w){const H=team(c.lg,m.h),A=team(c.lg,m.a);
    if(m.h===c.id||m.a===c.id){m.hs=myH;m.as=myA;
      if(scorers){for(const pid of scorers.h)c.goals[pid]=(c.goals[pid]||0)+1;for(const pid of scorers.a)c.goals[pid]=(c.goals[pid]||0)+1}
      else{addGoals(c,H,m.hs);addGoals(c,A,m.as)}}
    else{const[x,y]=simScore(H,A);m.hs=x;m.as=y;addGoals(c,H,x);addGoals(c,A,y)}}
  c.last=c.week;c.week++;
  if(c.week>c.fx.length){c.done=true;const t=table(c);const pos=t.findIndex(r=>r.id===c.id)+1;c.history.push({year:c.year,team:c.id,lg:c.lg,pos,champ:team(c.lg,t[0].id).name});}
  persist();
}
function leaders(c,n=10){const all={};LEAGUES[c.lg].t.forEach(r=>{const t=team(c.lg,r[0]);squad(t).forEach(p=>all[p.id]={p,t})});return Object.entries(c.goals).filter(([k])=>all[k]).map(([k,g])=>({...all[k],g})).sort((a,b)=>b.g-a.g||a.p.n.localeCompare(b.p.n,'tr')).slice(0,n)}

function kitFor(A,B){ /* deplasman forması çakışırsa ikinci renk */
  let a={c1:A.c1,c2:A.c2},b={c1:B.c1,c2:B.c2};
  if(cdist(a.c1,b.c1)<120){b={c1:B.c2,c2:B.c1};if(cdist(a.c1,b.c1)<120)b={c1:'#f4f4f4',c2:'#222222'};if(cdist(a.c1,b.c1)<120)b={c1:'#222222',c2:'#f4f4f4'}}
  return[a,b];
}
function startMatch(me,opp,career,demo,opts){opts=opts||{};

     clock:0,dur:(demo?1.2:S.set.dur)*60,half:1,state:'pre',stateT:1.2,after:null,events:[],
     ball:{x:PW/2,y:PL/2,z:0,vx:0,vy:0,vz:0,owner:null,last:null,lastTeam:0,kicker:null,shot:null,intended:null,gkTried:false},
     P:[],ctrl:null,cam:{x:PW/2,y:PL/2},diff,input:{x:0,y:0,pas:false,sut:false,pasE:false,sutE:false},kickTeam:0,paused:false,acc:0,lastT:0,setPiece:null};
  for(let ti=0;ti<2;ti++){const sq=squad(M.T[ti].t);sq.forEach((s,i)=>M.P.push({team:ti,i,role:i===0?'G':POS[i],no:s.no,n:s.n,id:s.id,skin:s.skin,hair:s.hair,fx:FORM[i][0],fy:FORM[i][1],x:0,y:0,vx:0,vy:0,dx:0,dy:ti===0?-1:1,anim:0,cd:0,slide:0,stun:0,hold:0,dec:0}))}
  M.mac=!!opts.mac;applyDiff(diff);
  kickoff(0);
  $('#app').hidden=true;$('#game').hidden=false;
  document.documentElement.style.overflow='hidden';
  resize();buildPitch();hud();M._att=null;

  const band=(x0,y0,len,vert)=>{const n=Math.max(1,Math.round(len/35)),seg=len/n;for(let k=0;k<n;k++){const[t,bg,fg]=pool[ai++%pool.length];

function loop(now){
  if(!M)return;
  const dt=Math.min(.05,(now-M.lastT)/1000);M.lastT=now;
  if(!M.paused){M.acc+=dt;while(M.acc>=1/60){step(1/60);M.acc-=1/60;if(!M)return}}
  draw();
  requestAnimationFrame(loop);
}
function minute(){return Math.min(90,Math.floor(M.clock/M.dur*90))}
function step(dt){
  if(M.demo){M.input.x=0;M.input.y=0}else readInput();
  if(M.state!=='play'){
    M.stateT-=dt;
    for(const p of M.P){p.vx*=.85;p.vy*=.85;p.x+=p.vx*dt;p.y+=p.vy*dt;p.anim+=Math.hypot(p.vx,p.vy)*dt}
    if(M.state==='goal'||M.state==='half')moveOffBall(dt,true);
    if(M.stateT<=0){const f=M.after;M.after=null;if(f)f();else M.state='play';}
    M.input.pasE=M.input.sutE=false;
    camera(dt);return;
  }
  M.clock+=dt;
  const mn=minute();
  if(M.half===1&&M.clock>=M.dur/2){M.half=2;M.state='half';M.stateT=2.2;SND.whistle(2);banner('DEVRE','ARASI · '+M.T[0].score+'-'+M.T[1].score,null,true);M.after=()=>{kickoff(1);M.state='pre';M.stateT=.8;SND.whistle(1);hideBanner()};return}
  if(M.clock>=M.dur){M.state='over';SND.whistle(3);SND.ambStop();banner('MAÇ SONU',`${esc(M.T[0].t.short)} ${M.T[0].score} - ${M.T[1].score} ${esc(M.T[1].t.short)}`,null,true);setTimeout(()=>endMatch(false),2600);return}
  if(mn!==M._lm){M._lm=mn;hud()}
  M.manualT=Math.max(0,(M.manualT||0)-dt);
  updateCtrl();
  btnLabels();
  for(const p of M.P){p.cd=Math.max(0,p.cd-dt);p.scd=Math.max(0,(p.scd||0)-dt);p.stun=Math.max(0,p.stun-dt);p.dec-=dt}
  /* duran top */
  if(M.setPiece){M.setPiece.t+=dt;const sp=M.setPiece.p;if(M.ball.owner!==sp){M.setPiece=null}}
  /* oyuncular */
  for(const p of M.P)think(p,dt);
  for(const p of M.P)movePlayer(p,dt);
  separate();
  ballStep(dt);
  M.input.pasE=M.input.sutE=false;
  camera(dt);
}

  tx=clamp(tx,vw/2-4,PW-vw/2+4);ty=clamp(ty,vh*.2,PL-vh*.2);M.cam.x+=(tx-M.cam.x)*Math.min(1,dt*4);M.cam.y+=(ty-M.cam.y)*Math.min(1,dt*4)}

/* ---------- Kontrol değişimi ---------- */
function updateCtrl(){
  if(M.demo){M.ctrl=null;return}
  const b=M.ball,mine=M.P.filter(p=>p.team===0);
  if(b.owner&&b.owner.team===0){M.ctrl=b.owner;return}
  if(b.intended&&b.intended.team===0&&!b.owner){M.ctrl=b.intended;return}
  const field=mine.filter(p=>p.role!=='G');
  let best=null,bd=1e9;for(const p of field){const d=Math.hypot(p.x-b.x,p.y-b.y);if(d<bd){bd=d;best=p}}
  const cur=M.ctrl&&M.ctrl.team===0&&M.ctrl.role!=='G'?M.ctrl:null;
  if(M.input.pasE&&!(b.owner&&b.owner.team===0)){
    const ord=field.map(p=>({p,d:Math.hypot(p.x-b.x,p.y-b.y)})).sort((a,c)=>a.d-c.d);
    M.ctrl=(cur&&ord[0].p===cur&&ord[1])?ord[1].p:ord[0].p;M.input.pasE=false;M.manualT=1.5;SND.tone(1200,.05,'square',.05);return}
  if(!cur){M.ctrl=best;return}
  if(M.manualT>0||cur.slide>0)return;
  const cd=Math.hypot(cur.x-b.x,cur.y-b.y);
  const pushing=M.input.x||M.input.y;
  if(best!==cur&&((!pushing&&cd-bd>3.5)||(pushing&&cd-bd>8)||cd>18))M.ctrl=best;
}

function nearestOpp(p){let best=null,bd=1e9;for(const q of M.P)if(q.team!==p.team){const d=Math.hypot(q.x-p.x,q.y-p.y);if(d<bd){bd=d;best=q}}return[best,bd]}
function chasers(ti){ /* topa en yakın iki saha oyuncusu */
  const b=M.ball,list=M.P.filter(p=>p.team===ti&&p.role!=='G').map(p=>({p,d:Math.hypot(p.x-b.x,p.y-b.y)})).sort((a,c)=>a.d-c.d);return list}
function think(p,dt){
  const b=M.ball,T=M.T[p.team];
  p.tx=null;p.ty=null;p.run=0;p.mx=0;p.my=0;
  if(p.stun>0||p.slide>0)return;
  const human=p===M.ctrl&&T.human;
  if(human){
    const ix=M.input.x,iy=M.input.y;
    if(b.owner===p){
      if(M.setPiece&&M.setPiece.p===p&&M.setPiece.ko&&(ix||iy))M.setPiece=null;
      if(M.setPiece&&M.setPiece.p===p){p.mx=0;p.my=0;if(ix||iy){p.dx=ix;p.dy=iy}
        if(M.input.pasE)doPass(p,ix||p.dx,iy||p.dy);else if(M.input.sutE)doShoot(p,ix);else if(M.setPiece.t>(M.setPiece.ko?6:2.5))doPass(p,p.dx,p.dy);return}
      if(p.role==='G'){p.hold+=dt;if(M.input.pasE||M.input.sutE||p.hold>1.6){doPass(p,ix||0,iy||-1);return}}
      if(M.input.pasE){doPass(p,ix||p.dx,iy||p.dy);return}
      if(M.input.sutE){doShoot(p,ix);return}
      p.hold+=dt;p.mx=ix;p.my=iy;p.run=ix||iy?1:0;return;
    }
    if(M.input.sutE&&!(p.scd>0)){const bd2=Math.hypot(b.x-p.x,b.y-p.y);
      if(bd2<5.5){const lx=b.x+(b.owner?b.owner.vx*.18:b.vx*.12),ly=b.y+(b.owner?b.owner.vy*.18:b.vy*.12);doSlide(p,lx-p.x,ly-p.y)}else doSlide(p,ix||p.dx,iy||p.dy);return}
    if(ix||iy){p.mx=ix;p.my=iy;p.run=1;return}
    /* joystick boşta: boş topa kendisi koşar, yoksa yerinde bekler */
    if(!b.owner||b.intended===p){const t=interceptPoint(p);p.tx=t.x;p.ty=t.y;p.run=1;return}
    p.mx=0;p.my=0;return;
  }
  if(p.role==='G'){thinkGK(p,dt);return}
  if(b.owner===p){thinkCarrier(p,dt);return}
  /* top kimsede değilken / pasın hedefiysem */
  if(b.intended===p&&!b.owner){const t=interceptPoint(p);p.tx=t.x;p.ty=t.y;p.run=1;return}
  const ch=chasers(p.team);
  const humanTeamChaser=T.human&&M.ctrl;
  if(!teamHasBall(p.team)){
    /* savunma: en yakın oyuncu (insan takımında kontrol edilen oyuncu varsa onun dışında kimse) baskı yapar */
    const first=ch[0]&&ch[0].p,second=ch[1]&&ch[1].p;
    if(!humanTeamChaser&&first===p){const t=interceptPoint(p);p.tx=t.x;p.ty=t.y;p.run=1;
      if(b.owner&&b.owner.team!==p.team&&Math.hypot(p.x-b.x,p.y-b.y)<2.4&&!(p.scd>0)&&Math.random()<dt*(.5+M.T[p.team].skill*.6)*(M.T[p.team].human?.6:(!M.demo&&b.owner===M.ctrl?DIFF.slide[M.diff]:1)))doSlide(p,b.x-p.x,b.y-p.y);return}
    if(!b.owner&&!humanTeamChaser&&second===p){const t=interceptPoint(p);p.tx=t.x;p.ty=t.y;p.run=.8;return}
    if(humanTeamChaser&&!b.owner&&M.ctrl!==p&&first===p&&Math.hypot(p.x-b.x,p.y-b.y)<Math.hypot(M.ctrl.x-b.x,M.ctrl.y-b.y)-6){const t=interceptPoint(p);p.tx=t.x;p.ty=t.y;p.run=.9;return}
    if(humanTeamChaser&&b.owner&&b.owner.team!==p.team&&p!==M.ctrl){const helper=ch.find(x=>x.p!==M.ctrl);if(helper&&helper.p===p){const og=ownGoalY(p.team);const k=M.diff===2?.3:.15;p.tx=b.x+(PW/2-b.x)*.2;p.ty=b.y+(og-b.y)*k;p.run=.85;return}}
    /* ikinci baskıcı: rakip topla geliyorsa yolunu kes */
    if(b.owner&&second===p&&!humanTeamChaser&&(M.demo||M.diff===2||b.owner.team!==0)){const og=ownGoalY(p.team);p.tx=(b.x+PW/2)/2;p.ty=b.y+(og-b.y)*.25;p.run=.7;return}
  }
  const h=formTarget(p);p.tx=h.x;p.ty=h.y;p.run=Math.hypot(h.x-p.x,h.y-p.y)>6?.85:.55;
}
function moveOffBall(dt,soft){for(const p of M.P){const h=formTarget(p);const dx=h.x-p.x,dy=h.y-p.y,d=Math.hypot(dx,dy);if(d>.5){const s=3*(soft?.8:1);p.vx=dx/d*s;p.vy=dy/d*s;p.x+=p.vx*dt;p.y+=p.vy*dt;p.anim+=s*dt;p.dx=dx/d;p.dy=dy/d}}}
function formTarget(p){
  const b=M.ball,ti=p.team;
  const bf=ti===0?(PL-b.y)/PL:b.y/PL;
  const poss=teamHasBall(ti)||(!b.owner&&b.lastTeam===ti);
  if(p.role==='G'){const h=home(p);return h}
  let fy=p.fy*.75+bf*.45-.12+(poss?.09:-.03);
  if(p.role==='D')fy=clamp(fy,.06,.62);else if(p.role==='O')fy=clamp(fy,.12,.82);else fy=clamp(fy,.25,.9);
  let fx=p.fx+(((ti===0?b.x:PW-b.x)/PW)-.5)*.38;fx=clamp(fx,.05,.95);
  /* geniş alan: hücumda kanatlar açılır */
  if(poss&&(p.fx<.2||p.fx>.8))fx=p.fx<.5?Math.min(fx,.1):Math.max(fx,.9);
  return{x:ti===0?fx*PW:(1-fx)*PW,y:ti===0?PL-fy*PL:fy*PL};
}
function interceptPoint(p){
  const b=M.ball;if(b.owner)return{x:b.owner.x+b.owner.vx*.25,y:b.owner.y+b.owner.vy*.25};
  const sp=6.5*M.T[p.team].spd;let bx=b.x,by=b.y,vx=b.vx,vy=b.vy;
  for(let t=0;t<2.5;t+=.1){const f=Math.exp(-1.1*t);const px=b.x+vx*(1-f)/1.1,py=b.y+vy*(1-f)/1.1;if(Math.hypot(px-p.x,py-p.y)<=sp*t+.6){bx=px;by=py;break}bx=px;by=py}
  return{x:clamp(bx,-1,PW+1),y:clamp(by,-1,PL+1)};
}
function thinkCarrier(p,dt){
  const T=M.T[p.team],gy=goalYOf(p.team),f=fwdOf(p.team);
  if(M.setPiece&&M.setPiece.p===p){p.mx=0;p.my=0;if(M.setPiece.t>.9){const s=bestPass(p,0,f,true);if(s)doPass(p,s.x-p.x,s.y-p.y,s);else doPass(p,0,f)}return}
  const dG=Math.hypot(PW/2-p.x,gy-p.y);
  const[opp,od]=nearestOpp(p);
  p.hold+=dt;
  if(p.dec<=0){p.dec=rand(.22,.42);
    const ang=Math.abs(PW/2-p.x)/Math.max(1,Math.abs(gy-p.y));
    if(dG<24&&ang<1.3&&Math.random()<(dG<14?.75:.38)*T.skill+.08){doShoot(p,0);return}
    if((od<3.2&&Math.random()<.55)||(p.hold>2.6&&Math.random()<.5)||Math.random()<.07){const s=bestPass(p,0,f,false);if(s){doPass(p,s.x-p.x,s.y-p.y,s);return}}
  }
  /* sür: kaleye doğru, öndeki rakipten kaçarak */
  let tx=PW/2+(p.x-PW/2)*.55,ty=gy;
  let dx=tx-p.x,dy=ty-p.y,d=Math.hypot(dx,dy);dx/=d;dy/=d;
  if(opp&&od<6){const ax=opp.x-p.x,ay=opp.y-p.y;const ahead=(ax*dx+ay*dy)>0;if(ahead){const side=(ax*dy-ay*dx)>0?1:-1;const nx=dx+(-dy)*side*.9,ny=dy+dx*side*.9,n=Math.hypot(nx,ny);dx=nx/n;dy=ny/n}}
  if(p.x<4)dx=Math.abs(dx);if(p.x>PW-4)dx=-Math.abs(dx);
  p.mx=dx;p.my=dy;p.run=.92;
}
function bestPass(p,dx,dy,any){
  const dn=Math.hypot(dx,dy)||1;dx/=dn;dy/=dn;const f=fwdOf(p.team);
  let best=null,bs=-1e9;
  for(const q of M.P){if(q.team!==p.team||q===p)continue;const vx=q.x-p.x,vy=q.y-p.y,d=Math.hypot(vx,vy);if(d<4||d>48)continue;
    const cos=(vx*dx+vy*dy)/d;
    let s=(dx||dy?cos*2.2:0)-d/32+(vy*f>0?.012*vy*f:0)*(M.T[p.team].human&&p===M.ctrl?0:1);
    /* pas koridorunda rakip var mı */
    for(const o of M.P){if(o.team===p.team)continue;const ox=o.x-p.x,oy=o.y-p.y,t=clamp((ox*vx+oy*vy)/(d*d),0,1);const px=p.x+vx*t-o.x,py=p.y+vy*t-o.y;const dd=Math.hypot(px,py);if(dd<1.8)s-=1.1*(1-dd/1.8)*(t>.15?1:.3)}
    const[,od]=nearestOpp(q);if(od<2)s-=.5;
    if(q.role==='G')s-=1.2;
    if(dx||dy){if(cos<.25)s-=2}
    if(s>bs){bs=s;best=q}}
  return best;
}
function thinkGK(p,dt){
  const b=M.ball,og=ownGoalY(p.team),s=p.team===0?-1:1; /* s: sahanın içine doğru */
  if(b.owner===p){p.hold+=dt;p.mx=0;p.my=0;if(p.hold>1.1){const q=bestPass(p,0,s,true);if(q)doPass(p,q.x-p.x,q.y-p.y,q);else doPass(p,0,s)}return}
  const inBox=Math.abs(b.y-og)<BOXD&&b.x>(PW-BOXW)/2&&b.x<(PW+BOXW)/2;
  /* şut geliyor mu */
  if(!b.owner&&Math.sign(b.vy)===-s&&Math.abs(b.vy)>6){const t=(p.y-b.y)/b.vy;if(t>0&&t<1.6){const xc=b.x+b.vx*t;if(xc>GX0-2.5&&xc<GX1+2.5){p.tx=clamp(xc,GX0-1,GX1+1);p.ty=p.y;p.run=1.25;p.dive=1;return}}}
  p.dive=0;
  if(!b.owner&&inBox){const near=chasers(p.team)[0];const myd=Math.hypot(p.x-b.x,p.y-b.y);const[,od]=[0,M.P.filter(q=>q.team!==p.team).reduce((m,q)=>Math.min(m,Math.hypot(q.x-b.x,q.y-b.y)),99)];
    if(myd<od+1.5||myd<4){const t=interceptPoint(p);p.tx=t.x;p.ty=t.y;p.run=1;return}}
  if(b.owner&&b.owner.team!==p.team&&inBox&&Math.hypot(p.x-b.x,p.y-b.y)<7){p.tx=b.x;p.ty=b.y;p.run=.95;return}
  /* çizgi ile top arasında konum */
  const gx=PW/2,dx=b.x-gx,dy=b.y-og,d=Math.hypot(dx,dy)||1;const out=Math.min(3.2,d*.12);
  p.tx=clamp(gx+dx/d*out,GX0+.3,GX1-.3);p.ty=og+dy/d*out;if(Math.abs(p.ty-og)<.6)p.ty=og+s*.6;p.run=.7;
}

/* ---------- Eylemler ---------- */
function release(p,vx,vy,vz,intended){const b=M.ball;b.owner=null;b.x=p.x+p.dx*.5;b.y=p.y+p.dy*.5;b.vx=vx;b.vy=vy;b.vz=vz;b.z=Math.max(b.z,.05);b.last=p;b.lastTeam=p.team;b.kicker=p;b.intended=intended||null;b.gkTried=false;p.cd=.35;p.hold=0;M.setPiece=null}
function doPass(p,dx,dy,target){
  const q=target||bestPass(p,dx,dy,true);
  if(!q){const n=Math.hypot(dx,dy)||1;release(p,dx/n*14,dy/n*14,.5);SND.kick(.6);return}
  const d=Math.hypot(q.x-p.x,q.y-p.y);const lead=clamp(d/16,.2,1.1);
  let tx=q.x+q.vx*lead,ty=q.y+q.vy*lead;const D=Math.hypot(tx-p.x,ty-p.y);
  const T=M.T[p.team];const err=(1-T.skill)*D*.06;tx+=rand(-err,err);ty+=rand(-err,err);
  const ux=(tx-p.x)/D,uy=(ty-p.y)/D;
  let v,vz=0;
  if(D>22){vz=4.5+D*.07;const ta=2*vz/18;v=D/(ta+.75)}else v=clamp(D*1.1+3.5,8,25);
  p.dx=ux;p.dy=uy;release(p,ux*v,uy*v,vz,q);SND.kick(.7);
}
function doShoot(p,aimX){
  const gy=goalYOf(p.team),f=fwdOf(p.team),T=M.T[p.team];
  const dG=Math.hypot(PW/2-p.x,gy-p.y);
  if(dG>36){/* uzun top */const q=bestPass(p,0,f,true);if(q&&Math.random()<.6){doPass(p,q.x-p.x,q.y-p.y,q);return}release(p,rand(-3,3),f*22,7);SND.kick(.9);return}
  const human=T.human&&p===M.ctrl;
  let ax=PW/2+(human?aimX*2.9:rand(-2.6,2.6));
  const gk=M.P.find(q=>q.team!==p.team&&q.role==='G');
  if(!human&&gk){ax=gk.x>PW/2?PW/2-rand(1.4,3.1):PW/2+rand(1.4,3.1)}
  const acc=T.skill*(human?1.02:1);const err=(1.15-acc)*(1.2+dG*.11);ax+=rand(-err,err);
  const tz=rand(.2,2.2);
  const dx=ax-p.x,dy=gy-p.y,d=Math.hypot(dx,dy);const v=22+T.str*.5;
  const t=d/v;const vz=(tz+9*t*t)/t;
  p.dx=dx/d;p.dy=dy/d;release(p,dx/d*v,dy/d*v,clamp(vz,1,8));M.ball.shot={team:p.team,t:0};SND.kick(1.2);
}
function doSlide(p,dx,dy){const n=Math.hypot(dx,dy)||1;p.dx=dx/n;p.dy=dy/n;p.slide=.42;p.scd=1.1;p.vx=p.dx*10.5;p.vy=p.dy*10.5;SND.noise(.18,.08,700)}

/* ---------- Hareket ---------- */
function movePlayer(p,dt){
  const T=M.T[p.team];let vx,vy;
  if(p.slide>0){p.slide-=dt;p.vx*=Math.pow(.15,dt);p.vy*=Math.pow(.15,dt);vx=p.vx;vy=p.vy;
    const b=M.ball;const d=Math.hypot(b.x-p.x,b.y-p.y);
    if(d<1.45&&b.z<1&&b.owner!==p){if(b.owner&&b.owner.team!==p.team){const o=b.owner;o.stun=.8;o.cd=.9;b.owner=null}if(!b.owner){const hum=!M.demo&&p===M.ctrl;if(hum){take(p);p.won=1;SND.kick(.5)}else{b.vx=p.dx*5+rand(-1.5,1.5);b.vy=p.dy*5+rand(-1.5,1.5);b.vz=.8;b.lastTeam=p.team;b.last=p;b.intended=null;b.shot=null;SND.kick(.5)}}}
    if(p.slide<=0){p.stun=M.ball.owner===p?0:.35;p.won=0}
  }else if(p.stun>0){vx=p.vx*.8;vy=p.vy*.8}
  else{
    const hum=!M.demo&&p===M.ctrl;const top=6.6*T.spd*(hum?1.1:(M.ball.owner===p?.9:1))*(p.role==='G'&&p.dive?1.15:1);
    let mx=0,my=0,sp=0;
    if(p.tx!=null){const dx=p.tx-p.x,dy=p.ty-p.y,d=Math.hypot(dx,dy);if(d>.35){mx=dx/d;my=dy/d;sp=top*p.run*Math.min(1,d/1.5)}}
    else if(p.mx||p.my){mx=p.mx;my=p.my;sp=top*(p.run||1)*Math.min(1,Math.hypot(p.mx,p.my)*1.15)}
    const tvx=mx*sp,tvy=my*sp,k=Math.min(1,dt*(M.ball.owner===p?7:9));
    p.vx+=(tvx-p.vx)*k;p.vy+=(tvy-p.vy)*k;vx=p.vx;vy=p.vy;
    const s=Math.hypot(vx,vy);if(s>.5){p.dx=vx/s;p.dy=vy/s}
  }
  p.x+=vx*dt;p.y+=vy*dt;
  p.x=clamp(p.x,-3,PW+3);p.y=clamp(p.y,-3,PL+3);
  if(p.role==='G'){const og=ownGoalY(p.team);if(p.team===0)p.y=Math.max(p.y,PL-BOXD-2);else p.y=Math.min(p.y,BOXD+2);}
  p.anim+=Math.hypot(vx,vy)*dt;
}
function separate(){const P=M.P;for(let i=0;i<P.length;i++)for(let j=i+1;j<P.length;j++){const a=P[i],b=P[j],dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy);if(d>0&&d<.9){const o=(.9-d)/2,ux=dx/d,uy=dy/d;if(a.slide<=0){a.x-=ux*o;a.y-=uy*o}if(b.slide<=0){b.x+=ux*o;b.y+=uy*o}}}}

/* ---------- Top ---------- */
function ballStep(dt){
  const b=M.ball;
  if(b.owner){const p=b.owner;const ph=p.anim*1.6;const off=.62+Math.sin(ph)*.12;b.x=p.x+p.dx*off;b.y=p.y+p.dy*off;b.z=0;b.vx=p.vx;b.vy=p.vy;b.vz=0;b.lastTeam=p.team;b.last=p;
    /* top kapma */
    for(const q of M.P){if(q.team===p.team||q.stun>0||q.slide>0||q.cd>0)continue;const d=Math.hypot(q.x-b.x,q.y-b.y);if(d<.85){
      const Tq=M.T[q.team],Tp=M.T[p.team];
      if(Tp.human&&p===M.ctrl&&p.hold<.6)continue;
      let rate=(1.1+Tq.skill-Tp.skill*.6)*(Tq.human?(q===M.ctrl?2.6:1.25):1)*(Tp.human&&p===M.ctrl?DIFF.steal[M.diff]:1);
      if(p.role==='G')rate*=.2;
      if(Math.random()<rate*dt*2.2){b.owner=q;q.hold=0;p.cd=.7;p.stun=.25;b.intended=null;M.setPiece=null;SND.kick(.4);break}}}
    return;
  }
  const sp0=Math.hypot(b.vx,b.vy);
  b.x+=b.vx*dt;b.y+=b.vy*dt;
  if(b.z>0||b.vz>0){b.vz-=18*dt;b.z+=b.vz*dt;const dr=Math.pow(.88,dt);b.vx*=dr;b.vy*=dr;if(b.z<=0){b.z=0;if(b.vz<-2.5){b.vz=-b.vz*.42;SND.bounce()}else b.vz=0}}
  else{const f=Math.exp(-1.15*dt);b.vx*=f;b.vy*=f}
  if(b.shot)b.shot.t+=dt;
  if(Math.hypot(b.vx,b.vy)<.6&&b.z===0){b.vx=b.vy=0}
  /* kaleci kurtarışı */
  for(const g of M.P){if(g.role!=='G'||g.cd>0)continue;const d=Math.hypot(g.x-b.x,g.y-b.y);const reach=1.25+(g.dive?.9:0);
    if(d<reach&&b.z<2.7){if(b.gkTried&&b.gkTried===g)continue;b.gkTried=g;
      const towards=g.team===0?b.vy>0:b.vy<0;const sp=Math.hypot(b.vx,b.vy);
      if(!towards||sp<9){take(g);return}
      const Tg=M.T[g.team];let ps=.48+Tg.skill*.36-(sp-20)*.012-(b.z>1.9?.12:0)+(d<.8?.18:0);if(Tg.human)ps+=[.14,.07,.02][M.diff];if(!Tg.human&&M.T[1-g.team].human)ps+=DIFF.gk[M.diff];
      if(Math.random()<ps){if(sp<21&&Math.random()<.55){take(g);SND.ooh()}else{b.vx=-b.vx*.25+rand(-6,6);b.vy=-b.vy*.35;b.vz=2.5;b.shot=null;b.lastTeam=g.team;b.last=g;b.intended=null;SND.kick(.6);SND.ooh()}g.cd=.4;return}
      else{g.cd=.6}}}
  /* gol / out */
  const inGoalX=b.x>GX0&&b.x<GX1;
  if(b.y<0||b.y>PL){
    const ti=b.y<0?0:1; /* kim attı (bu kaleye hücum eden takım) */
    if(inGoalX&&b.z<GH){const k=b.kicker;scoreGoal(ti,k&&k.team===ti?k:null,false,k&&k.team!==ti?k:null);return}
    if(b.lastTeam===ti){goalKick(1-ti)}else cornerKick(ti,b.x<PW/2?0:PW);
    return}
  if(b.x<0||b.x>PW){throwIn(1-b.lastTeam,clamp(b.x,0,PW),clamp(b.y,1,PL-1));return}
  /* topu alma */
  let best=null,bd=1e9;
  for(const p of M.P){if(p.cd>0||p.stun>0||p.role==='G')continue;const d=Math.hypot(p.x-b.x,p.y-b.y);if(d<.95&&b.z<1.3&&d<bd){
      const sp=Math.hypot(b.vx,b.vy);if(sp>17&&p!==b.intended&&Math.random()>.12)continue;bd=d;best=p}}
  if(best){take(best);return}
}
function take(p){const b=M.ball;b.owner=p;p.hold=0;b.intended=null;b.shot=null;b.vx=b.vy=b.vz=0;b.z=0;b.lastTeam=p.team;b.last=p;p.dec=rand(.15,.35)}
function restart(ti,x,y,pickRole){
  const b=M.ball;b.vx=b.vy=b.vz=0;b.z=0;b.x=x;b.y=y;b.shot=null;b.intended=null;
  let p;if(pickRole==='G')p=M.P.find(q=>q.team===ti&&q.role==='G');else{p=null;let bd=1e9;for(const q of M.P)if(q.team===ti&&q.role!=='G'){const d=Math.hypot(q.x-x,q.y-y);if(d<bd){bd=d;p=q}}}
  p.x=x+(x<=0?-.4:x>=PW?.4:0);p.y=y+(y<=0?-.4:y>=PL?.4:0);p.vx=p.vy=0;
  /* rakipler 4 m uzaklaşsın */
  for(const q of M.P){if(q.team===ti)continue;const d=Math.hypot(q.x-x,q.y-y);if(d<5){const ux=(q.x-x)/(d||1),uy=(q.y-y)/(d||1);q.x=x+ux*5;q.y=y+uy*5}}
  const cx=PW/2,cy=y<PL/2?Math.max(y,10):Math.min(y,PL-10);const dx=cx-p.x,dy=cy-p.y,d=Math.hypot(dx,dy)||1;p.dx=dx/d;p.dy=dy/d;
  b.owner=p;p.hold=0;p.cd=0;b.lastTeam=ti;M.setPiece={p,t:0};
  if(p.team===0&&!M.demo)M.ctrl=p;

}
function throwIn(ti,x,y){restart(ti,x<=0?0:PW,y);SND.whistle(1)}
function cornerKick(ti,x){const y=ti===0?0:PL;restart(ti,x<=0?.3:PW-.3,y===0?.3:PL-.3);SND.whistle(1);flash('KORNER')}
function goalKick(ti){const y=ti===0?PL-5.5:5.5;restart(ti,PW/2+rand(-4,4),y,'G');SND.whistle(1)}
function scoreGoal(ti,scorer,silent,own){
  const T=M.T[ti];T.score++;
  const sq=M.P.filter(p=>p.team===ti);
  let who=scorer;if(!who){who=own?null:sq.filter(p=>p.role==='F'||p.role==='O')[Math.floor(Math.random()*6)]||sq[10]}
  const name=who?who.n:'Kendi kalesine ('+own.n+')';
  M.events.push({side:ti===0?'h':'a',min:Math.max(1,minute()),n:name,pid:who?who.id:null,team:ti});
  hud();
  if(silent)return;
  M.state='goal';M.stateT=3.2;
  SND.net();SND.roar();if(T.human)setTimeout(()=>SND.jingle(),400);else if(M.T[1-ti].human)setTimeout(()=>SND.sad(),500);
  $('#banner').style.top=ti===0?'64%':'30%';
  banner('GOOOL!',`${who?who.no+' · ':''}${esc(name)} · ${esc(T.t.short)} ${M.T[0].score}-${M.T[1].score}`,T.kit.c1);
  M.ball.vx*=.2;M.ball.vy*=.2;
  M.after=()=>{hideBanner();kickoff(1-ti);M.state='pre';M.stateT=.8;SND.whistle(1)};
}
let bannerTO=null;
function banner(t,s,col,small){const b=$('#banner');b.hidden=false;b.innerHTML=`<div class="t ${small?'sm':''}">${t}</div>${s?`<div class="s" style="--bc:${col?col+'dd':'#000c'}">${s}</div>`:''}`;clearTimeout(bannerTO);if(small)bannerTO=setTimeout(hideBanner,1900)}
function hideBanner(){const b=$('#banner');b.hidden=true;b.style.top=''}
function flash(t){banner(t,'',null,true)}
function hud(){if(!M)return;const a=M.T[0],b=M.T[1];$('#sb').innerHTML=`<span class="tk"><i style="background:${a.kit.c1}"></i>${esc(a.t.short)}</span><span class="scr">${a.score}-${b.score}</span><span class="tk">${esc(b.t.short)}<i style="background:${b.kit.c1}"></i></span><span class="min">${minute()}'</span>`}

function endMatch(quit){
  if(!M)return;const m=M;M=null;SND.ambStop();
  $('#game').hidden=true;$('#app').hidden=false;$('#pmenu').hidden=true;hideBanner();document.documentElement.style.overflow='';joyId=null;joyV={x:0,y:0};joy.hidden=true;
  if(m.demo){render();return}
  if(m.mac){const gf=quit?0:m.T[0].score,ga=quit?3:m.T[1].score;try{(window.parent&&window.parent!==window?window.parent:window).postMessage({ccm:'sonuc',gf,ga,quit:!!quit,win:gf>ga},'*')}catch(e){}
    if(window.parent===window){UI.result={H:m.T[0].t,A:m.T[1].t,hs:gf,as:ga,events:m.events,career:false,week:0,mine:{me:gf,op:ga}};go('result')}return}
  if(quit){go('quick');return}
  const me=m.T[0].t,opp=m.T[1].t;
  let H=me,A=opp,hs=m.T[0].score,as=m.T[1].score,events=m.events.map(e=>({...e}));
  if(m.career&&!m.career.home){H=opp;A=me;hs=m.T[1].score;as=m.T[0].score;events.forEach(e=>e.side=e.side==='h'?'a':'h')}
  if(m.career){const sc={h:[],a:[]};events.forEach(e=>{if(e.pid)sc[e.side].push(e.pid)});finishWeek(hs,as,sc)}
  const myScore=m.T[0].score,opScore=m.T[1].score;
  UI.result={H,A,hs,as,events,career:!!m.career,week:m.career?m.career.week:0,mine:{me:myScore,op:opScore}};
  /* galibiyet/mağlubiyet çipi benim açımdan */
  UI.result.hs=hs;UI.result.as=as;
  go('result');
  if(myScore>opScore)SND.jingle();
}

/* ---------- Çizim ---------- */
function draw(){
  if(!M)return;const g=cx,cam=M.cam;g.imageSmoothingEnabled=false;
  const ox=Math.round(IW/2-(cam.x+MRG)*SC),oy=Math.round(IH/2-(cam.y+MRG)*SC);
  g.fillStyle='#1d3b1c';g.fillRect(0,0,IW,IH);
  g.drawImage(pitchImg,ox,oy);
  const W=(x,y)=>[Math.round(IW/2+(x-cam.x)*SC),Math.round(IH/2+(y-cam.y)*SC)];
  const b=M.ball;
  const ents=M.P.map(p=>({y:p.y,p}));ents.push({y:b.y+.01,ball:true});ents.sort((a,c)=>a.y-c.y);
  /* top gölgesi önce */
  {const[sx,sy]=W(b.x,b.y);g.fillStyle='rgba(0,0,0,.35)';g.fillRect(sx-1,sy,3,1)}
  for(const e of ents){if(e.ball){drawBall(g,W);continue}drawPlayer(g,e.p,W)}
  /* kale direkleri üstte (ön direk) */
  drawGoalFront(g,W);
  drawRadar(g);
}
function drawGoalFront(g,W){ /* alt kalenin üst direği oyuncuların önünde görünsün */
  const[x0,y0]=W(GX0,PL),[x1]=W(GX1,PL);g.fillStyle='#ffffff';g.fillRect(x0-1,y0-Math.round(GH*SC*.9),2,Math.round(GH*SC*.9));g.fillRect(x1,y0-Math.round(GH*SC*.9),2,Math.round(GH*SC*.9));g.fillRect(x0-1,y0-Math.round(GH*SC*.9),x1-x0+3,2);
  const[a0,b0]=W(GX0,0),[a1]=W(GX1,0);g.fillRect(a0-1,b0-Math.round(GH*SC*.9),2,Math.round(GH*SC*.9));g.fillRect(a1,b0-Math.round(GH*SC*.9),2,Math.round(GH*SC*.9));g.fillRect(a0-1,b0-Math.round(GH*SC*.9),a1-a0+3,2);
}
function drawBall(g,W){const b=M.ball;const[sx,sy]=W(b.x,b.y);const zy=Math.round(b.z*SC*.9);const r=Math.floor(((b.owner?b.owner.anim:Math.hypot(b.x,b.y))*3))%2;
  g.fillStyle='#ffffff';g.fillRect(sx-1,sy-2-zy,3,3);g.fillStyle='#1d1d1d';g.fillRect(sx-1+r,sy-2-zy+r,1,1);g.fillStyle='#bbbbbb';g.fillRect(sx+1,sy-zy,1,1)}
function drawPlayer(g,p,W){
  const[sx,sy]=W(p.x,p.y);if(sx<-10||sx>IW+10||sy<-20||sy>IH+10)return;
  const kit=M.T[p.team].kit;const gk=p.role==='G';
  const shirt=gk?(p.team===0?'#f3d35a':'#3ec46d'):kit.c1,shorts=gk?'#1d1d1d':kit.c2,dark=shade(shirt,-.35);
  g.fillStyle='rgba(0,0,0,.32)';g.fillRect(sx-3,sy,7,2);
  if(p.slide>0||(p.stun>0&&p.stun>.3)){ /* yerde kayan oyuncu */
    const hz=p.dx>=0?1:-1;g.fillStyle=p.skin;g.fillRect(sx-5*hz-(hz<0?2:0),sy-4,3,3);g.fillStyle=shirt;g.fillRect(sx-3,sy-4,6,3);g.fillStyle=shorts;g.fillRect(sx+ (hz>0?2:-4),sy-4,3,3);g.fillStyle=p.skin;g.fillRect(sx+(hz>0?5:-7),sy-3,3,2);return}
  const moving=Math.hypot(p.vx,p.vy)>.6;const fr=moving?Math.floor(p.anim*2.2)%4:0;
  const back=p.dy<-.3; /* sırtı dönük */
  const top=sy-13;
  /* bacaklar */
  const l1=fr===1?-1:0,l2=fr===3?-1:0;
  g.fillStyle=p.skin;g.fillRect(sx-2,top+10+l1,1,2);g.fillRect(sx+1,top+10+l2,1,2);
  g.fillStyle=shirt;g.fillRect(sx-2,top+12+l1,1,1);g.fillRect(sx+1,top+12+l2,1,1);
  g.fillStyle='#111';g.fillRect(sx-2,top+13+l1,1,1);g.fillRect(sx+1,top+13+l2,1,1);
  /* şort */
  g.fillStyle=shorts;g.fillRect(sx-2,top+8,4,2);
  /* gövde */
  g.fillStyle=shirt;g.fillRect(sx-2,top+4,4,4);g.fillStyle=dark;g.fillRect(sx+1,top+4,1,4);
  /* kollar */
  const a1=moving&&fr%2?1:0;g.fillStyle=shirt;g.fillRect(sx-3,top+4,1,1);g.fillRect(sx+2,top+4,1,1);g.fillStyle=gk?'#ffffff':p.skin;g.fillRect(sx-3,top+5+a1,1,2);g.fillRect(sx+2,top+5+(1-a1),1,2);
  /* forma numarası (sırtta bir piksel çizgi) */
  if(back){g.fillStyle=lum(shirt)>140?'#1d1d1d':'#ffffff';g.fillRect(sx-1,top+5,2,2)}
  /* kafa */
  g.fillStyle=p.skin;g.fillRect(sx-2,top,4,4);g.fillStyle=p.hair;g.fillRect(sx-2,top,4,back?3:1);if(!back){g.fillRect(sx-2,top+1,1,1);g.fillStyle='#1d1d1d';const ex=p.dx>.4?1:p.dx<-.4?-1:0;g.fillRect(sx-1+ex,top+2,1,1);g.fillRect(sx+ex,top+2,1,1)}
  /* kontrol oku */
  if(p===M.ctrl&&!M.demo){const bl=Math.floor(performance.now()/180)%2;g.fillStyle=bl?'#ffe14d':'#ffffff';g.fillRect(sx-2,top-5,5,1);g.fillRect(sx-1,top-4,3,1);g.fillRect(sx,top-3,1,1)}
}
function drawRadar(g){
  const w=26,h=Math.round(w*PL/PW),x0=3,y0=22;
  g.fillStyle='rgba(0,0,0,.45)';g.fillRect(x0-1,y0-1,w+2,h+2);g.fillStyle='rgba(60,140,60,.55)';g.fillRect(x0,y0,w,h);
  g.fillStyle='rgba(255,255,255,.5)';g.fillRect(x0,y0+Math.round(h/2),w,1);
  for(const p of M.P){g.fillStyle=M.T[p.team].kit.c1;if(p===M.ctrl)g.fillStyle='#ffe14d';g.fillRect(x0+Math.round(p.x/PW*(w-1)),y0+Math.round(p.y/PL*(h-1)),1,1)}
  const b=M.ball;g.fillStyle='#ffffff';g.fillRect(x0+Math.round(clamp(b.x,0,PW)/PW*(w-1))-1,y0+Math.round(clamp(b.y,0,PL)/PL*(h-1))-1,2,2);
}

/* ===================== AÇILIŞ ===================== */
if(S.car)UI.clg=S.car.lg;
/* Champion Battle Manager maç modu: ?mac=1 ile lig maçı olarak açılır, sonucu ana oyuna yollar */
const MQ=new URLSearchParams(location.search);
if(MQ.get('mac')==='1'){
  const lgk=LG_ORDER.find(k=>LEAGUES[k].kurgu===MQ.get('lig'))||'tr';
  const ud=+MQ.get('ud')||0,zor=clamp(+(MQ.get('zor')||.5),0,1);
  const mk=(n,sh,c1,c2,str)=>({lg:lgk,id:sh,name:n,short:sh,c1,c2,str,city:''});
  const me=mk(MQ.get('ben')||'Takımın',MQ.get('bk')||'EV',MQ.get('b1')||'#d33a2e',MQ.get('b2')||'#ffffff',clamp(Math.round(6+ud/.55),3,9));
  const op=mk(MQ.get('rakip')||'Rakip',MQ.get('rk')||'DEP',MQ.get('r1')||'#1d3f6e',MQ.get('r2')||'#ffffff',clamp(Math.round(3+zor*6.5),3,9));
  if(MQ.get('ses')==='0'){SND.on=false}
  startMatch(me,op,null,false,{mac:true});
}else render();
if(/[?&#]demo/.test(location.href)){startMatch(team('tr','gs'),team('tr','fb'),null,true)}
window.__RL={get M(){return M},startMatch,team,S:()=>S,step,draw,endMatch};
